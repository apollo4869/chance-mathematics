<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 365" width="370" height="365" role="img" aria-label="The same event under two finite product laws; exact binomial masses"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><text x="185" y="24" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Same n, same event records Aₙ</text><rect x="250.625" y="51" width="18.75" height="28" fill="#f4e4ca" stroke="#a45b30" stroke-width="1.5"/><path d="M35 65L335 65" fill="none" stroke="#65756e" stroke-width="1"/><circle cx="35" cy="65" r="3" fill="#65756e" stroke="#65756e" stroke-width="2"/><text x="35" y="104" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">0</text><circle cx="185.0" cy="65" r="3" fill="#65756e" stroke="#65756e" stroke-width="2"/><text x="185.0" y="104" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">p=1/2</text><circle cx="260.0" cy="65" r="3" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><text x="260.0" y="104" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">q=3/4</text><circle cx="335" cy="65" r="3" fill="#65756e" stroke="#65756e" stroke-width="2"/><text x="335" y="104" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><text x="94" y="145" font-size="25" font-weight="bold" text-anchor="middle" fill="#173f39">Pₙ</text><circle cx="94" cy="216" r="51" fill="white" stroke="#ccd9d1" stroke-width="2"/><text x="94" y="302" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">≈ 1.65×10⁻¹⁷⁸</text><text x="276" y="145" font-size="25" font-weight="bold" text-anchor="middle" fill="#173f39">Qₙ</text><circle cx="276" cy="216" r="51" fill="white" stroke="#ccd9d1" stroke-width="2"/><path d="M276 216L276 165A51 51 0 1 1 275.99884088114345 165.00000001317213Z" fill="#16776d"/><text x="276" y="302" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">≈ 1 − 3.62×10⁻⁶</text><text x="94" y="333" font-size="14" font-weight="normal" text-anchor="middle" fill="#a45b30">Positive; may be subpixel</text><text x="276" y="333" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">Finite n: still below 1</text><text x="185" y="362" font-size="13" font-weight="normal" text-anchor="middle" fill="#65756e">Filled area is probability; tiny masses are not enlarged</text></svg>