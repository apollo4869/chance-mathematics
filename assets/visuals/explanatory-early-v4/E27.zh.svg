<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1171" width="900" height="1171" role="img" aria-label="先减有限均值，再接上无穷层"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="1171" fill="white"/><text x="25" y="43" font-size="26" font-weight="bold" text-anchor="start" fill="#173f39">先减有限均值，再接上无穷层</text><text x="210" y="89" font-size="19" font-weight="bold" text-anchor="middle" fill="#173f39">有限截断内补偿</text><svg x="25" y="105" width="370" height="455" viewBox="0 0 370 455"><text x="110" y="25" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">每层平均位移</text><text x="282" y="25" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">减去有限均值</text><text x="7" y="72" font-size="15" font-weight="normal" text-anchor="start" fill="#65756e">k=1</text><rect x="52.0" y="54" width="60.0" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="112.0" y="54" width="60.0" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="112" y="99" font-size="15" font-weight="normal" text-anchor="middle" fill="#16776d">2¹ × 2⁻¹ = 1</text><text x="196" y="73" font-size="27" font-weight="normal" text-anchor="middle" fill="#a45b30">−</text><rect x="222" y="54" width="120" height="24" fill="#fbf0df" stroke="#a45b30" stroke-width="1.5"/><text x="282" y="73" font-size="20" font-weight="normal" text-anchor="middle" fill="#a45b30">1</text><text x="7" y="126" font-size="15" font-weight="normal" text-anchor="start" fill="#65756e">k=2</text><rect x="52.0" y="108" width="30.0" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="82.0" y="108" width="30.0" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="112.0" y="108" width="30.0" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="142.0" y="108" width="30.0" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="112" y="153" font-size="15" font-weight="normal" text-anchor="middle" fill="#16776d">2² × 2⁻² = 1</text><text x="196" y="127" font-size="27" font-weight="normal" text-anchor="middle" fill="#a45b30">−</text><rect x="222" y="108" width="120" height="24" fill="#fbf0df" stroke="#a45b30" stroke-width="1.5"/><text x="282" y="127" font-size="20" font-weight="normal" text-anchor="middle" fill="#a45b30">1</text><text x="7" y="180" font-size="15" font-weight="normal" text-anchor="start" fill="#65756e">k=3</text><rect x="52.0" y="162" width="15.0" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="67.0" y="162" width="15.0" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="82.0" y="162" width="15.0" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="97.0" y="162" width="15.0" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="112.0" y="162" width="15.0" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="127.0" y="162" width="15.0" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="142.0" y="162" width="15.0" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="157.0" y="162" width="15.0" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="112" y="207" font-size="15" font-weight="normal" text-anchor="middle" fill="#16776d">2³ × 2⁻³ = 1</text><text x="196" y="181" font-size="27" font-weight="normal" text-anchor="middle" fill="#a45b30">−</text><rect x="222" y="162" width="120" height="24" fill="#fbf0df" stroke="#a45b30" stroke-width="1.5"/><text x="282" y="181" font-size="20" font-weight="normal" text-anchor="middle" fill="#a45b30">1</text><text x="7" y="234" font-size="15" font-weight="normal" text-anchor="start" fill="#65756e">k=4</text><rect x="52.0" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="59.5" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="67.0" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="74.5" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="82.0" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="89.5" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="97.0" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="104.5" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="112.0" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="119.5" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="127.0" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="134.5" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="142.0" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="149.5" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="157.0" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="164.5" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="112" y="261" font-size="15" font-weight="normal" text-anchor="middle" fill="#16776d">2⁴ × 2⁻⁴ = 1</text><text x="196" y="235" font-size="27" font-weight="normal" text-anchor="middle" fill="#a45b30">−</text><rect x="222" y="216" width="120" height="24" fill="#fbf0df" stroke="#a45b30" stroke-width="1.5"/><text x="282" y="235" font-size="20" font-weight="normal" text-anchor="middle" fill="#a45b30">1</text><text x="185" y="299" font-size="25" font-weight="normal" text-anchor="middle" fill="#65756e">⋮</text><text x="185" y="425" font-size="21" font-weight="bold" text-anchor="middle" fill="#173f39">先算这 4 个有限的差</text><text x="185" y="451" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">移去均值，不是删掉实际跳跃</text></svg><text x="660" y="89" font-size="19" font-weight="bold" text-anchor="middle" fill="#173f39">平方尾</text><svg x="475" y="105" width="370" height="455" viewBox="0 0 370 455"><text x="185" y="25" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">中心化后的方差可相加</text><rect x="42" y="66" width="126" height="126.0" fill="#16776d" stroke="white" stroke-width="1.5"/><text x="105.0" y="135.0" font-size="19" font-weight="normal" text-anchor="middle" fill="white">1/2</text><rect x="42" y="192.0" width="126" height="63.0" fill="#398b7c" stroke="white" stroke-width="1.5"/><text x="105.0" y="229.5" font-size="19" font-weight="normal" text-anchor="middle" fill="white">1/4</text><rect x="42" y="255.0" width="126" height="31.5" fill="#65a494" stroke="white" stroke-width="1.5"/><text x="105.0" y="276.75" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">1/8</text><rect x="42" y="286.5" width="126" height="15.75" fill="#88b8a7" stroke="white" stroke-width="1.5"/><rect x="42" y="302.25" width="126" height="15.75" fill="white" stroke="#a45b30" stroke-width="1.5"/><rect x="42" y="66" width="126" height="252" fill="none" stroke="#ccd9d1" stroke-width="1.5"/><text x="105" y="345" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">整个方框的面积 = 1</text><path d="M168 310.125L219 273" fill="none" stroke="#a45b30" stroke-width="1.5"/><text x="270" y="208" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">未加入的</text><text x="270" y="236" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">平方尾</text><text x="270" y="279" font-size="33" font-weight="bold" text-anchor="middle" fill="#a45b30">1/16</text><text x="185" y="395" font-size="23" font-weight="normal" text-anchor="middle" fill="#16776d">Var(Mᴺ₁) = 1 − 1/16</text><text x="185" y="438" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">均值归零，波动并没有归零</text></svg><text x="450" y="630" font-size="20" font-weight="bold" text-anchor="middle" fill="#173f39">终点与整段控制</text><svg x="265" y="650" width="370" height="292" viewBox="0 0 370 292"><text x="185" y="25" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">先比较两个有限截断 K&gt;N</text><text x="25" y="61" font-size="18" font-weight="normal" text-anchor="start" fill="#65756e">终点 t=1</text><path d="M45 81L325 81" fill="none" stroke="#ccd9d1" stroke-width="2"/><circle cx="325" cy="81" r="5" fill="#65756e" stroke="#65756e" stroke-width="2"/><text x="45" y="112" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">0</text><text x="325" y="112" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><text x="185" y="146" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">E|D(1)|² ≤ 0.0625</text><text x="25" y="183" font-size="18" font-weight="normal" text-anchor="start" fill="#16776d">整段 [0,1]</text><path d="M45 203L325 203" fill="none" stroke="#ccd9d1" stroke-width="2"/><rect x="45" y="195" width="280" height="16" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="45" y="234" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">0</text><text x="325" y="234" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><text x="185" y="268" font-size="20" font-weight="normal" text-anchor="middle" fill="#16776d">E sup |D(t)|² ≤ 0.25</text><text x="185" y="171" font-size="15" font-weight="normal" text-anchor="middle" fill="#a45b30">鞅结构 + Doob，才能控制整段</text></svg><path d="M25 962L875 962" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="25" y="992" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">模型沿用正文的二进时钟，k≥1，T=1。每层均值1、中心化方差2⁻ᵏ；图中分格是均值结构，不是模拟。M</text><text x="25" y="1016" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">ᴺ=Σₖ≤ᴺJₖ−N是两个有限量之差；原正跳和发散的依据是正文Chebyshev与Borel–Cantelli，不是仅凭</text><text x="25" y="1040" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">无限均值。平方尾vᴺ=Σₖ&gt;ᴺ2⁻ᵏ=2⁻ᴺ。先对两个有限截断K&gt;N比较D=Mᴷ−Mᴺ：终点二阶量=2⁻ᴺ−</text><text x="25" y="1064" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">2⁻ᴷ≤vᴺ；整段E sup₀≤t≤1|D(t)|²≤4vᴺ是鞅最大界，不是等式或确定路径误差。极限构造后才用</text><text x="25" y="1088" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Fatou传递估计。上确界界经Markov推出ucp；一般构造的局部一致a.s.版本还须正文可求和概率及选列论证</text><text x="25" y="1112" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">。蓝绿面积为已纳入方差，白色尾部保持真实面积，未人为放大。</text></svg>