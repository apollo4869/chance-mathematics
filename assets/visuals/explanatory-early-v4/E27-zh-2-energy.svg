<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 455" width="370" height="455" role="img" aria-label="Geometric centered variance and the exact unadded square tail"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><text x="185" y="25" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">中心化后的方差可相加</text><rect x="42" y="66" width="126" height="126.0" fill="#16776d" stroke="white" stroke-width="1.5"/><text x="105.0" y="135.0" font-size="19" font-weight="normal" text-anchor="middle" fill="white">1/2</text><rect x="42" y="192.0" width="126" height="63.0" fill="#398b7c" stroke="white" stroke-width="1.5"/><text x="105.0" y="229.5" font-size="19" font-weight="normal" text-anchor="middle" fill="white">1/4</text><rect x="42" y="255.0" width="126" height="63.0" fill="white" stroke="#a45b30" stroke-width="1.5"/><rect x="42" y="66" width="126" height="252" fill="none" stroke="#ccd9d1" stroke-width="1.5"/><text x="105" y="345" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">整个方框的面积 = 1</text><path d="M168 286.5L219 273" fill="none" stroke="#a45b30" stroke-width="1.5"/><text x="270" y="208" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">未加入的</text><text x="270" y="236" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">平方尾</text><text x="270" y="279" font-size="33" font-weight="bold" text-anchor="middle" fill="#a45b30">1/4</text><text x="185" y="395" font-size="23" font-weight="normal" text-anchor="middle" fill="#16776d">Var(Mᴺ₁) = 1 − 1/4</text><text x="185" y="438" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">均值归零，波动并没有归零</text></svg>