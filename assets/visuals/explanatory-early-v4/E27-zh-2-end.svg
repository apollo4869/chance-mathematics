<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 292" width="370" height="292" role="img" aria-label="Endpoint L2 versus whole-window maximal second-moment control"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><text x="185" y="25" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">先比较两个有限截断 K&gt;N</text><text x="25" y="61" font-size="18" font-weight="normal" text-anchor="start" fill="#16776d">终点 t=1</text><path d="M45 81L325 81" fill="none" stroke="#ccd9d1" stroke-width="2"/><circle cx="325" cy="81" r="8" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="45" y="112" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">0</text><text x="325" y="112" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><text x="185" y="146" font-size="20" font-weight="normal" text-anchor="middle" fill="#16776d">E|D(1)|² ≤ 0.25</text><text x="25" y="183" font-size="18" font-weight="normal" text-anchor="start" fill="#65756e">整段 [0,1]</text><path d="M45 203L325 203" fill="none" stroke="#ccd9d1" stroke-width="2"/><rect x="45" y="195" width="280" height="16" fill="white" stroke="#65756e" stroke-width="1.5"/><text x="45" y="234" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">0</text><text x="325" y="234" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><text x="185" y="268" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">E sup |D(t)|² ≤ 1</text><text x="185" y="171" font-size="15" font-weight="normal" text-anchor="middle" fill="#a45b30">鞅结构 + Doob，才能控制整段</text></svg>