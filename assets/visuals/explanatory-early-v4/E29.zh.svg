<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1056" width="900" height="1056" role="img" aria-label="换了权重，代价没有消失"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="1056" fill="white"/><text x="25" y="43" font-size="26" font-weight="bold" text-anchor="start" fill="#173f39">换了权重，代价没有消失</text><text x="210" y="89" font-size="19" font-weight="bold" text-anchor="middle" fill="#173f39">同一事件的两份权重</text><svg x="25" y="105" width="370" height="365" viewBox="0 0 370 365"><text x="185" y="24" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">同一n，同一批事件记录 Aₙ</text><rect x="241.25" y="51" width="37.5" height="28" fill="#f4e4ca" stroke="#a45b30" stroke-width="1.5"/><path d="M35 65L335 65" fill="none" stroke="#65756e" stroke-width="1"/><circle cx="35" cy="65" r="3" fill="#65756e" stroke="#65756e" stroke-width="2"/><text x="35" y="104" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">0</text><circle cx="185.0" cy="65" r="3" fill="#65756e" stroke="#65756e" stroke-width="2"/><text x="185.0" y="104" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">p=1/2</text><circle cx="260.0" cy="65" r="3" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><text x="260.0" y="104" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">q=3/4</text><circle cx="335" cy="65" r="3" fill="#65756e" stroke="#65756e" stroke-width="2"/><text x="335" y="104" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><text x="94" y="145" font-size="25" font-weight="bold" text-anchor="middle" fill="#173f39">Pₙ</text><circle cx="94" cy="216" r="51" fill="white" stroke="#ccd9d1" stroke-width="2"/><text x="94" y="302" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">≈ 6.55×10⁻¹⁸</text><text x="276" y="145" font-size="25" font-weight="bold" text-anchor="middle" fill="#173f39">Qₙ</text><circle cx="276" cy="216" r="51" fill="white" stroke="#ccd9d1" stroke-width="2"/><path d="M276 216L276 165A51 51 0 1 1 275.7081475626265 165.00083508375064Z" fill="#16776d"/><text x="276" y="302" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">≈ 1 − 9.11×10⁻⁴</text><text x="94" y="333" font-size="14" font-weight="normal" text-anchor="middle" fill="#a45b30">正概率，可能细于像素</text><text x="276" y="333" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">有限n仍不是概率1</text><text x="185" y="362" font-size="13" font-weight="normal" text-anchor="middle" fill="#65756e">实色面积是概率；未放大微小质量</text></svg><text x="660" y="89" font-size="19" font-weight="bold" text-anchor="middle" fill="#173f39">一条记录的回权</text><svg x="475" y="105" width="370" height="365" viewBox="0 0 370 365"><text x="185" y="24" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">挑一条记录，按它的H/T次数回权</text><rect x="30" y="62" width="232.5" height="43" fill="#16776d"/><rect x="262.5" y="62" width="77.5" height="43" fill="#a45b30"/><text x="146.25" y="90" font-size="18" font-weight="normal" text-anchor="middle" fill="white">H × 384</text><text x="301.25" y="90" font-size="16" font-weight="normal" text-anchor="middle" fill="white">T × 128</text><path d="M105 114L105 150" fill="none" stroke="#16776d" stroke-width="2"/><path d="M101.52027572711016 142.7964231811786L105 150" fill="none" stroke="#16776d" stroke-width="2"/><path d="M108.47972427288984 142.7964231811786L105 150" fill="none" stroke="#16776d" stroke-width="2"/><path d="M285 114L285 150" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M281.5202757271102 142.7964231811786L285 150" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M288.4797242728898 142.7964231811786L285 150" fill="none" stroke="#a45b30" stroke-width="2"/><text x="105" y="181" font-size="24" font-weight="normal" text-anchor="middle" fill="#16776d">× (2/3)ᴷ</text><text x="285" y="181" font-size="24" font-weight="normal" text-anchor="middle" fill="#a45b30">× 2ⁿ⁻ᴷ</text><path d="M105 197L105 217" fill="none" stroke="#16776d" stroke-width="2"/><path d="M285 197L285 217" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M105 217L285 217" fill="none" stroke="#65756e" stroke-width="1"/><path d="M185 217L185 241" fill="none" stroke="#16776d" stroke-width="2"/><path d="M181.52027572711015 233.7964231811786L185 241" fill="none" stroke="#16776d" stroke-width="2"/><path d="M188.47972427288985 233.7964231811786L185 241" fill="none" stroke="#16776d" stroke-width="2"/><text x="185" y="273" font-size="26" font-weight="bold" text-anchor="middle" fill="#173f39">Lₙ = 2ⁿ / 3ᴷ</text><text x="185" y="309" font-size="24" font-weight="normal" text-anchor="middle" fill="#16776d">≈ 8.18×10⁻³⁰</text><text x="185" y="354" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">这是单条记录的比值，不是事件概率</text></svg><text x="450" y="540" font-size="20" font-weight="bold" text-anchor="middle" fill="#173f39">每样本对数代价</text><svg x="265" y="560" width="370" height="225" viewBox="0 0 370 225"><text x="185" y="25" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">每样本回权率：−log Lₙ / n</text><path d="M30 110L340 110" fill="none" stroke="#ccd9d1" stroke-width="2"/><rect x="109.58161890252447" y="91" width="133.0350818309039" height="38" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><path d="M176.09915981797644 70L176.09915981797644 148" fill="none" stroke="#65756e" stroke-width="1.5" stroke-dasharray="3 3"/><text x="176.09915981797644" y="59" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">D</text><circle cx="176.09915981797644" cy="110" r="7" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><text x="176.09915981797644" y="173" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">0.13081</text><text x="185" y="211" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">窗口缩小 → 这段回权率逼近D</text></svg><text x="450" y="812" font-size="20" font-weight="normal" text-anchor="middle" fill="#16776d">有限事件率 ≈0.07728；渐近D ≈0.13081</text><path d="M25 847L875 847" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="25" y="877" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">固定模型p=1/2、q=3/4，n显示64、512、4096。δₙ=1/(2n¹ᐟ³)，Aₙ={|K/n−q|≤δₙ}；同一n下P/Q使</text><text x="25" y="901" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">用同一事件。概率均由有限二项求和精确建立，显示值四舍五入；小于像素的质量不放大、不视为0。</text><text x="25" y="925" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Pₙ/Qₙ对单条记录的密度比Lₙ=2ⁿ/3ᴷ，可随K变化，某些有限参数甚至可大于1；不能把整个事件回权成</text><text x="25" y="949" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">一个常数。以θ=log3、D=qlog3−log2，有exp[−n(D+θδₙ)]Qₙ(Aₙ)≤Pₙ(Aₙ)≤exp[−n(D−</text><text x="25" y="973" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">θδₙ)]Qₙ(Aₙ)。δₙ→0且Qₙ(Aₙ)→1才给速度n的极限D。选择单个频率格子不会使其Q概率趋1。本图</text><text x="25" y="997" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">没有把一般Cramér定理缩成可匹配倾斜的点。</text></svg>