<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 365" width="370" height="365" role="img" aria-label="A single ordered record has an explicit finite likelihood ratio"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><text x="185" y="24" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">挑一条记录，按它的H/T次数回权</text><rect x="30" y="62" width="232.5" height="43" fill="#16776d"/><rect x="262.5" y="62" width="77.5" height="43" fill="#a45b30"/><text x="146.25" y="90" font-size="18" font-weight="normal" text-anchor="middle" fill="white">H × 48</text><text x="301.25" y="90" font-size="16" font-weight="normal" text-anchor="middle" fill="white">T × 16</text><path d="M105 114L105 150" fill="none" stroke="#16776d" stroke-width="2"/><path d="M101.52027572711016 142.7964231811786L105 150" fill="none" stroke="#16776d" stroke-width="2"/><path d="M108.47972427288984 142.7964231811786L105 150" fill="none" stroke="#16776d" stroke-width="2"/><path d="M285 114L285 150" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M281.5202757271102 142.7964231811786L285 150" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M288.4797242728898 142.7964231811786L285 150" fill="none" stroke="#a45b30" stroke-width="2"/><text x="105" y="181" font-size="24" font-weight="normal" text-anchor="middle" fill="#16776d">× (2/3)ᴷ</text><text x="285" y="181" font-size="24" font-weight="normal" text-anchor="middle" fill="#a45b30">× 2ⁿ⁻ᴷ</text><path d="M105 197L105 217" fill="none" stroke="#16776d" stroke-width="2"/><path d="M285 197L285 217" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M105 217L285 217" fill="none" stroke="#65756e" stroke-width="1"/><path d="M185 217L185 241" fill="none" stroke="#16776d" stroke-width="2"/><path d="M181.52027572711015 233.7964231811786L185 241" fill="none" stroke="#16776d" stroke-width="2"/><path d="M188.47972427288985 233.7964231811786L185 241" fill="none" stroke="#16776d" stroke-width="2"/><text x="185" y="273" font-size="26" font-weight="bold" text-anchor="middle" fill="#173f39">Lₙ = 2ⁿ / 3ᴷ</text><text x="185" y="309" font-size="24" font-weight="normal" text-anchor="middle" fill="#16776d">≈ 2.31×10⁻⁴</text><text x="185" y="354" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">这是单条记录的比值，不是事件概率</text></svg>