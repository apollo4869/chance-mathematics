<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1152" width="900" height="1152" role="img" aria-label="Changing weights does not erase the cost"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="1152" fill="white"/><text x="25" y="43" font-size="26" font-weight="bold" text-anchor="start" fill="#173f39">Changing weights does not erase the cost</text><text x="210" y="89" font-size="19" font-weight="bold" text-anchor="middle" fill="#173f39">Same event under P and Q</text><svg x="25" y="105" width="370" height="365" viewBox="0 0 370 365"><text x="185" y="24" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Same n, same event records Aₙ</text><rect x="241.25" y="51" width="37.5" height="28" fill="#f4e4ca" stroke="#a45b30" stroke-width="1.5"/><path d="M35 65L335 65" fill="none" stroke="#65756e" stroke-width="1"/><circle cx="35" cy="65" r="3" fill="#65756e" stroke="#65756e" stroke-width="2"/><text x="35" y="104" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">0</text><circle cx="185.0" cy="65" r="3" fill="#65756e" stroke="#65756e" stroke-width="2"/><text x="185.0" y="104" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">p=1/2</text><circle cx="260.0" cy="65" r="3" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><text x="260.0" y="104" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">q=3/4</text><circle cx="335" cy="65" r="3" fill="#65756e" stroke="#65756e" stroke-width="2"/><text x="335" y="104" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><text x="94" y="145" font-size="25" font-weight="bold" text-anchor="middle" fill="#173f39">Pₙ</text><circle cx="94" cy="216" r="51" fill="white" stroke="#ccd9d1" stroke-width="2"/><text x="94" y="302" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">≈ 6.55×10⁻¹⁸</text><text x="276" y="145" font-size="25" font-weight="bold" text-anchor="middle" fill="#173f39">Qₙ</text><circle cx="276" cy="216" r="51" fill="white" stroke="#ccd9d1" stroke-width="2"/><path d="M276 216L276 165A51 51 0 1 1 275.7081475626265 165.00083508375064Z" fill="#16776d"/><text x="276" y="302" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">≈ 1 − 9.11×10⁻⁴</text><text x="94" y="333" font-size="14" font-weight="normal" text-anchor="middle" fill="#a45b30">Positive; may be subpixel</text><text x="276" y="333" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">Finite n: still below 1</text><text x="185" y="362" font-size="13" font-weight="normal" text-anchor="middle" fill="#65756e">Filled area is probability; tiny masses are not enlarged</text></svg><text x="660" y="89" font-size="19" font-weight="bold" text-anchor="middle" fill="#173f39">Reweight one ordered record</text><svg x="475" y="105" width="370" height="365" viewBox="0 0 370 365"><text x="185" y="24" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">Reweight one record by its H/T counts</text><rect x="30" y="62" width="232.5" height="43" fill="#16776d"/><rect x="262.5" y="62" width="77.5" height="43" fill="#a45b30"/><text x="146.25" y="90" font-size="18" font-weight="normal" text-anchor="middle" fill="white">H × 384</text><text x="301.25" y="90" font-size="16" font-weight="normal" text-anchor="middle" fill="white">T × 128</text><path d="M105 114L105 150" fill="none" stroke="#16776d" stroke-width="2"/><path d="M101.52027572711016 142.7964231811786L105 150" fill="none" stroke="#16776d" stroke-width="2"/><path d="M108.47972427288984 142.7964231811786L105 150" fill="none" stroke="#16776d" stroke-width="2"/><path d="M285 114L285 150" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M281.5202757271102 142.7964231811786L285 150" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M288.4797242728898 142.7964231811786L285 150" fill="none" stroke="#a45b30" stroke-width="2"/><text x="105" y="181" font-size="24" font-weight="normal" text-anchor="middle" fill="#16776d">× (2/3)ᴷ</text><text x="285" y="181" font-size="24" font-weight="normal" text-anchor="middle" fill="#a45b30">× 2ⁿ⁻ᴷ</text><path d="M105 197L105 217" fill="none" stroke="#16776d" stroke-width="2"/><path d="M285 197L285 217" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M105 217L285 217" fill="none" stroke="#65756e" stroke-width="1"/><path d="M185 217L185 241" fill="none" stroke="#16776d" stroke-width="2"/><path d="M181.52027572711015 233.7964231811786L185 241" fill="none" stroke="#16776d" stroke-width="2"/><path d="M188.47972427288985 233.7964231811786L185 241" fill="none" stroke="#16776d" stroke-width="2"/><text x="185" y="273" font-size="26" font-weight="bold" text-anchor="middle" fill="#173f39">Lₙ = 2ⁿ / 3ᴷ</text><text x="185" y="309" font-size="24" font-weight="normal" text-anchor="middle" fill="#16776d">≈ 8.18×10⁻³⁰</text><text x="185" y="354" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">A record likelihood ratio, not an event probability</text></svg><text x="450" y="540" font-size="20" font-weight="bold" text-anchor="middle" fill="#173f39">Per-sample log cost</text><svg x="265" y="560" width="370" height="225" viewBox="0 0 370 225"><text x="185" y="25" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Per-sample return cost: −log Lₙ / n</text><path d="M30 110L340 110" fill="none" stroke="#ccd9d1" stroke-width="2"/><rect x="109.58161890252447" y="91" width="133.0350818309039" height="38" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><path d="M176.09915981797644 70L176.09915981797644 148" fill="none" stroke="#65756e" stroke-width="1.5" stroke-dasharray="3 3"/><text x="176.09915981797644" y="59" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">D</text><circle cx="176.09915981797644" cy="110" r="7" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><text x="176.09915981797644" y="173" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">0.13081</text><text x="185" y="211" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">Shrinking window → these record costs approach D</text></svg><text x="450" y="812" font-size="20" font-weight="normal" text-anchor="middle" fill="#16776d">Finite event rate ≈0.07728; limiting D ≈0.13081</text><path d="M25 847L875 847" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="25" y="877" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Fixed p=1/2, q=3/4; displayed n are 64, 512, 4096. With δn=1/(2n^(1/3)),</text><text x="25" y="901" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">An={|K/n−q|≤δn}; P and Q use the same event at the same n. Finite binomial sums</text><text x="25" y="925" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">give exact probabilities, rounded for display. Subpixel positive masses are not</text><text x="25" y="949" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">enlarged or treated as zero. The record likelihood ratio Ln=2^n/3^K varies with</text><text x="25" y="973" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">K and can exceed one for some finite parameters; a whole event cannot be</text><text x="25" y="997" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">reweighted by one constant. For θ=log3 and D=qlog3−log2,</text><text x="25" y="1021" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">exp[−n(D+θδn)]Qn(An)≤Pn(An)≤exp[−n(D−θδn)]Qn(An). Only δn→0 and Qn(An)→1 give</text><text x="25" y="1045" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">limiting rate D at speed n. A single frequency cell does not have Q-probability</text><text x="25" y="1069" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">tending to one. This does not restrict the general Cramér theorem to tilt-</text><text x="25" y="1093" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">matched targets.</text></svg>