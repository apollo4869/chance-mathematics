<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1315" width="900" height="1315" role="img" aria-label="Center finite sums before taking a limit"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="1315" fill="white"/><text x="25" y="43" font-size="26" font-weight="bold" text-anchor="start" fill="#173f39">Center finite sums before taking a limit</text><text x="210" y="89" font-size="19" font-weight="bold" text-anchor="middle" fill="#173f39">Finite centering</text><svg x="25" y="105" width="370" height="455" viewBox="0 0 370 455"><text x="110" y="25" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Mean displacement</text><text x="282" y="25" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">Subtract finite mean</text><text x="7" y="72" font-size="15" font-weight="normal" text-anchor="start" fill="#65756e">k=1</text><rect x="52.0" y="54" width="60.0" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="112.0" y="54" width="60.0" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="112" y="99" font-size="15" font-weight="normal" text-anchor="middle" fill="#16776d">2¹ × 2⁻¹ = 1</text><text x="196" y="73" font-size="27" font-weight="normal" text-anchor="middle" fill="#a45b30">−</text><rect x="222" y="54" width="120" height="24" fill="#fbf0df" stroke="#a45b30" stroke-width="1.5"/><text x="282" y="73" font-size="20" font-weight="normal" text-anchor="middle" fill="#a45b30">1</text><text x="7" y="126" font-size="15" font-weight="normal" text-anchor="start" fill="#65756e">k=2</text><rect x="52.0" y="108" width="30.0" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="82.0" y="108" width="30.0" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="112.0" y="108" width="30.0" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="142.0" y="108" width="30.0" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="112" y="153" font-size="15" font-weight="normal" text-anchor="middle" fill="#16776d">2² × 2⁻² = 1</text><text x="196" y="127" font-size="27" font-weight="normal" text-anchor="middle" fill="#a45b30">−</text><rect x="222" y="108" width="120" height="24" fill="#fbf0df" stroke="#a45b30" stroke-width="1.5"/><text x="282" y="127" font-size="20" font-weight="normal" text-anchor="middle" fill="#a45b30">1</text><text x="7" y="180" font-size="15" font-weight="normal" text-anchor="start" fill="#65756e">k=3</text><rect x="52.0" y="162" width="15.0" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="67.0" y="162" width="15.0" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="82.0" y="162" width="15.0" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="97.0" y="162" width="15.0" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="112.0" y="162" width="15.0" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="127.0" y="162" width="15.0" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="142.0" y="162" width="15.0" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="157.0" y="162" width="15.0" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="112" y="207" font-size="15" font-weight="normal" text-anchor="middle" fill="#16776d">2³ × 2⁻³ = 1</text><text x="196" y="181" font-size="27" font-weight="normal" text-anchor="middle" fill="#a45b30">−</text><rect x="222" y="162" width="120" height="24" fill="#fbf0df" stroke="#a45b30" stroke-width="1.5"/><text x="282" y="181" font-size="20" font-weight="normal" text-anchor="middle" fill="#a45b30">1</text><text x="7" y="234" font-size="15" font-weight="normal" text-anchor="start" fill="#65756e">k=4</text><rect x="52.0" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="59.5" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="67.0" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="74.5" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="82.0" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="89.5" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="97.0" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="104.5" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="112.0" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="119.5" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="127.0" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="134.5" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="142.0" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="149.5" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="157.0" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="164.5" y="216" width="7.5" height="24" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="112" y="261" font-size="15" font-weight="normal" text-anchor="middle" fill="#16776d">2⁴ × 2⁻⁴ = 1</text><text x="196" y="235" font-size="27" font-weight="normal" text-anchor="middle" fill="#a45b30">−</text><rect x="222" y="216" width="120" height="24" fill="#fbf0df" stroke="#a45b30" stroke-width="1.5"/><text x="282" y="235" font-size="20" font-weight="normal" text-anchor="middle" fill="#a45b30">1</text><text x="185" y="299" font-size="25" font-weight="normal" text-anchor="middle" fill="#65756e">⋮</text><text x="185" y="425" font-size="21" font-weight="bold" text-anchor="middle" fill="#173f39">First form these 4 finite differences</text><text x="185" y="451" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">Center the mean; do not erase the jumps</text></svg><text x="660" y="89" font-size="19" font-weight="bold" text-anchor="middle" fill="#173f39">Square tail</text><svg x="475" y="105" width="370" height="455" viewBox="0 0 370 455"><text x="185" y="25" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">Centered variances can be added</text><rect x="42" y="66" width="126" height="126.0" fill="#16776d" stroke="white" stroke-width="1.5"/><text x="105.0" y="135.0" font-size="19" font-weight="normal" text-anchor="middle" fill="white">1/2</text><rect x="42" y="192.0" width="126" height="63.0" fill="#398b7c" stroke="white" stroke-width="1.5"/><text x="105.0" y="229.5" font-size="19" font-weight="normal" text-anchor="middle" fill="white">1/4</text><rect x="42" y="255.0" width="126" height="31.5" fill="#65a494" stroke="white" stroke-width="1.5"/><text x="105.0" y="276.75" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">1/8</text><rect x="42" y="286.5" width="126" height="15.75" fill="#88b8a7" stroke="white" stroke-width="1.5"/><rect x="42" y="302.25" width="126" height="15.75" fill="white" stroke="#a45b30" stroke-width="1.5"/><rect x="42" y="66" width="126" height="252" fill="none" stroke="#ccd9d1" stroke-width="1.5"/><text x="105" y="345" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">Whole rectangle: area 1</text><path d="M168 310.125L219 273" fill="none" stroke="#a45b30" stroke-width="1.5"/><text x="270" y="208" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">Unadded</text><text x="270" y="236" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">square tail</text><text x="270" y="279" font-size="33" font-weight="bold" text-anchor="middle" fill="#a45b30">1/16</text><text x="185" y="395" font-size="23" font-weight="normal" text-anchor="middle" fill="#16776d">Var(Mᴺ₁) = 1 − 1/16</text><text x="185" y="438" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">Zero mean does not mean zero fluctuation</text></svg><text x="450" y="630" font-size="20" font-weight="bold" text-anchor="middle" fill="#173f39">Endpoint and whole-window control</text><svg x="265" y="650" width="370" height="292" viewBox="0 0 370 292"><text x="185" y="25" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">First compare two finite cutoffs K&gt;N</text><text x="25" y="61" font-size="18" font-weight="normal" text-anchor="start" fill="#65756e">Endpoint t=1</text><path d="M45 81L325 81" fill="none" stroke="#ccd9d1" stroke-width="2"/><circle cx="325" cy="81" r="5" fill="#65756e" stroke="#65756e" stroke-width="2"/><text x="45" y="112" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">0</text><text x="325" y="112" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><text x="185" y="146" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">E|D(1)|² ≤ 0.0625</text><text x="25" y="183" font-size="18" font-weight="normal" text-anchor="start" fill="#16776d">Whole interval [0,1]</text><path d="M45 203L325 203" fill="none" stroke="#ccd9d1" stroke-width="2"/><rect x="45" y="195" width="280" height="16" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="45" y="234" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">0</text><text x="325" y="234" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><text x="185" y="268" font-size="20" font-weight="normal" text-anchor="middle" fill="#16776d">E sup |D(t)|² ≤ 0.25</text><text x="185" y="171" font-size="15" font-weight="normal" text-anchor="middle" fill="#a45b30">Martingale + Doob control the whole interval</text></svg><path d="M25 962L875 962" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="25" y="992" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">The dyadic clocks are those in the text: k≥1 and T=1. Each layer has mean 1 and</text><text x="25" y="1016" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">centered variance 2^(-k); subdivisions show means, not a simulation. M^N=Σk≤N</text><text x="25" y="1040" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Jk−N subtracts two finite quantities. Divergence of the raw positive-jump sum</text><text x="25" y="1064" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">uses the text’s Chebyshev/Borel–Cantelli argument, not infinite expectation</text><text x="25" y="1088" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">alone. The square tail is vN=Σk&gt;N2^(-k)=2^(-N). For finite K&gt;N, compare</text><text x="25" y="1112" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">D=M^K−M^N: its terminal second moment is exactly 2^(-N)−2^(-K)≤vN. E</text><text x="25" y="1136" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">sup0≤t≤1|D(t)|²≤4vN is a martingale maximal bound, not an equality or</text><text x="25" y="1160" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">deterministic path bound. Fatou transfers the estimate only after constructing</text><text x="25" y="1184" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">the limit. Markov yields ucp from this bound; the general locally uniform a.s.</text><text x="25" y="1208" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">construction also needs the text’s summable-probability/subsequence argument.</text><text x="25" y="1232" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Filled area is included variance; the unfilled tail retains its true area,</text><text x="25" y="1256" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">without enlargement.</text></svg>