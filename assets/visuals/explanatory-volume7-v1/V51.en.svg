<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1740" width="900" height="1740" role="img" aria-label="Disjoint windows can be hit by the same event"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><text x="450.0" y="38" font-size="20" font-weight="bold" text-anchor="middle" fill="#173f39">Disjoint windows can be hit by the same event</text><svg x="25.0" y="65" width="850" height="440" viewBox="0 0 850 440"><text x="425.0" y="28" font-size="20" font-weight="bold" text-anchor="middle" fill="#173f39">One horizontal line answers both hit questions</text><rect x="38" y="75" width="288" height="288" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><path d="M124.39999999999999 190.2L124.39999999999999 305.4" fill="none" stroke="#16776d" stroke-width="7"/><text x="124.39999999999999" y="388" font-size="19" font-weight="normal" text-anchor="middle" fill="#16776d">Kₐ</text><circle cx="124.39999999999999" cy="219.0" r="7" fill="white" stroke="#16776d" stroke-width="2"/><path d="M239.6 190.2L239.6 305.4" fill="none" stroke="#a45b30" stroke-width="7"/><text x="239.6" y="388" font-size="19" font-weight="normal" text-anchor="middle" fill="#a45b30">Kᵦ</text><circle cx="239.6" cy="219.0" r="7" fill="white" stroke="#a45b30" stroke-width="2"/><path d="M38 219.0L326 219.0" fill="none" stroke="#173f39" stroke-width="2"/><text x="326" y="63" font-size="17" font-weight="normal" text-anchor="end" fill="#65756e">U = 1/2</text><text x="525" y="75" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Events on the same U</text><rect x="470" y="100" width="28" height="240" fill="#f1f0e9" stroke="#ccd9d1" stroke-width="1.5"/><rect x="470" y="196.0" width="28" height="96.0" fill="#16776d"/><text x="484" y="365" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">A</text><rect x="540" y="100" width="28" height="240" fill="#f1f0e9" stroke="#ccd9d1" stroke-width="1.5"/><rect x="540" y="196.0" width="28" height="96.0" fill="#a45b30"/><text x="554" y="365" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">B</text><path d="M460 220.0L580 220.0" fill="none" stroke="#173f39" stroke-width="1.5"/><text x="615" y="220.0" font-size="24" font-weight="normal" text-anchor="middle" fill="#16776d">∩</text><text x="615" y="256.0" font-size="24" font-weight="bold" text-anchor="middle" fill="#16776d">2/5</text><text x="425.0" y="426" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">Same heights: P(both)=2/5</text></svg><svg x="25.0" y="530" width="850" height="440" viewBox="0 0 850 440"><text x="425.0" y="28" font-size="20" font-weight="bold" text-anchor="middle" fill="#173f39">One horizontal line answers both hit questions</text><rect x="38" y="75" width="288" height="288" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><path d="M124.39999999999999 262.20000000000005L124.39999999999999 334.2" fill="none" stroke="#16776d" stroke-width="7"/><text x="124.39999999999999" y="388" font-size="19" font-weight="normal" text-anchor="middle" fill="#16776d">Kₐ</text><path d="M239.6 103.8L239.6 175.8" fill="none" stroke="#a45b30" stroke-width="7"/><text x="239.6" y="388" font-size="19" font-weight="normal" text-anchor="middle" fill="#a45b30">Kᵦ</text><path d="M38 219.0L326 219.0" fill="none" stroke="#173f39" stroke-width="2"/><text x="326" y="63" font-size="17" font-weight="normal" text-anchor="end" fill="#65756e">U = 1/2</text><text x="525" y="75" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Events on the same U</text><rect x="470" y="100" width="28" height="240" fill="#f1f0e9" stroke="#ccd9d1" stroke-width="1.5"/><rect x="470" y="256.0" width="28" height="60.0" fill="#16776d"/><text x="484" y="365" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">A</text><rect x="540" y="100" width="28" height="240" fill="#f1f0e9" stroke="#ccd9d1" stroke-width="1.5"/><rect x="540" y="124.0" width="28" height="60.0" fill="#a45b30"/><text x="554" y="365" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">B</text><path d="M460 220.0L580 220.0" fill="none" stroke="#173f39" stroke-width="1.5"/><text x="615" y="220.0" font-size="24" font-weight="normal" text-anchor="middle" fill="#16776d">∩</text><text x="615" y="256.0" font-size="24" font-weight="bold" text-anchor="middle" fill="#16776d">0</text><text x="425.0" y="426" font-size="15" font-weight="normal" text-anchor="middle" fill="#a45b30">Separated heights: P(both)=0</text></svg><svg x="25.0" y="995" width="850" height="440" viewBox="0 0 850 440"><text x="425.0" y="28" font-size="20" font-weight="bold" text-anchor="middle" fill="#173f39">One horizontal line answers both hit questions</text><rect x="38" y="75" width="288" height="288" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><path d="M124.39999999999999 175.8L124.39999999999999 319.79999999999995" fill="none" stroke="#16776d" stroke-width="7"/><text x="124.39999999999999" y="388" font-size="19" font-weight="normal" text-anchor="middle" fill="#16776d">Kₐ</text><circle cx="124.39999999999999" cy="219.0" r="7" fill="white" stroke="#16776d" stroke-width="2"/><path d="M239.6 118.2L239.6 247.79999999999998" fill="none" stroke="#a45b30" stroke-width="7"/><text x="239.6" y="388" font-size="19" font-weight="normal" text-anchor="middle" fill="#a45b30">Kᵦ</text><circle cx="239.6" cy="219.0" r="7" fill="white" stroke="#a45b30" stroke-width="2"/><path d="M38 219.0L326 219.0" fill="none" stroke="#173f39" stroke-width="2"/><text x="326" y="63" font-size="17" font-weight="normal" text-anchor="end" fill="#65756e">U = 1/2</text><text x="525" y="75" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Events on the same U</text><rect x="470" y="100" width="28" height="240" fill="#f1f0e9" stroke="#ccd9d1" stroke-width="1.5"/><rect x="470" y="184.0" width="28" height="120.0" fill="#16776d"/><text x="484" y="365" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">A</text><rect x="540" y="100" width="28" height="240" fill="#f1f0e9" stroke="#ccd9d1" stroke-width="1.5"/><rect x="540" y="136.0" width="28" height="108.0" fill="#a45b30"/><text x="554" y="365" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">B</text><path d="M460 220.0L580 220.0" fill="none" stroke="#173f39" stroke-width="1.5"/><text x="615" y="220.0" font-size="24" font-weight="normal" text-anchor="middle" fill="#16776d">∩</text><text x="615" y="256.0" font-size="24" font-weight="bold" text-anchor="middle" fill="#16776d">1/4</text><text x="425.0" y="426" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">Overlapping heights: P(both)=1/4</text></svg><path d="M30 1460L870 1460" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="1488" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">U is continuously uniform on [0,1], and F_U=[0,1] x {U}. The two compact</text><text x="30" y="1513" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">vertical segments have different horizontal coordinates, so they are disjoint in</text><text x="30" y="1538" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">space. Each is hit exactly when U is in its closed height interval. T(K) is the</text><text x="30" y="1563" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">length of the height projection; the probability of hitting both is</text><text x="30" y="1588" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">T(K_a)+T(K_b)-T(K_a union K_b). Readings use continuous Lebesgue probability,</text><text x="30" y="1613" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">not a discrete uniform law on slider positions. Endpoints are included but have</text><text x="30" y="1638" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">probability zero individually. This shows nonadditivity and recovery of joint</text><text x="30" y="1663" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">readings from unions; the general LCSC Choquet theorem and complete alternation</text><text x="30" y="1688" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">remain the responsibility of the text.</text></svg>