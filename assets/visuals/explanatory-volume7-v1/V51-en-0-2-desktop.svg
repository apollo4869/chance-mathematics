<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="850" height="440" role="img" aria-label="Disjoint windows can be hit by the same event"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><text x="425.0" y="28" font-size="20" font-weight="bold" text-anchor="middle" fill="#173f39">One horizontal line answers both hit questions</text><rect x="38" y="75" width="288" height="288" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><path d="M124.39999999999999 190.2L124.39999999999999 305.4" fill="none" stroke="#16776d" stroke-width="7"/><text x="124.39999999999999" y="388" font-size="19" font-weight="normal" text-anchor="middle" fill="#16776d">Kₐ</text><path d="M239.6 190.2L239.6 305.4" fill="none" stroke="#a45b30" stroke-width="7"/><text x="239.6" y="388" font-size="19" font-weight="normal" text-anchor="middle" fill="#a45b30">Kᵦ</text><path d="M38 334.2L326 334.2" fill="none" stroke="#173f39" stroke-width="2"/><text x="326" y="63" font-size="17" font-weight="normal" text-anchor="end" fill="#65756e">U = 1/10</text><text x="525" y="75" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Events on the same U</text><rect x="470" y="100" width="28" height="240" fill="#f1f0e9" stroke="#ccd9d1" stroke-width="1.5"/><rect x="470" y="196.0" width="28" height="96.0" fill="#16776d"/><text x="484" y="365" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">A</text><rect x="540" y="100" width="28" height="240" fill="#f1f0e9" stroke="#ccd9d1" stroke-width="1.5"/><rect x="540" y="196.0" width="28" height="96.0" fill="#a45b30"/><text x="554" y="365" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">B</text><path d="M460 316.0L580 316.0" fill="none" stroke="#173f39" stroke-width="1.5"/><text x="615" y="220.0" font-size="24" font-weight="normal" text-anchor="middle" fill="#16776d">∩</text><text x="615" y="256.0" font-size="24" font-weight="bold" text-anchor="middle" fill="#16776d">2/5</text><text x="425.0" y="426" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">Same heights: P(both)=2/5</text></svg>