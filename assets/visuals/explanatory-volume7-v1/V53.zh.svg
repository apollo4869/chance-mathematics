.0" y="100" width="59.0" height="34" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><text x="690.5" y="123" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">b</text><rect x="722.0" y="100" width="59.0" height="34" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><text x="753.5" y="123" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">c</text><path d="M470 215L785 215" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M470 259L785 259" fill="none" stroke="#a45b30" stroke-width="1" stroke-dasharray="4 4"/><text x="461" y="220" font-size="13" font-weight="normal" text-anchor="end" fill="#65756e">0</text><text x="461" y="264" font-size="13" font-weight="normal" text-anchor="end" fill="#a45b30">−1</text><path d="M470.0 215L533.0 171" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M533.0 171L596.0 215" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M596.0 215L659.0 259" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M659.0 259L722.0 215" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M722.0 215L785.0 259" fill="none" stroke="#a45b30" stroke-width="2"/><circle cx="470.0" cy="215" r="4" fill="white" stroke="#16776d" stroke-width="2"/><text x="470.0" y="325" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">0</text><circle cx="533.0" cy="171" r="4" fill="white" stroke="#16776d" stroke-width="2"/><text x="533.0" y="325" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><circle cx="596.0" cy="215" r="4" fill="white" stroke="#16776d" stroke-width="2"/><text x="596.0" y="325" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">2</text><circle cx="659.0" cy="259" r="4" fill="white" stroke="#a45b30" stroke-width="2"/><text x="659.0" y="325" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">3</text><circle cx="722.0" cy="215" r="4" fill="white" stroke="#16776d" stroke-width="2"/><text x="722.0" y="325" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">4</text><circle cx="785.0" cy="259" r="4" fill="white" stroke="#a45b30" stroke-width="2"/><text x="785.0" y="325" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">5</text><circle cx="659.0" cy="259" r="9" fill="white" stroke="#a45b30" stroke-width="2"/><text x="425.0" y="425" font-size="19" font-weight="bold" text-anchor="middle" fill="#a45b30">第3步已到−1：提前结束</text></svg><svg x="275.0" y="995" width="350" height="290" viewBox="0 0 350 290"><text x="175.0" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#173f39">再加2层单孩子祖先</text><circle cx="175" cy="60" r="4" fill="white" stroke="#a45b30" stroke-width="2"/><path d="M175 66L175 79" fill="none" stroke="#a45b30" stroke-width="2"/><circle cx="175" cy="82" r="4" fill="white" stroke="#a45b30" stroke-width="2"/><path d="M175 86L175 119" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M175 120l-42 55h84z" fill="#eaf2ee" stroke="#16776d"/><text x="175" y="163" font-size="23" font-weight="normal" text-anchor="middle" fill="#16776d">T</text><text x="175" y="260" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">任务前缀全0；旧节点深度 +2</text></svg><path d="M30 1310L870 1310" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="1338" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">有限增量串(-1,+1,-1,+1,-1)，总和−1，各增量≥−1。在0≤j&lt;5上最小值−1第一次出现在r=1，最后一次</text><text x="30" y="1363" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">在r=3；前者旋转后只在末步到−1，后者在第3步已到−1而失败。每个有编号切口均实际计算，不将重复最</text><text x="30" y="1388" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">低点忽略。它是离散桥到合法树词的有限操作，不是标准Brownian游程本身。连续Vervaat极限还需要条件桥</text><text x="30" y="1413" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">收敛、唯一最低点的切口稳定与游程律识别。附加单孩子链产生零增量前缀，却使所有旧节点深度增加链长；</text><text x="30" y="1438" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">一般取ℓₘ=⌊m³⁄⁴⌋时ℓₘ/m→0而ℓₘ/√m→∞。这是确定性高度失稳机制，不宣称加链后仍服从固定</text><text x="30" y="1463" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">条件GW律，也不宣称已得到CRT或GHP收敛。</text></svg>