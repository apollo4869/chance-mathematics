<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1190" width="900" height="1190" role="img" aria-label="Poisson in each window is not yet independence"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><text x="450.0" y="38" font-size="20" font-weight="bold" text-anchor="middle" fill="#173f39">Poisson in each window is not yet independence</text><svg x="35.0" y="65" width="830" height="410" viewBox="0 0 830 410"><text x="415.0" y="28" font-size="20" font-weight="bold" text-anchor="middle" fill="#173f39">Two independent inputs</text><circle cx="115" cy="75" r="22" fill="white" stroke="#16776d" stroke-width="2"/><text x="115" y="82" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">U</text><path d="M115 100L115 140" fill="none" stroke="#16776d" stroke-width="2"/><path d="M111.52027572711016 132.7964231811786L115 140" fill="none" stroke="#16776d" stroke-width="2"/><path d="M118.47972427288984 132.7964231811786L115 140" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="315" cy="75" r="22" fill="white" stroke="#16776d" stroke-width="2"/><text x="315" y="82" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">V</text><path d="M315 100L315 140" fill="none" stroke="#16776d" stroke-width="2"/><path d="M311.5202757271102 132.7964231811786L315 140" fill="none" stroke="#16776d" stroke-width="2"/><path d="M318.4797242728898 132.7964231811786L315 140" fill="none" stroke="#16776d" stroke-width="2"/><rect x="51" y="148" width="128" height="94" fill="white" stroke="#16776d" stroke-width="1.5"/><text x="115" y="170" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">a</text><text x="115" y="230" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">N = 0</text><rect x="251" y="148" width="128" height="94" fill="white" stroke="#16776d" stroke-width="1.5"/><text x="315" y="170" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">b</text><circle cx="300" cy="197" r="8" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="330" cy="197" r="8" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="315" y="230" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">N = 2</text><text x="215.0" y="280" font-size="17" font-weight="normal" text-anchor="middle" fill="#65756e">U=0.12, V=0.80</text><rect x="540" y="72" width="216" height="216" fill="#f0f1eb" stroke="#ccd9d1" stroke-width="1.5"/><rect x="540" y="208.53804070696845" width="79.46195929303154" height="79.46195929303154" fill="#b9d9ca" stroke="#16776d" stroke-width="1.5"/><path d="M619.4619592930316 72L619.4619592930316 288" fill="none" stroke="#16776d" stroke-width="1" stroke-dasharray="4 4"/><circle cx="565.92" cy="115.19999999999999" r="5" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><path d="M540 208.53804070696845L756 208.53804070696845" fill="none" stroke="#16776d" stroke-width="1" stroke-dasharray="4 4"/><text x="648.0" y="57" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">Input region: both windows empty</text><text x="764" y="292" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">U</text><text x="522" y="77" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">V</text><text x="648.0" y="324" font-size="25" font-weight="bold" text-anchor="middle" fill="#16776d">e⁻² = 0.1353</text><text x="415.0" y="398" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">Same Poisson marginals; different joint law</text></svg><svg x="35.0" y="500" width="830" height="410" viewBox="0 0 830 410"><text x="415.0" y="28" font-size="20" font-weight="bold" text-anchor="middle" fill="#173f39">Copy one input</text><circle cx="215.0" cy="75" r="22" fill="white" stroke="#16776d" stroke-width="2"/><text x="215.0" y="82" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">U</text><path d="M215.0 97L215.0 115" fill="none" stroke="#16776d" stroke-width="2"/><path d="M115 115L315 115" fill="none" stroke="#16776d" stroke-width="2"/><path d="M115 115L115 140" fill="none" stroke="#16776d" stroke-width="2"/><path d="M111.52027572711016 132.7964231811786L115 140" fill="none" stroke="#16776d" stroke-width="2"/><path d="M118.47972427288984 132.7964231811786L115 140" fill="none" stroke="#16776d" stroke-width="2"/><path d="M315 115L315 140" fill="none" stroke="#16776d" stroke-width="2"/><path d="M311.5202757271102 132.7964231811786L315 140" fill="none" stroke="#16776d" stroke-width="2"/><path d="M318.4797242728898 132.7964231811786L315 140" fill="none" stroke="#16776d" stroke-width="2"/><rect x="51" y="148" width="128" height="94" fill="white" stroke="#16776d" stroke-width="1.5"/><text x="115" y="170" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">a</text><text x="115" y="230" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">N = 0</text><rect x="251" y="148" width="128" height="94" fill="white" stroke="#16776d" stroke-width="1.5"/><text x="315" y="170" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">b</text><text x="315" y="230" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">N = 0</text><text x="215.0" y="280" font-size="17" font-weight="normal" text-anchor="middle" fill="#65756e">U=0.12, V=0.80</text><text x="215.0" y="306" font-size="15" font-weight="normal" text-anchor="middle" fill="#a45b30">V unused; both counts use U</text><rect x="540" y="72" width="216" height="216" fill="#f0f1eb" stroke="#ccd9d1" stroke-width="1.5"/><rect x="540" y="72" width="79.46195929303154" height="216" fill="#b9d9ca" stroke="#16776d" stroke-width="1.5"/><path d="M619.4619592930316 72L619.4619592930316 288" fill="none" stroke="#16776d" stroke-width="1" stroke-dasharray="4 4"/><circle cx="565.92" cy="115.19999999999999" r="5" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><text x="648.0" y="57" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">Input region: both windows empty</text><text x="764" y="292" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">U</text><text x="522" y="77" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">V</text><text x="648.0" y="324" font-size="25" font-weight="bold" text-anchor="middle" fill="#16776d">e⁻¹ = 0.3679</text><text x="415.0" y="398" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">Same Poisson marginals; different joint law</text></svg><path d="M30 935L870 935" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="963" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">The space has two locations a,b and permits multiplicities. Independent counts</text><text x="30" y="988" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">K_a,K_b are Poisson(1); the copied model sets both counts equal to one</text><text x="30" y="1013" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">Poisson(1) variable K. Marginals and mean measures agree, but the probability of</text><text x="30" y="1038" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">two empty windows is exp(-2) versus exp(-1). Independent uniforms U,V in [0,1)</text><text x="30" y="1063" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">form a common input: two inverse CDFs in the first model, U alone in the second.</text><text x="30" y="1088" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">Shaded probabilities are exact continuous-input areas. Buttons specify</text><text x="30" y="1113" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">illustrative inputs, not simulations. This two-location example does not replace</text><text x="30" y="1138" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">the general PRM construction or scattering proof.</text></svg>