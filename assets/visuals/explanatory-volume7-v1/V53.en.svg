ll="#65756e">b</text><rect x="191.496108669643" y="145.8672575837461" width="54" height="38" fill="white" stroke="#65756e" stroke-width="1.5"/><text x="218.496108669643" y="171.8672575837461" font-size="21" font-weight="normal" text-anchor="middle" fill="#65756e">−1</text><text x="218.496108669643" y="137.8672575837461" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">c</text><rect x="104.50389133035699" y="145.8672575837461" width="54" height="38" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="131.503891330357" y="171.8672575837461" font-size="21" font-weight="normal" text-anchor="middle" fill="#16776d">+1</text><text x="131.503891330357" y="137.8672575837461" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">d</text><rect x="77.62181779415863" y="63.132742416253905" width="54" height="38" fill="white" stroke="#65756e" stroke-width="1.5"/><text x="104.62181779415863" y="89.1327424162539" font-size="21" font-weight="normal" text-anchor="middle" fill="#65756e">−1</text><text x="104.62181779415863" y="55.132742416253905" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">e</text><text x="175" y="110" font-size="24" font-weight="normal" text-anchor="middle" fill="#16776d">r = 3</text><text x="175" y="225" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">Letters retain the identity of each increment</text></svg><text x="627.5" y="75" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Rotated order</text><rect x="470.0" y="100" width="59.0" height="34" fill="#eaf2ee" stroke="#ccd9d1" stroke-width="1.5"/><text x="501.5" y="123" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">d</text><rect x="533.0" y="100" width="59.0" height="34" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><text x="564.5" y="123" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">e</text><rect x="596.0" y="100" width="59.0" height="34" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><text x="627.5" y="123" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">a</text><rect x="659.0" y="100" width="59.0" height="34" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><text x="690.5" y="123" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">b</text><rect x="722.0" y="100" width="59.0" height="34" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><text x="753.5" y="123" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">c</text><path d="M470 215L785 215" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M470 259L785 259" fill="none" stroke="#a45b30" stroke-width="1" stroke-dasharray="4 4"/><text x="461" y="220" font-size="13" font-weight="normal" text-anchor="end" fill="#65756e">0</text><text x="461" y="264" font-size="13" font-weight="normal" text-anchor="end" fill="#a45b30">−1</text><path d="M470.0 215L533.0 171" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M533.0 171L596.0 215" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M596.0 215L659.0 259" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M659.0 259L722.0 215" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M722.0 215L785.0 259" fill="none" stroke="#a45b30" stroke-width="2"/><circle cx="470.0" cy="215" r="4" fill="white" stroke="#16776d" stroke-width="2"/><text x="470.0" y="325" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">0</text><circle cx="533.0" cy="171" r="4" fill="white" stroke="#16776d" stroke-width="2"/><text x="533.0" y="325" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><circle cx="596.0" cy="215" r="4" fill="white" stroke="#16776d" stroke-width="2"/><text x="596.0" y="325" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">2</text><circle cx="659.0" cy="259" r="4" fill="white" stroke="#a45b30" stroke-width="2"/><text x="659.0" y="325" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">3</text><circle cx="722.0" cy="215" r="4" fill="white" stroke="#16776d" stroke-width="2"/><text x="722.0" y="325" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">4</text><circle cx="785.0" cy="259" r="4" fill="white" stroke="#a45b30" stroke-width="2"/><text x="785.0" y="325" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">5</text><circle cx="659.0" cy="259" r="9" fill="white" stroke="#a45b30" stroke-width="2"/><text x="425.0" y="425" font-size="19" font-weight="bold" text-anchor="middle" fill="#a45b30">Already at -1 at step 3: too early</text></svg><svg x="275.0" y="995" width="350" height="290" viewBox="0 0 350 290"><text x="175.0" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#173f39">Add 2 unary ancestors</text><circle cx="175" cy="60" r="4" fill="white" stroke="#a45b30" stroke-width="2"/><path d="M175 66L175 79" fill="none" stroke="#a45b30" stroke-width="2"/><circle cx="175" cy="82" r="4" fill="white" stroke="#a45b30" stroke-width="2"/><path d="M175 86L175 119" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M175 120l-42 55h84z" fill="#eaf2ee" stroke="#16776d"/><text x="175" y="163" font-size="23" font-weight="normal" text-anchor="middle" fill="#16776d">T</text><text x="175" y="260" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">Zero task prefix; old depths +2</text></svg><path d="M30 1310L870 1310" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="1338" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">The finite increments are (-1,+1,-1,+1,-1), each at least -1 and summing to -1.</text><text x="30" y="1363" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">On 0&lt;=j&lt;5, the minimum -1 is first reached at r=1 and last at r=3. The first cut</text><text x="30" y="1388" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">reaches -1 only at the end; the last cut reaches it at step 3 and fails. Every</text><text x="30" y="1413" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">indexed cut is computed. This is a finite bridge-to-tree-word operation, not</text><text x="30" y="1438" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">itself a standard Brownian excursion. The continuous Vervaat limit also needs a</text><text x="30" y="1463" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">conditioned bridge theorem, cut stability at a unique minimum, and</text><text x="30" y="1488" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">identification of the excursion law. A unary ancestral chain adds a zero-</text><text x="30" y="1513" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">increment prefix but increases all old depths by its length. For</text><text x="30" y="1538" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">l_m=floor(m^(3/4)), l_m/m tends to 0 while l_m/sqrt(m) diverges. This is a</text><text x="30" y="1563" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">deterministic instability example, not a claim that modified trees retain the</text><text x="30" y="1588" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">fixed conditioned GW law or that CRT/GHP convergence is proved.</text></svg>