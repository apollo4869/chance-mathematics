ormal" text-anchor="middle" fill="#16776d">d</text><rect x="659.0" y="100" width="59.0" height="34" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><text x="690.5" y="123" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">e</text><rect x="722.0" y="100" width="59.0" height="34" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><text x="753.5" y="123" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">a</text><path d="M470 215L785 215" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M470 259L785 259" fill="none" stroke="#a45b30" stroke-width="1" stroke-dasharray="4 4"/><text x="461" y="220" font-size="13" font-weight="normal" text-anchor="end" fill="#65756e">0</text><text x="461" y="264" font-size="13" font-weight="normal" text-anchor="end" fill="#a45b30">−1</text><path d="M470.0 215L533.0 171" fill="none" stroke="#16776d" stroke-width="2"/><path d="M533.0 171L596.0 215" fill="none" stroke="#16776d" stroke-width="2"/><path d="M596.0 215L659.0 171" fill="none" stroke="#16776d" stroke-width="2"/><path d="M659.0 171L722.0 215" fill="none" stroke="#16776d" stroke-width="2"/><path d="M722.0 215L785.0 259" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="470.0" cy="215" r="4" fill="white" stroke="#16776d" stroke-width="2"/><text x="470.0" y="325" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">0</text><circle cx="533.0" cy="171" r="4" fill="white" stroke="#16776d" stroke-width="2"/><text x="533.0" y="325" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><circle cx="596.0" cy="215" r="4" fill="white" stroke="#16776d" stroke-width="2"/><text x="596.0" y="325" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">2</text><circle cx="659.0" cy="171" r="4" fill="white" stroke="#16776d" stroke-width="2"/><text x="659.0" y="325" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">3</text><circle cx="722.0" cy="215" r="4" fill="white" stroke="#16776d" stroke-width="2"/><text x="722.0" y="325" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">4</text><circle cx="785.0" cy="259" r="4" fill="white" stroke="#a45b30" stroke-width="2"/><text x="785.0" y="325" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">5</text><text x="425.0" y="425" font-size="19" font-weight="bold" text-anchor="middle" fill="#16776d">First reaches -1 at the end: legal</text></svg><svg x="25.0" y="530" width="850" height="440" viewBox="0 0 850 440"><text x="425.0" y="28" font-size="20" font-weight="bold" text-anchor="middle" fill="#173f39">Cut before endpoint 3</text><svg x="15" y="42" width="350" height="235" viewBox="0 0 350 235"><path d="M175.0 31.0L245.37818220584137 82.13274241625389" fill="none" stroke="#ccd9d1" stroke-width="1.5"/><path d="M205.26261834851178 52.98707923898917L220.04203661173847 63.72495514640249" fill="none" stroke="#65756e" stroke-width="2"/><path d="M212.16888993537773 62.30595500105022L220.04203661173847 63.72495514640249" fill="none" stroke="#65756e" stroke-width="2"/><path d="M216.2595511546753 56.67564285603645L220.04203661173847 63.72495514640249" fill="none" stroke="#65756e" stroke-width="2"/><path d="M245.37818220584137 82.13274241625389L218.496108669643 164.8672575837461" fill="none" stroke="#ccd9d1" stroke-width="1.5"/><path d="M233.81889058527608 117.70858393827554L228.17365514267442 135.0828321234489" fill="none" stroke="#65756e" stroke-width="2"/><path d="M227.09026835533336 127.15652951321411L228.17365514267442 135.0828321234489" fill="none" stroke="#65756e" stroke-width="2"/><path d="M233.70909724461796 129.30711738533805L228.17365514267442 135.0828321234489" fill="none" stroke="#65756e" stroke-width="2"/><path d="M218.496108669643 164.8672575837461L131.503891330357 164.8672575837461" fill="none" stroke="#ccd9d1" stroke-width="1.5"/><path d="M181.08945521375003 164.8672575837461L162.82108957249994 164.8672575837461" fill="none" stroke="#