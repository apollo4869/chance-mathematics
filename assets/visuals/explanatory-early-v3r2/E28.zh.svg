<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 786" width="940" height="786" role="img" aria-label="同一个核，两个方向的平均"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="940" height="786" fill="white"/><text x="26" y="42" font-size="27" font-weight="bold" text-anchor="start" fill="#173f39">同一个核，两个方向的平均</text><svg x="0" y="75" width="940" height="540" viewBox="0 0 940 540"><text x="160" y="31" font-size="26" font-weight="bold" text-anchor="middle" fill="#16776d">分布前推</text><text x="780" y="31" font-size="26" font-weight="bold" text-anchor="middle" fill="#a45b30">收益回拉</text><text x="160" y="82" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">出发分布 μ</text><text x="780" y="82" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">未来收益 f</text><circle cx="108" cy="147" r="27" fill="white" stroke="#ccd9d1" stroke-width="2"/><circle cx="108" cy="147" r="27.0" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="108" y="110" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">A</text><text x="108" y="195" font-size="21" font-weight="normal" text-anchor="middle" fill="#16776d">1</text><circle cx="212" cy="147" r="27" fill="white" stroke="#ccd9d1" stroke-width="2"/><text x="212" y="110" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">B</text><text x="212" y="195" font-size="21" font-weight="normal" text-anchor="middle" fill="#16776d">0</text><rect x="701" y="120" width="54" height="54" fill="#fbf3e9" stroke="#a45b30" stroke-width="1.5"/><text x="728" y="154" font-size="27" font-weight="normal" text-anchor="middle" fill="#a45b30">0</text><text x="728" y="110" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">A</text><rect x="805" y="120" width="54" height="54" fill="#fbf3e9" stroke="#a45b30" stroke-width="1.5"/><text x="832" y="154" font-size="27" font-weight="normal" text-anchor="middle" fill="#a45b30">4</text><text x="832" y="110" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">B</text><path d="M160 214L160 282" fill="none" stroke="#16776d" stroke-width="2"/><path d="M156.52027572711015 274.79642318117857L160 282" fill="none" stroke="#16776d" stroke-width="2"/><path d="M163.47972427288985 274.79642318117857L160 282" fill="none" stroke="#16776d" stroke-width="2"/><text x="160" y="315" font-size="19" font-weight="normal" text-anchor="middle" fill="#16776d">出发 → 未来</text><path d="M780 214L780 282" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M776.5202757271102 274.79642318117857L780 282" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M783.4797242728898 274.79642318117857L780 282" fill="none" stroke="#a45b30" stroke-width="2"/><text x="780" y="315" font-size="19" font-weight="normal" text-anchor="middle" fill="#a45b30">未来 → 出发</text><svg x="350" y="102" width="240" height="235" viewBox="0 0 240 235"><text x="120" y="22" font-size="20" font-weight="bold" text-anchor="middle" fill="#173f39">同一转移核 P</text><text x="86" y="61" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">A</text><text x="154" y="61" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">B</text><text x="24" y="105" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">A</text><text x="24" y="150" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">B</text><text x="86" y="105" font-size="25" font-weight="normal" text-anchor="middle" fill="#173f39">3/4</text><text x="154" y="105" font-size="25" font-weight="normal" text-anchor="middle" fill="#173f39">1/4</text><text x="86" y="150" font-size="25" font-weight="normal" text-anchor="middle" fill="#173f39">1/4</text><text x="154" y="150" font-size="25" font-weight="normal" text-anchor="middle" fill="#173f39">3/4</text><path d="M48 77L48 164" fill="none" stroke="#173f39" stroke-width="2"/><path d="M48 77L60 77" fill="none" stroke="#173f39" stroke-width="2"/><path d="M48 164L60 164" fill="none" stroke="#173f39" stroke-width="2"/><path d="M192 77L192 164" fill="none" stroke="#173f39" stroke-width="2"/><path d="M192 77L180 77" fill="none" stroke="#173f39" stroke-width="2"/><path d="M192 164L180 164" fill="none" stroke="#173f39" stroke-width="2"/><text x="120" y="199" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">行 = 出发状态</text><text x="120" y="223" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">列 = 到达状态</text></svg><path d="M350 248L221 248" fill="none" stroke="#16776d" stroke-width="2"/><path d="M228.2035768188214 244.52027572711015L221 248" fill="none" stroke="#16776d" stroke-width="2"/><path d="M228.2035768188214 251.47972427288985L221 248" fill="none" stroke="#16776d" stroke-width="2"/><path d="M590 248L719 248" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M711.7964231811786 251.47972427288985L719 248" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M711.7964231811786 244.52027572711015L719 248" fill="none" stroke="#a45b30" stroke-width="2"/><text x="160" y="351" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">到达分布 μP</text><text x="780" y="351" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">出发点平均 Tf</text><circle cx="108" cy="411" r="27" fill="white" stroke="#ccd9d1" stroke-width="2"/><circle cx="108" cy="411" r="23.38268590217984" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="108" y="374" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">A</text><text x="108" y="459" font-size="21" font-weight="normal" text-anchor="middle" fill="#16776d">0.75</text><circle cx="212" cy="411" r="27" fill="white" stroke="#ccd9d1" stroke-width="2"/><circle cx="212" cy="411" r="13.5" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="212" y="374" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">B</text><text x="212" y="459" font-size="21" font-weight="normal" text-anchor="middle" fill="#16776d">0.25</text><rect x="701" y="384" width="54" height="54" fill="#fbf3e9" stroke="#a45b30" stroke-width="1.5"/><text x="728" y="418" font-size="27" font-weight="normal" text-anchor="middle" fill="#a45b30">1</text><text x="728" y="374" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">A</text><rect x="805" y="384" width="54" height="54" fill="#fbf3e9" stroke="#a45b30" stroke-width="1.5"/><text x="832" y="418" font-size="27" font-weight="normal" text-anchor="middle" fill="#a45b30">3</text><text x="832" y="374" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">B</text><text x="470" y="500" font-size="29" font-weight="bold" text-anchor="middle" fill="#16776d">(μP)f = μ(Tf) = 1</text><text x="470" y="534" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">圆面积表示概率；方框中的数是收益。P的每个条目按出发行、到达列精确标记。</text></svg><path d="M26 630L914 630" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="26" y="660" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">准确模型保持：P各行和为1，对角3/4、非对角1/4，μ=(p,1−p)，p∈{0,1/2,1}，f=(0,4)或(4,0)。</text><text x="26" y="684" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">μP=(1/4+p/2,3/4−p/2)。前者Tf=(1,3)、共同平均3−2p；后者Tf=(3,1)、共同平均1+2p。实色圆面积为</text><text x="26" y="708" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">概率，浅轮廓是单位参照；方框数为收益。P的四个条目通过出发行与到达列逐一标明，无重复交叉转移箭头</text><text x="26" y="732" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">。图只解释固定时刻的核与对偶平均，不以它代替半群、生成元定义域或Feller条件的证明。</text></svg>