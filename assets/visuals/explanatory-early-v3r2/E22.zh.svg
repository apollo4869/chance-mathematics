<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" role="img" aria-label="跳链相同，寿命仍可不同"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="770" fill="white"/><text x="25" y="42" font-size="27" font-weight="bold" text-anchor="start" fill="#173f39">跳链相同，寿命仍可不同</text><text x="450" y="87" font-size="20" font-weight="bold" text-anchor="middle" fill="#a45b30">长度 = 平均等待；左右不共用时间刻度。</text><text x="210" y="133" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">λⱼ = 1</text><svg x="25" y="153" width="370" height="400" viewBox="0 0 370 400"><text x="185" y="31" font-size="28" font-weight="bold" text-anchor="middle" fill="#16776d">ζ = ∞  a.s.</text><svg x="0" y="50" width="370" height="350" viewBox="0 0 370 350"><text x="185" y="25" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">每个箭头都只走向下一个状态</text><circle cx="25.0" cy="64" r="11" fill="white" stroke="#16776d" stroke-width="2"/><text x="25.0" y="69" font-size="13" font-weight="normal" text-anchor="middle" fill="#173f39">1</text><path d="M38.0 64L112.0 64" fill="none" stroke="#16776d" stroke-width="2"/><path d="M104.79642318117858 67.47972427288984L112.0 64" fill="none" stroke="#16776d" stroke-width="2"/><path d="M104.79642318117858 60.52027572711016L112.0 64" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="125.0" cy="64" r="11" fill="white" stroke="#16776d" stroke-width="2"/><text x="125.0" y="69" font-size="13" font-weight="normal" text-anchor="middle" fill="#173f39">2</text><path d="M138.0 64L212.0 64" fill="none" stroke="#16776d" stroke-width="2"/><path d="M204.7964231811786 67.47972427288984L212.0 64" fill="none" stroke="#16776d" stroke-width="2"/><path d="M204.7964231811786 60.52027572711016L212.0 64" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="225.0" cy="64" r="11" fill="white" stroke="#16776d" stroke-width="2"/><text x="225.0" y="69" font-size="13" font-weight="normal" text-anchor="middle" fill="#173f39">3</text><path d="M238.0 64L312.0 64" fill="none" stroke="#16776d" stroke-width="2"/><path d="M304.79642318117857 67.47972427288984L312.0 64" fill="none" stroke="#16776d" stroke-width="2"/><path d="M304.79642318117857 60.52027572711016L312.0 64" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="325.0" cy="64" r="11" fill="white" stroke="#16776d" stroke-width="2"/><text x="325.0" y="69" font-size="13" font-weight="normal" text-anchor="middle" fill="#173f39">4</text><text x="351" y="69" font-size="20" font-weight="normal" text-anchor="start" fill="#16776d">…</text><text x="185" y="111" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">下面的长度 = 平均等待</text><rect x="23" y="143" width="40" height="47" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="63" y="143" width="40" height="47" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="103" y="143" width="40" height="47" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="143" y="143" width="40" height="47" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><path d="M183 166L350 166" fill="none" stroke="#16776d" stroke-width="2"/><path d="M342.79642318117857 169.47972427288985L350 166" fill="none" stroke="#16776d" stroke-width="2"/><path d="M342.79642318117857 162.52027572711015L350 166" fill="none" stroke="#16776d" stroke-width="2"/><text x="185" y="221" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">每段均值都是1</text><text x="185" y="248" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">箭头表示仍有后续，不是有限终点</text><text x="185" y="309" font-size="29" font-weight="normal" text-anchor="middle" fill="#16776d">ζ = ∞  a.s.</text><text x="185" y="339" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">λⱼ = 1     Eτⱼ = 1</text></svg></svg><text x="660" y="133" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">λⱼ = 2ʲ</text><svg x="475" y="153" width="370" height="400" viewBox="0 0 370 400"><text x="185" y="31" font-size="28" font-weight="bold" text-anchor="middle" fill="#a45b30">ζ &lt; ∞  a.s.</text><svg x="0" y="50" width="370" height="350" viewBox="0 0 370 350"><text x="185" y="25" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">每个箭头都只走向下一个状态</text><circle cx="25.0" cy="64" r="11" fill="white" stroke="#a45b30" stroke-width="2"/><text x="25.0" y="69" font-size="13" font-weight="normal" text-anchor="middle" fill="#173f39">1</text><path d="M38.0 64L112.0 64" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M104.79642318117858 67.47972427288984L112.0 64" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M104.79642318117858 60.52027572711016L112.0 64" fill="none" stroke="#a45b30" stroke-width="2"/><circle cx="125.0" cy="64" r="11" fill="white" stroke="#a45b30" stroke-width="2"/><text x="125.0" y="69" font-size="13" font-weight="normal" text-anchor="middle" fill="#173f39">2</text><path d="M138.0 64L212.0 64" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M204.7964231811786 67.47972427288984L212.0 64" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M204.7964231811786 60.52027572711016L212.0 64" fill="none" stroke="#a45b30" stroke-width="2"/><circle cx="225.0" cy="64" r="11" fill="white" stroke="#a45b30" stroke-width="2"/><text x="225.0" y="69" font-size="13" font-weight="normal" text-anchor="middle" fill="#173f39">3</text><path d="M238.0 64L312.0 64" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M304.79642318117857 67.47972427288984L312.0 64" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M304.79642318117857 60.52027572711016L312.0 64" fill="none" stroke="#a45b30" stroke-width="2"/><circle cx="325.0" cy="64" r="11" fill="white" stroke="#a45b30" stroke-width="2"/><text x="325.0" y="69" font-size="13" font-weight="normal" text-anchor="middle" fill="#173f39">4</text><text x="351" y="69" font-size="20" font-weight="normal" text-anchor="start" fill="#a45b30">…</text><text x="185" y="111" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">下面的长度 = 平均等待</text><rect x="35" y="143" width="140.0" height="47" fill="#eaf2ee" stroke="#a45b30" stroke-width="1.5"/><text x="105.0" y="173" font-size="15" font-weight="normal" text-anchor="middle" fill="#a45b30">1/2</text><rect x="175.0" y="143" width="70.0" height="47" fill="#eaf2ee" stroke="#a45b30" stroke-width="1.5"/><text x="210.0" y="173" font-size="15" font-weight="normal" text-anchor="middle" fill="#a45b30">1/4</text><rect x="245.0" y="143" width="35.0" height="47" fill="#eaf2ee" stroke="#a45b30" stroke-width="1.5"/><text x="262.5" y="173" font-size="15" font-weight="normal" text-anchor="middle" fill="#a45b30">1/8</text><rect x="280.0" y="143" width="17.5" height="47" fill="#eaf2ee" stroke="#a45b30" stroke-width="1.5"/><rect x="297.5" y="143" width="17.5" height="47" fill="white" stroke="#65756e" stroke-width="1.5"/><text x="185" y="221" font-size="16" font-weight="normal" text-anchor="middle" fill="#a45b30">实色：前n段均值</text><text x="185" y="248" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">留白：所有后段均值的和</text><path d="M35 277L315 277" fill="none" stroke="#65756e" stroke-width="1"/><path d="M35 270L35 284" fill="none" stroke="#65756e" stroke-width="2"/><path d="M315 270L315 284" fill="none" stroke="#65756e" stroke-width="2"/><text x="185" y="309" font-size="29" font-weight="normal" text-anchor="middle" fill="#a45b30">Eζ = 1</text><text x="185" y="339" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">λⱼ = 2ʲ     Eτⱼ = 2⁻ʲ</text></svg></svg><path d="M25 582L875 582" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="25" y="614" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">精确模型：从状态1出发的纯生链j→j+1。令Eⱼ独立且为Exp(1)，等待τⱼ=Eⱼ/λⱼ，寿命ζ=Στⱼ。左</text><text x="25" y="638" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">λⱼ=1，由独立同分布强大数律ζ=∞几乎必然；不是仅凭Eζ=∞推断。右λⱼ=2ʲ，由Tonelli得</text><text x="25" y="662" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Eζ=Σ2⁻ʲ=1，非负性遂给ζ&lt;∞几乎必然。所有单段等待都严格正且速率有限。右图白色尾段均值恰为</text><text x="25" y="686" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">2⁻ⁿ；不声称ζ≤1，也不声称图中均值长度是实际等待。左右平均时钟示意不是共同数轴，不能比较其像</text><text x="25" y="710" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">素单位。爆炸后规则仍须另定，图不构造重启。</text></svg>