<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 882" width="940" height="882" role="img" aria-label="One kernel, two directions of averaging"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="940" height="882" fill="white"/><text x="26" y="42" font-size="27" font-weight="bold" text-anchor="start" fill="#173f39">One kernel, two directions of averaging</text><svg x="0" y="75" width="940" height="540" viewBox="0 0 940 540"><text x="160" y="31" font-size="26" font-weight="bold" text-anchor="middle" fill="#16776d">Push the distribution</text><text x="780" y="31" font-size="26" font-weight="bold" text-anchor="middle" fill="#a45b30">Pull back the payoff</text><text x="160" y="82" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">Starting law μ</text><text x="780" y="82" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">Future payoff f</text><circle cx="108" cy="147" r="27" fill="white" stroke="#ccd9d1" stroke-width="2"/><circle cx="108" cy="147" r="27.0" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="108" y="110" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">A</text><text x="108" y="195" font-size="21" font-weight="normal" text-anchor="middle" fill="#16776d">1</text><circle cx="212" cy="147" r="27" fill="white" stroke="#ccd9d1" stroke-width="2"/><text x="212" y="110" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">B</text><text x="212" y="195" font-size="21" font-weight="normal" text-anchor="middle" fill="#16776d">0</text><rect x="701" y="120" width="54" height="54" fill="#fbf3e9" stroke="#a45b30" stroke-width="1.5"/><text x="728" y="154" font-size="27" font-weight="normal" text-anchor="middle" fill="#a45b30">0</text><text x="728" y="110" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">A</text><rect x="805" y="120" width="54" height="54" fill="#fbf3e9" stroke="#a45b30" stroke-width="1.5"/><text x="832" y="154" font-size="27" font-weight="normal" text-anchor="middle" fill="#a45b30">4</text><text x="832" y="110" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">B</text><path d="M160 214L160 282" fill="none" stroke="#16776d" stroke-width="2"/><path d="M156.52027572711015 274.79642318117857L160 282" fill="none" stroke="#16776d" stroke-width="2"/><path d="M163.47972427288985 274.79642318117857L160 282" fill="none" stroke="#16776d" stroke-width="2"/><text x="160" y="315" font-size="19" font-weight="normal" text-anchor="middle" fill="#16776d">Start → future</text><path d="M780 214L780 282" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M776.5202757271102 274.79642318117857L780 282" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M783.4797242728898 274.79642318117857L780 282" fill="none" stroke="#a45b30" stroke-width="2"/><text x="780" y="315" font-size="19" font-weight="normal" text-anchor="middle" fill="#a45b30">Future → start</text><svg x="350" y="102" width="240" height="235" viewBox="0 0 240 235"><text x="120" y="22" font-size="20" font-weight="bold" text-anchor="middle" fill="#173f39">The same kernel P</text><text x="86" y="61" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">A</text><text x="154" y="61" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">B</text><text x="24" y="105" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">A</text><text x="24" y="150" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">B</text><text x="86" y="105" font-size="25" font-weight="normal" text-anchor="middle" fill="#173f39">3/4</text><text x="154" y="105" font-size="25" font-weight="normal" text-anchor="middle" fill="#173f39">1/4</text><text x="86" y="150" font-size="25" font-weight="normal" text-anchor="middle" fill="#173f39">1/4</text><text x="154" y="150" font-size="25" font-weight="normal" text-anchor="middle" fill="#173f39">3/4</text><path d="M48 77L48 164" fill="none" stroke="#173f39" stroke-width="2"/><path d="M48 77L60 77" fill="none" stroke="#173f39" stroke-width="2"/><path d="M48 164L60 164" fill="none" stroke="#173f39" stroke-width="2"/><path d="M192 77L192 164" fill="none" stroke="#173f39" stroke-width="2"/><path d="M192 77L180 77" fill="none" stroke="#173f39" stroke-width="2"/><path d="M192 164L180 164" fill="none" stroke="#173f39" stroke-width="2"/><text x="120" y="199" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">Rows = departure states</text><text x="120" y="223" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">Columns = arrival states</text></svg><path d="M350 248L221 248" fill="none" stroke="#16776d" stroke-width="2"/><path d="M228.2035768188214 244.52027572711015L221 248" fill="none" stroke="#16776d" stroke-width="2"/><path d="M228.2035768188214 251.47972427288985L221 248" fill="none" stroke="#16776d" stroke-width="2"/><path d="M590 248L719 248" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M711.7964231811786 251.47972427288985L719 248" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M711.7964231811786 244.52027572711015L719 248" fill="none" stroke="#a45b30" stroke-width="2"/><text x="160" y="351" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">Arrival law μP</text><text x="780" y="351" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">Mean at each start Tf</text><circle cx="108" cy="411" r="27" fill="white" stroke="#ccd9d1" stroke-width="2"/><circle cx="108" cy="411" r="23.38268590217984" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="108" y="374" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">A</text><text x="108" y="459" font-size="21" font-weight="normal" text-anchor="middle" fill="#16776d">0.75</text><circle cx="212" cy="411" r="27" fill="white" stroke="#ccd9d1" stroke-width="2"/><circle cx="212" cy="411" r="13.5" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="212" y="374" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">B</text><text x="212" y="459" font-size="21" font-weight="normal" text-anchor="middle" fill="#16776d">0.25</text><rect x="701" y="384" width="54" height="54" fill="#fbf3e9" stroke="#a45b30" stroke-width="1.5"/><text x="728" y="418" font-size="27" font-weight="normal" text-anchor="middle" fill="#a45b30">1</text><text x="728" y="374" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">A</text><rect x="805" y="384" width="54" height="54" fill="#fbf3e9" stroke="#a45b30" stroke-width="1.5"/><text x="832" y="418" font-size="27" font-weight="normal" text-anchor="middle" fill="#a45b30">3</text><text x="832" y="374" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">B</text><text x="470" y="500" font-size="29" font-weight="bold" text-anchor="middle" fill="#16776d">(μP)f = μ(Tf) = 1</text><text x="470" y="534" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">Disk areas encode probabilities; boxed numbers are payoffs. Each P entry has a departure row and arrival column.</text></svg><path d="M26 630L914 630" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="26" y="660" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Unchanged exact model: P is row-stochastic, with diagonal 3/4 and off-diagonal</text><text x="26" y="684" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">1/4; μ=(p,1−p), p∈{0,1/2,1}, and f=(0,4) or (4,0). Then μP=(1/4+p/2,3/4−p/2).</text><text x="26" y="708" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">For the first payoff Tf=(1,3), with common mean 3−2p; for the second Tf=(3,1),</text><text x="26" y="732" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">with mean 1+2p. Filled disk areas are probabilities, pale outlines unit</text><text x="26" y="756" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">references, and boxed numbers payoffs. Each of the four P entries has its</text><text x="26" y="780" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">departure row and arrival column, without duplicated crossing transition arrows.</text><text x="26" y="804" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">This illustrates a fixed-time kernel and dual averaging, not a proof of</text><text x="26" y="828" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">semigroup generation, generator domains or Feller conditions.</text></svg>