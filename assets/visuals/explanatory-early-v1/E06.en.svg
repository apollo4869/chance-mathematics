<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 747" width="900" height="747" role="img" aria-label="Equal values can be measured together"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="747" fill="white"/><text x="30" y="45" font-size="27" font-weight="bold" text-anchor="start" fill="#173f39">Equal values can be measured together</text><path d="M30 65L870 65" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="227.5" y="101" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">Spatial order</text><svg x="30" y="125" width="395" height="320" viewBox="0 0 340 245" preserveAspectRatio="xMidYMid meet"><rect x="57" y="165" width="26" height="27" fill="#16776d" stroke="white" stroke-width="1.5"/><text x="70.0" y="155" font-size="19" font-weight="normal" text-anchor="middle" fill="#16776d">1</text><rect x="83" y="57" width="26" height="135" fill="#7257a4" stroke="white" stroke-width="1.5"/><text x="96.0" y="47" font-size="19" font-weight="normal" text-anchor="middle" fill="#7257a4">5</text><rect x="109" y="165" width="26" height="27" fill="#16776d" stroke="white" stroke-width="1.5"/><text x="122.0" y="155" font-size="19" font-weight="normal" text-anchor="middle" fill="#16776d">1</text><rect x="135" y="111" width="26" height="81" fill="#96753b" stroke="white" stroke-width="1.5"/><text x="148.0" y="101" font-size="19" font-weight="normal" text-anchor="middle" fill="#96753b">3</text><rect x="161" y="57" width="26" height="135" fill="#7257a4" stroke="white" stroke-width="1.5"/><text x="174.0" y="47" font-size="19" font-weight="normal" text-anchor="middle" fill="#7257a4">5</text><rect x="187" y="165" width="26" height="27" fill="#16776d" stroke="white" stroke-width="1.5"/><text x="200.0" y="155" font-size="19" font-weight="normal" text-anchor="middle" fill="#16776d">1</text><rect x="213" y="111" width="26" height="81" fill="#96753b" stroke="white" stroke-width="1.5"/><text x="226.0" y="101" font-size="19" font-weight="normal" text-anchor="middle" fill="#96753b">3</text><rect x="239" y="57" width="26" height="135" fill="#7257a4" stroke="white" stroke-width="1.5"/><text x="252.0" y="47" font-size="19" font-weight="normal" text-anchor="middle" fill="#7257a4">5</text><path d="M57 193L265 193" fill="none" stroke="#65756e" stroke-width="1"/><text x="161" y="229" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">Same [0,1], each cell width 1/8</text></svg><text x="672.5" y="101" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">Group by value</text><svg x="475" y="125" width="395" height="320" viewBox="0 0 340 245" preserveAspectRatio="xMidYMid meet"><rect x="57" y="165" width="78" height="27" fill="#16776d" stroke="white" stroke-width="1.5"/><text x="96.0" y="155" font-size="20" font-weight="normal" text-anchor="middle" fill="#16776d">1</text><text x="96.0" y="224" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">3/8</text><rect x="135" y="111" width="52" height="81" fill="#96753b" stroke="white" stroke-width="1.5"/><text x="161.0" y="101" font-size="20" font-weight="normal" text-anchor="middle" fill="#96753b">3</text><text x="161.0" y="224" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">2/8</text><rect x="187" y="57" width="78" height="135" fill="#7257a4" stroke="white" stroke-width="1.5"/><text x="226.0" y="47" font-size="20" font-weight="normal" text-anchor="middle" fill="#7257a4">5</text><text x="226.0" y="224" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">3/8</text></svg><text x="450" y="470" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">1×3/8 + 3×2/8 + 5×3/8 = 3</text><path d="M30 490L870 490" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="521" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Model: eight equal half-open cells in [0,1], with 1 included in the last cell,</text><text x="30" y="545" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">have values 1,5,1,3,5,1,3,5. The right panel rearranges the measures of equal-</text><text x="30" y="569" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">value sets into contiguous bands; it does not assert that the original sets are</text><text x="30" y="593" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">contiguous. Their measurable preimages have measures 3/8,2/8,3/8; the integral</text><text x="30" y="617" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">is 3. Clicking highlights a group without changing the function or measure. This</text><text x="30" y="641" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">explains a simple-function sum, not the full construction of Lebesgue</text><text x="30" y="665" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">integration. This finite step function is also Riemann integrable; the failure</text><text x="30" y="689" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">example is the text’s Dirichlet function.</text></svg>