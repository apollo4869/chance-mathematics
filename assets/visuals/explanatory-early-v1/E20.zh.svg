0 73L224 189" fill="none" stroke="#16776d" stroke-width="3"/><circle cx="224" cy="189" r="26.16295090390226" fill="#eaf2ee" stroke="#16776d" stroke-width="2"/><text x="224" y="196" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">1/4</text><text x="224" y="244" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">B₁</text><path d="M280 73L280 189" fill="none" stroke="#aab6ae" stroke-width="1.5"/><circle cx="280" cy="189" r="26.16295090390226" fill="#f4f5f0" stroke="#82968a" stroke-width="2"/><text x="280" y="196" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">1/4</text><text x="280" y="244" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">B₂</text><path d="M280 73L336 189" fill="none" stroke="#aab6ae" stroke-width="1.5"/><circle cx="336" cy="189" r="26.16295090390226" fill="#f4f5f0" stroke="#82968a" stroke-width="2"/><text x="336" y="196" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">1/4</text><text x="336" y="244" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">B₃</text><text x="195" y="277" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">圆面积 ∝ 该“树＋标记个体”的联合概率</text></svg><path d="M30 490L870 490" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="521" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">第一代精确例：P(L=1)=P(L=3)=1/2，m=2。P模式先按原律选树，再条件于该树均匀选孩子；Q模式先用</text><text x="30" y="545" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Q₁(t)=Z₁(t)P₁(t)/2选树，所以家族权重为1/4、3/4，Q₁*(t,v)=P₁(t)/2=1/4。两模式给定树后都均</text><text x="30" y="569" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">匀选孩子；只有选树权重不同。圆面积编码联合概率，树的边长和位置不变；孩子按钮只移动标记。此例P下</text><text x="30" y="593" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">本已必然生存，Q仍改变生育律，所以大小偏置不是条件生存。图只核对第一代，不未经证明写无限层dQ=W </text><text x="30" y="617" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">dP。</text></svg>