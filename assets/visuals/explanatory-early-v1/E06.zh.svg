<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 651" width="900" height="651" role="img" aria-label="数值相同的位置，可以一起计量"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="651" fill="white"/><text x="30" y="45" font-size="27" font-weight="bold" text-anchor="start" fill="#173f39">数值相同的位置，可以一起计量</text><path d="M30 65L870 65" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="227.5" y="101" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">位置顺序</text><svg x="30" y="125" width="395" height="320" viewBox="0 0 340 245" preserveAspectRatio="xMidYMid meet"><rect x="57" y="165" width="26" height="27" fill="#16776d" stroke="white" stroke-width="1.5"/><text x="70.0" y="155" font-size="19" font-weight="normal" text-anchor="middle" fill="#16776d">1</text><rect x="83" y="57" width="26" height="135" fill="#7257a4" stroke="white" stroke-width="1.5"/><text x="96.0" y="47" font-size="19" font-weight="normal" text-anchor="middle" fill="#7257a4">5</text><rect x="109" y="165" width="26" height="27" fill="#16776d" stroke="white" stroke-width="1.5"/><text x="122.0" y="155" font-size="19" font-weight="normal" text-anchor="middle" fill="#16776d">1</text><rect x="135" y="111" width="26" height="81" fill="#96753b" stroke="white" stroke-width="1.5"/><text x="148.0" y="101" font-size="19" font-weight="normal" text-anchor="middle" fill="#96753b">3</text><rect x="161" y="57" width="26" height="135" fill="#7257a4" stroke="white" stroke-width="1.5"/><text x="174.0" y="47" font-size="19" font-weight="normal" text-anchor="middle" fill="#7257a4">5</text><rect x="187" y="165" width="26" height="27" fill="#16776d" stroke="white" stroke-width="1.5"/><text x="200.0" y="155" font-size="19" font-weight="normal" text-anchor="middle" fill="#16776d">1</text><rect x="213" y="111" width="26" height="81" fill="#96753b" stroke="white" stroke-width="1.5"/><text x="226.0" y="101" font-size="19" font-weight="normal" text-anchor="middle" fill="#96753b">3</text><rect x="239" y="57" width="26" height="135" fill="#7257a4" stroke="white" stroke-width="1.5"/><text x="252.0" y="47" font-size="19" font-weight="normal" text-anchor="middle" fill="#7257a4">5</text><path d="M57 193L265 193" fill="none" stroke="#65756e" stroke-width="1"/><text x="161" y="229" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">同一条[0,1]，每格宽1/8</text></svg><text x="672.5" y="101" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">按取值归组</text><svg x="475" y="125" width="395" height="320" viewBox="0 0 340 245" preserveAspectRatio="xMidYMid meet"><rect x="57" y="165" width="78" height="27" fill="#16776d" stroke="white" stroke-width="1.5"/><text x="96.0" y="155" font-size="20" font-weight="normal" text-anchor="middle" fill="#16776d">1</text><text x="96.0" y="224" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">3/8</text><rect x="135" y="111" width="52" height="81" fill="#96753b" stroke="white" stroke-width="1.5"/><text x="161.0" y="101" font-size="20" font-weight="normal" text-anchor="middle" fill="#96753b">3</text><text x="161.0" y="224" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">2/8</text><rect x="187" y="57" width="78" height="135" fill="#7257a4" stroke="white" stroke-width="1.5"/><text x="226.0" y="47" font-size="20" font-weight="normal" text-anchor="middle" fill="#7257a4">5</text><text x="226.0" y="224" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">3/8</text></svg><text x="450" y="470" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">1×3/8 + 3×2/8 + 5×3/8 = 3</text><path d="M30 490L870 490" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="521" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">具体模型：Lebesgue空间[0,1]分为8个等宽半开小格，最后一格包含1，取值依次1,5,1,3,5,1,3,5。右图是</text><text x="30" y="545" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">把等值集合的测度重新排成连续宽带的示意，不是声称原集合连续。三个原像可测，测度为3/8、2/8、3/8，</text><text x="30" y="569" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">积分为3。点击只突出同一组，不改变函数或测度。它解释简单函数的加权和，不以这幅有限图代替一般</text><text x="30" y="593" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Lebesgue积分构造。 此有限阶梯也Riemann可积；失败反例是正文的Dirichlet函数。</text></svg>