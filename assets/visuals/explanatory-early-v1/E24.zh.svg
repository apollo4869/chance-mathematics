96" fill="none" stroke="#16776d" stroke-width="2"/><path d="M239.5155926007092 88.57751305322412L242.5 96" fill="none" stroke="#16776d" stroke-width="2"/><path d="M315 30L315 96" fill="none" stroke="#16776d" stroke-width="2"/><path d="M311.5202757271102 88.79642318117858L315 96" fill="none" stroke="#16776d" stroke-width="2"/><path d="M318.4797242728898 88.79642318117858L315 96" fill="none" stroke="#16776d" stroke-width="2"/><text x="170.0" y="18" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">a</text><text x="242.5" y="130" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">a+δ</text><text x="40" y="72" font-size="25" font-weight="normal" text-anchor="start" fill="#16776d">λ</text></svg><text x="667.5" y="366" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">对齐往返：高度仍为1</text><svg x="470" y="390" width="395" height="228" viewBox="0 0 340 196" preserveAspectRatio="xMidYMid meet"><path d="M25 151L315 151" fill="none" stroke="#b6c3bb" stroke-width="1" stroke-dasharray="4 4"/><path d="M25 151L170.0 151" fill="none" stroke="#a45b30" stroke-width="2"/><circle cx="170.0" cy="151" r="4" fill="white" stroke="#a45b30" stroke-width="2"/><circle cx="170.0" cy="52" r="4" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><path d="M170.0 52L206.25 52" fill="none" stroke="#a45b30" stroke-width="2"/><circle cx="206.25" cy="52" r="4" fill="white" stroke="#a45b30" stroke-width="2"/><circle cx="206.25" cy="151" r="4" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><path d="M206.25 151L315 151" fill="none" stroke="#a45b30" stroke-width="2"/><text x="13" y="58" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">1</text><text x="13" y="157" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">0</text><text x="170" y="187" font-size="15" font-weight="normal" text-anchor="middle" fill="#173f39">灰虚线：参考；实线：当前记录</text></svg><path d="M30 660L870 660" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="691" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">a=1/2，0&lt;δ≤1/4。x=1_[a,1]，xδ=1_[a+δ,1]。λ在0,a,1间分段线性，送到0,a+δ,1，是递增连续同胚</text><text x="30" y="715" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">；‖λ−id‖∞=δ，xδ∘λ=x，而‖xδ−x‖∞=1。往返zδ=1_[a+δ,a+δ+δ²)在任意时间同胚后仍上确</text><text x="30" y="739" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">界1，因此不能在J₁中趋零。图用同一λ显示窄带仍存在，并由满射性给出所有λ的结论，不由单个画面推</text><text x="30" y="763" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">断。点的实空表示右连续取值；不以竖直连接线当跳跃之间的路径。让δ趋0才是收敛陈述。</text></svg>