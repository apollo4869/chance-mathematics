<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 651" width="900" height="651" role="img" aria-label="三份合法的两人关系，未必有共同世界"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="651" fill="white"/><text x="30" y="45" font-size="27" font-weight="bold" text-anchor="start" fill="#173f39">三份合法的两人关系，未必有共同世界</text><path d="M30 65L870 65" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="227.5" y="101" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">三对相反：矛盾</text><svg x="30" y="125" width="395" height="320" viewBox="0 0 360 285" preserveAspectRatio="xMidYMid meet"><path d="M180 53L53 211" fill="none" stroke="#16776d" stroke-width="2"/><text x="80" y="124" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">相反</text><path d="M53 211L307 211" fill="none" stroke="#16776d" stroke-width="2"/><text x="180" y="245" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">相反</text><path d="M180 53L307 211" fill="none" stroke="#a45b30" stroke-width="2" stroke-dasharray="5 4"/><text x="280" y="124" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">相反</text><text x="263" y="158" font-size="29" font-weight="normal" text-anchor="middle" fill="#a45b30">×</text><circle cx="180" cy="53" r="25" fill="#fffefa" stroke="#16776d" stroke-width="2"/><text x="180" y="61" font-size="26" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><text x="180" y="18" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">X₁</text><circle cx="53" cy="211" r="25" fill="#fffefa" stroke="#16776d" stroke-width="2"/><text x="53" y="219" font-size="26" font-weight="normal" text-anchor="middle" fill="#173f39">1</text><text x="53" y="176" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">X₂</text><circle cx="307" cy="211" r="25" fill="#fffefa" stroke="#16776d" stroke-width="2"/><text x="307" y="219" font-size="26" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><text x="307" y="176" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">X₃</text></svg><text x="672.5" y="101" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">第三对相同：可实现</text><svg x="475" y="125" width="395" height="320" viewBox="0 0 360 285" preserveAspectRatio="xMidYMid meet"><path d="M180 53L53 211" fill="none" stroke="#16776d" stroke-width="2"/><text x="80" y="124" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">相反</text><path d="M53 211L307 211" fill="none" stroke="#16776d" stroke-width="2"/><text x="180" y="245" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">相反</text><path d="M180 53L307 211" fill="none" stroke="#16776d" stroke-width="2"/><text x="280" y="124" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">相同</text><circle cx="180" cy="53" r="25" fill="#fffefa" stroke="#16776d" stroke-width="2"/><text x="180" y="61" font-size="26" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><text x="180" y="18" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">X₁</text><circle cx="53" cy="211" r="25" fill="#fffefa" stroke="#16776d" stroke-width="2"/><text x="53" y="219" font-size="26" font-weight="normal" text-anchor="middle" fill="#173f39">1</text><text x="53" y="176" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">X₂</text><circle cx="307" cy="211" r="25" fill="#fffefa" stroke="#16776d" stroke-width="2"/><text x="307" y="219" font-size="26" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><text x="307" y="176" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">X₃</text></svg><path d="M30 490L870 490" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="521" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">X₁,X₂,X₃取0或1，每个单独分布均公平。“相反”的两维律为01、10各1/2，“相同”为00、11各1/2。若</text><text x="30" y="545" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">三对几乎必然相反，X₁≠X₂且X₂≠X₃就迫使X₁=X₃，矛盾；不是仅凭画出的某一条记录下结论。将第三</text><text x="30" y="569" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">对改为相同后，联合律P(010)=P(101)=1/2真实实现全部三对。两个记录按钮互换全局0/1，三份一维边际始</text><text x="30" y="593" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">终相同。图揭示一致性必要性，不取代扩张定理。</text></svg>