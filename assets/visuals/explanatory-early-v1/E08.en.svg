<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 723" width="900" height="723" role="img" aria-label="Three valid pairs need not share one world"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="723" fill="white"/><text x="30" y="45" font-size="27" font-weight="bold" text-anchor="start" fill="#173f39">Three valid pairs need not share one world</text><path d="M30 65L870 65" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="227.5" y="101" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">All opposite: impossible</text><svg x="30" y="125" width="395" height="320" viewBox="0 0 360 285" preserveAspectRatio="xMidYMid meet"><path d="M180 53L53 211" fill="none" stroke="#16776d" stroke-width="2"/><text x="80" y="124" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">opposite</text><path d="M53 211L307 211" fill="none" stroke="#16776d" stroke-width="2"/><text x="180" y="245" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">opposite</text><path d="M180 53L307 211" fill="none" stroke="#a45b30" stroke-width="2" stroke-dasharray="5 4"/><text x="280" y="124" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">opposite</text><text x="263" y="158" font-size="29" font-weight="normal" text-anchor="middle" fill="#a45b30">×</text><circle cx="180" cy="53" r="25" fill="#fffefa" stroke="#16776d" stroke-width="2"/><text x="180" y="61" font-size="26" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><text x="180" y="18" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">X₁</text><circle cx="53" cy="211" r="25" fill="#fffefa" stroke="#16776d" stroke-width="2"/><text x="53" y="219" font-size="26" font-weight="normal" text-anchor="middle" fill="#173f39">1</text><text x="53" y="176" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">X₂</text><circle cx="307" cy="211" r="25" fill="#fffefa" stroke="#16776d" stroke-width="2"/><text x="307" y="219" font-size="26" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><text x="307" y="176" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">X₃</text></svg><text x="672.5" y="101" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">Third equal: consistent</text><svg x="475" y="125" width="395" height="320" viewBox="0 0 360 285" preserveAspectRatio="xMidYMid meet"><path d="M180 53L53 211" fill="none" stroke="#16776d" stroke-width="2"/><text x="80" y="124" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">opposite</text><path d="M53 211L307 211" fill="none" stroke="#16776d" stroke-width="2"/><text x="180" y="245" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">opposite</text><path d="M180 53L307 211" fill="none" stroke="#16776d" stroke-width="2"/><text x="280" y="124" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">equal</text><circle cx="180" cy="53" r="25" fill="#fffefa" stroke="#16776d" stroke-width="2"/><text x="180" y="61" font-size="26" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><text x="180" y="18" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">X₁</text><circle cx="53" cy="211" r="25" fill="#fffefa" stroke="#16776d" stroke-width="2"/><text x="53" y="219" font-size="26" font-weight="normal" text-anchor="middle" fill="#173f39">1</text><text x="53" y="176" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">X₂</text><circle cx="307" cy="211" r="25" fill="#fffefa" stroke="#16776d" stroke-width="2"/><text x="307" y="219" font-size="26" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><text x="307" y="176" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">X₃</text></svg><path d="M30 490L870 490" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="521" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Each Xi is a fair bit. An opposite pair has law 01,10 with probability 1/2 each;</text><text x="30" y="545" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">an equal pair has law 00,11 with probability 1/2 each. If all three pairs were</text><text x="30" y="569" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">opposite almost surely, X1≠X2 and X2≠X3 would force X1=X3, a contradiction. This</text><text x="30" y="593" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">is not inferred merely from one displayed assignment. With the third pair equal,</text><text x="30" y="617" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">the joint law P(010)=P(101)=1/2 realizes all three pair laws. Buttons flip all</text><text x="30" y="641" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">bits, retaining the same fair one-dimensional marginals. The picture shows a</text><text x="30" y="665" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">necessary consistency condition, not the extension theorem.</text></svg>