<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 902" width="900" height="902" role="img" aria-label="Can the same present justify the decision?"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="902" fill="white"/><text x="30" y="45" font-size="27" font-weight="bold" text-anchor="start" fill="#173f39">Can the same present justify the decision?</text><path d="M30 65L870 65" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="450.0" y="91" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">One prefix, two valid completions</text><svg x="170" y="115" width="560" height="482" viewBox="0 0 360 310" preserveAspectRatio="xMidYMid meet"><path d="M30 146L92 88" fill="none" stroke="#16776d" stroke-width="2.5"/><path d="M92 88L154 146" fill="none" stroke="#16776d" stroke-width="2.5"/><circle cx="30" cy="146" r="5" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="30" y="171" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">n=0</text><text x="30" y="134" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">0</text><circle cx="92" cy="88" r="5" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="92" y="113" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">n=1</text><text x="92" y="76" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">1</text><circle cx="154" cy="146" r="5" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="154" y="171" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">n=2</text><text x="154" y="134" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">0</text><text x="89" y="40" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">One observed prefix</text><text x="154" y="191" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">Now n=2</text><path d="M174 54L174 270" fill="none" stroke="#ccd9d1" stroke-width="1" stroke-dasharray="4 4"/><path d="M154 146L235 88" fill="none" stroke="#16776d" stroke-width="2"/><path d="M235 88L324 30" fill="none" stroke="#16776d" stroke-width="2"/><path d="M235 88L324 146" fill="none" stroke="#a45b30" stroke-width="2"/><circle cx="324" cy="30" r="6" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="324" cy="146" r="6" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><text x="307" y="66" font-size="19" font-weight="normal" text-anchor="middle" fill="#16776d">L=2</text><text x="307" y="182" font-size="19" font-weight="normal" text-anchor="middle" fill="#a45b30">L=4</text><text x="235" y="111" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">n=3</text><text x="324" y="222" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">n=4</text><text x="180" y="292" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">First positive return T=2: already known</text></svg><path d="M30 645L870 645" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="676" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Simple symmetric walk starts at 0 with its natural filtration. T=inf{n≥1:Sn=0};</text><text x="30" y="700" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">L=max{0≤n≤4:Sn=0}. The shared prefix (0,1,0) is one F2 atom. The positive-</text><text x="30" y="724" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">probability continuations (1,2) and (1,0) give L=2 and L=4 respectively, while</text><text x="30" y="748" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">both give T=2. Hence {L≤2} is not constant on that atom and is not an F2 event.</text><text x="30" y="772" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Two completions suffice to disprove decidability; they do not enumerate all</text><text x="30" y="796" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">futures or receive an arbitrary total probability. A legitimate stopping rule</text><text x="30" y="820" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">alone does not justify unbounded optional sampling; its UI conditions remain in</text><text x="30" y="844" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">the text.</text></svg>