<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 771" width="900" height="771" role="img" aria-label="Choose a family, or choose an individual?"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="771" fill="white"/><text x="30" y="45" font-size="27" font-weight="bold" text-anchor="start" fill="#173f39">Choose a family, or choose an individual?</text><path d="M30 65L870 65" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="227.5" y="101" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">Choose family under P</text><svg x="30" y="125" width="395" height="320" viewBox="0 0 390 280" preserveAspectRatio="xMidYMid meet"><circle cx="62" cy="73" r="7" fill="#173f39" stroke="#173f39" stroke-width="2"/><text x="62" y="29" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">A</text><text x="62" y="55" font-size="19" font-weight="normal" text-anchor="middle" fill="#a45b30">1/2</text><path d="M62 73L62 189" fill="none" stroke="#aab6ae" stroke-width="1.5"/><circle cx="62" cy="189" r="37.0" fill="#f4f5f0" stroke="#82968a" stroke-width="2"/><text x="62" y="196" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">1/2</text><text x="62" y="244" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">A₁</text><circle cx="280" cy="73" r="7" fill="#173f39" stroke="#173f39" stroke-width="2"/><text x="280" y="29" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">B</text><text x="280" y="55" font-size="19" font-weight="normal" text-anchor="middle" fill="#a45b30">1/2</text><path d="M280 73L224 189" fill="none" stroke="#16776d" stroke-width="3"/><circle cx="224" cy="189" r="21.36195996001615" fill="#eaf2ee" stroke="#16776d" stroke-width="2"/><text x="224" y="196" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">1/6</text><text x="224" y="244" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">B₁</text><path d="M280 73L280 189" fill="none" stroke="#aab6ae" stroke-width="1.5"/><circle cx="280" cy="189" r="21.36195996001615" fill="#f4f5f0" stroke="#82968a" stroke-width="2"/><text x="280" y="196" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">1/6</text><text x="280" y="244" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">B₂</text><path d="M280 73L336 189" fill="none" stroke="#aab6ae" stroke-width="1.5"/><circle cx="336" cy="189" r="21.36195996001615" fill="#f4f5f0" stroke="#82968a" stroke-width="2"/><text x="336" y="196" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">1/6</text><text x="336" y="244" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">B₃</text><text x="195" y="277" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">Disk area ∝ joint chance of tree + marked child</text></svg><text x="672.5" y="101" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">Population-weighted Q</text><svg x="475" y="125" width="395" height="320" viewBox="0 0 390 280" preserveAspectRatio="xMidYMid meet"><circle cx="62" cy="73" r="7" fill="#173f39" stroke="#173f39" stroke-width="2"/><text x="62" y="29" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">A</text><text x="62" y="55" font-size="19" font-weight="normal" text-anchor="middle" fill="#a45b30">1/4</text><path d="M62 73L62 189" fill="none" stroke="#aab6ae" stroke-width="1.5"/><circle cx="62" cy="189" r="26.16295090390226" fill="#f4f5f0" stroke="#82968a" stroke-width="2"/><text x="62" y="196" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">1/4</text><text x="62" y="244" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">A₁</text><circle cx="280" cy="73" r="7" fill="#173f39" stroke="#173f39" stroke-width="2"/><text x="280" y="29" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">B</text><text x="280" y="55" font-size="19" font-weight="normal" text-anchor="middle" fill="#a45b30">3/4</text><path d="M280 73L224 189" fill="none" stroke="#16776d" stroke-width="3"/><circle cx="224" cy="189" r="26.16295090390226" fill="#eaf2ee" stroke="#16776d" stroke-width="2"/><text x="224" y="196" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">1/4</text><text x="224" y="244" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">B₁</text><path d="M280 73L280 189" fill="none" stroke="#aab6ae" stroke-width="1.5"/><circle cx="280" cy="189" r="26.16295090390226" fill="#f4f5f0" stroke="#82968a" stroke-width="2"/><text x="280" y="196" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">1/4</text><text x="280" y="244" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">B₂</text><path d="M280 73L336 189" fill="none" stroke="#aab6ae" stroke-width="1.5"/><circle cx="336" cy="189" r="26.16295090390226" fill="#f4f5f0" stroke="#82968a" stroke-width="2"/><text x="336" y="196" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">1/4</text><text x="336" y="244" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">B₃</text><text x="195" y="277" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">Disk area ∝ joint chance of tree + marked child</text></svg><path d="M30 490L870 490" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="521" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Exact first-generation example: P(L=1)=P(L=3)=1/2, m=2. In P mode choose a tree</text><text x="30" y="545" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">under its original law, then choose a child uniformly. In Q mode choose it using</text><text x="30" y="569" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Q1(t)=Z1(t)P1(t)/2, giving family weights 1/4,3/4 and Q1*(t,v)=P1(t)/2=1/4. Both</text><text x="30" y="593" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">modes choose a child uniformly conditional on the selected tree; only the tree</text><text x="30" y="617" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">weights change. Disk areas encode joint probabilities; edge lengths and</text><text x="30" y="641" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">positions stay fixed. Child buttons only move the mark. P already survives</text><text x="30" y="665" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">surely here, yet Q changes reproduction: size bias is not conditioning on</text><text x="30" y="689" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">survival. Only the first generation is illustrated; no infinite-level density</text><text x="30" y="713" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">dQ=W dP is asserted.</text></svg>