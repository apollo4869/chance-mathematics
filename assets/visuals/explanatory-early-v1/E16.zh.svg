<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 806" width="900" height="806" role="img" aria-label="相同的现在，能否作出同一判断？"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="806" fill="white"/><text x="30" y="45" font-size="27" font-weight="bold" text-anchor="start" fill="#173f39">相同的现在，能否作出同一判断？</text><path d="M30 65L870 65" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="450.0" y="91" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">同一前缀，两种合法完成</text><svg x="170" y="115" width="560" height="482" viewBox="0 0 360 310" preserveAspectRatio="xMidYMid meet"><path d="M30 146L92 88" fill="none" stroke="#16776d" stroke-width="2.5"/><path d="M92 88L154 146" fill="none" stroke="#16776d" stroke-width="2.5"/><circle cx="30" cy="146" r="5" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="30" y="171" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">n=0</text><text x="30" y="134" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">0</text><circle cx="92" cy="88" r="5" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="92" y="113" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">n=1</text><text x="92" y="76" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">1</text><circle cx="154" cy="146" r="5" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="154" y="171" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">n=2</text><text x="154" y="134" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">0</text><text x="89" y="40" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">已看见的共同前缀</text><text x="154" y="191" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">现在 n=2</text><path d="M174 54L174 270" fill="none" stroke="#ccd9d1" stroke-width="1" stroke-dasharray="4 4"/><path d="M154 146L235 88" fill="none" stroke="#16776d" stroke-width="2"/><path d="M235 88L324 30" fill="none" stroke="#16776d" stroke-width="2"/><path d="M235 88L324 146" fill="none" stroke="#a45b30" stroke-width="2"/><circle cx="324" cy="30" r="6" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="324" cy="146" r="6" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><text x="307" y="66" font-size="19" font-weight="normal" text-anchor="middle" fill="#16776d">L=2</text><text x="307" y="182" font-size="19" font-weight="normal" text-anchor="middle" fill="#a45b30">L=4</text><text x="235" y="111" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">n=3</text><text x="324" y="222" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">n=4</text><text x="180" y="292" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">首次正时返回 T=2：两条都已知道</text></svg><path d="M30 645L870 645" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="676" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">简单对称游走，S₀=0，自然滤过。T=inf{n≥1:Sₙ=0}，L=max{0≤n≤4:Sₙ=0}。图中共同前缀(0,1,0)对</text><text x="30" y="700" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">应同一个F₂原子；继续为(1,2)或(1,0)都具有正概率，分别给L=2或4，而两条都给T=2。因此{L≤2}在该原</text><text x="30" y="724" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">子上并非常量，不是F₂事件。仅画两种合法完成以证明不能判断，并未枚举全部未来或给它们任意总概率。</text><text x="30" y="748" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">停止信息合法不自动保证无界optional sampling可用，UI等条件仍见正文。</text></svg>