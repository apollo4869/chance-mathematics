<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 350" width="370" height="350" role="img" aria-label="Same embedded chain; mean holding times, not a sampled clock"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><text x="185" y="25" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">Each jump goes to the next state</text><circle cx="25.0" cy="64" r="11" fill="white" stroke="#a45b30" stroke-width="2"/><text x="25.0" y="69" font-size="13" font-weight="normal" text-anchor="middle" fill="#173f39">1</text><path d="M38.0 64L112.0 64" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M104.79642318117858 67.47972427288984L112.0 64" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M104.79642318117858 60.52027572711016L112.0 64" fill="none" stroke="#a45b30" stroke-width="2"/><circle cx="125.0" cy="64" r="11" fill="white" stroke="#a45b30" stroke-width="2"/><text x="125.0" y="69" font-size="13" font-weight="normal" text-anchor="middle" fill="#173f39">2</text><path d="M138.0 64L212.0 64" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M204.7964231811786 67.47972427288984L212.0 64" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M204.7964231811786 60.52027572711016L212.0 64" fill="none" stroke="#a45b30" stroke-width="2"/><circle cx="225.0" cy="64" r="11" fill="white" stroke="#a45b30" stroke-width="2"/><text x="225.0" y="69" font-size="13" font-weight="normal" text-anchor="middle" fill="#173f39">3</text><path d="M238.0 64L312.0 64" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M304.79642318117857 67.47972427288984L312.0 64" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M304.79642318117857 60.52027572711016L312.0 64" fill="none" stroke="#a45b30" stroke-width="2"/><circle cx="325.0" cy="64" r="11" fill="white" stroke="#a45b30" stroke-width="2"/><text x="325.0" y="69" font-size="13" font-weight="normal" text-anchor="middle" fill="#173f39">4</text><text x="351" y="69" font-size="20" font-weight="normal" text-anchor="start" fill="#a45b30">…</text><text x="185" y="111" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">Lengths below = mean holding times</text><rect x="35" y="143" width="140.0" height="47" fill="#eaf2ee" stroke="#a45b30" stroke-width="1.5"/><text x="105.0" y="173" font-size="15" font-weight="normal" text-anchor="middle" fill="#a45b30">1/2</text><rect x="175.0" y="143" width="70.0" height="47" fill="#eaf2ee" stroke="#a45b30" stroke-width="1.5"/><text x="210.0" y="173" font-size="15" font-weight="normal" text-anchor="middle" fill="#a45b30">1/4</text><rect x="245.0" y="143" width="35.0" height="47" fill="#eaf2ee" stroke="#a45b30" stroke-width="1.5"/><text x="262.5" y="173" font-size="15" font-weight="normal" text-anchor="middle" fill="#a45b30">1/8</text><rect x="280.0" y="143" width="17.5" height="47" fill="#eaf2ee" stroke="#a45b30" stroke-width="1.5"/><rect x="297.5" y="143" width="17.5" height="47" fill="white" stroke="#65756e" stroke-width="1.5"/><text x="185" y="221" font-size="16" font-weight="normal" text-anchor="middle" fill="#a45b30">Filled: first n means</text><text x="185" y="248" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">Unfilled: sum of all later means</text><path d="M35 277L315 277" fill="none" stroke="#65756e" stroke-width="1"/><path d="M35 270L35 284" fill="none" stroke="#65756e" stroke-width="2"/><path d="M315 270L315 284" fill="none" stroke="#65756e" stroke-width="2"/><text x="185" y="309" font-size="29" font-weight="normal" text-anchor="middle" fill="#a45b30">Eζ = 1</text><text x="185" y="339" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">λⱼ = 2ʲ     Eτⱼ = 2⁻ʲ</text></svg>