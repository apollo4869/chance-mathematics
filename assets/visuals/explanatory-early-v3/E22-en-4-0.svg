<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 350" width="370" height="350" role="img" aria-label="Same embedded chain; mean holding times, not a sampled clock"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><text x="185" y="25" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">Each jump goes to the next state</text><circle cx="25.0" cy="64" r="11" fill="white" stroke="#16776d" stroke-width="2"/><text x="25.0" y="69" font-size="13" font-weight="normal" text-anchor="middle" fill="#173f39">1</text><path d="M38.0 64L112.0 64" fill="none" stroke="#16776d" stroke-width="2"/><path d="M104.79642318117858 67.47972427288984L112.0 64" fill="none" stroke="#16776d" stroke-width="2"/><path d="M104.79642318117858 60.52027572711016L112.0 64" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="125.0" cy="64" r="11" fill="white" stroke="#16776d" stroke-width="2"/><text x="125.0" y="69" font-size="13" font-weight="normal" text-anchor="middle" fill="#173f39">2</text><path d="M138.0 64L212.0 64" fill="none" stroke="#16776d" stroke-width="2"/><path d="M204.7964231811786 67.47972427288984L212.0 64" fill="none" stroke="#16776d" stroke-width="2"/><path d="M204.7964231811786 60.52027572711016L212.0 64" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="225.0" cy="64" r="11" fill="white" stroke="#16776d" stroke-width="2"/><text x="225.0" y="69" font-size="13" font-weight="normal" text-anchor="middle" fill="#173f39">3</text><path d="M238.0 64L312.0 64" fill="none" stroke="#16776d" stroke-width="2"/><path d="M304.79642318117857 67.47972427288984L312.0 64" fill="none" stroke="#16776d" stroke-width="2"/><path d="M304.79642318117857 60.52027572711016L312.0 64" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="325.0" cy="64" r="11" fill="white" stroke="#16776d" stroke-width="2"/><text x="325.0" y="69" font-size="13" font-weight="normal" text-anchor="middle" fill="#173f39">4</text><text x="351" y="69" font-size="20" font-weight="normal" text-anchor="start" fill="#16776d">…</text><text x="185" y="111" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">Lengths below = mean holding times</text><rect x="23" y="143" width="40" height="47" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="63" y="143" width="40" height="47" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="103" y="143" width="40" height="47" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="143" y="143" width="40" height="47" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><path d="M183 166L350 166" fill="none" stroke="#16776d" stroke-width="2"/><path d="M342.79642318117857 169.47972427288985L350 166" fill="none" stroke="#16776d" stroke-width="2"/><path d="M342.79642318117857 162.52027572711015L350 166" fill="none" stroke="#16776d" stroke-width="2"/><text x="185" y="221" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">Each mean is 1</text><text x="185" y="248" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">The arrow continues, with no finite endpoint</text><text x="185" y="309" font-size="29" font-weight="normal" text-anchor="middle" fill="#16776d">ζ = ∞  a.s.</text><text x="185" y="339" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">λⱼ = 1     Eτⱼ = 1</text></svg>