<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 666" width="900" height="666" role="img" aria-label="同一个核，两个方向的平均"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="666" fill="white"/><text x="30" y="45" font-size="26" font-weight="bold" text-anchor="start" fill="#173f39">同一个核，两个方向的平均</text><text x="25" y="94" font-size="19" font-weight="bold" text-anchor="start" fill="#173f39">μ → μP</text><svg x="25" y="110" width="420" height="330" viewBox="0 0 370 330"><path d="M80 72L290 72" fill="none" stroke="#16776d" stroke-width="2"/><path d="M282.79642318117857 75.47972427288984L290 72" fill="none" stroke="#16776d" stroke-width="2"/><path d="M282.79642318117857 68.52027572711016L290 72" fill="none" stroke="#16776d" stroke-width="2"/><path d="M80 72L290 240" fill="none" stroke="#16776d" stroke-width="2"/><path d="M282.20118502562633 238.2171693867659L290 240" fill="none" stroke="#16776d" stroke-width="2"/><path d="M286.5487180658847 232.7827530864429L290 240" fill="none" stroke="#16776d" stroke-width="2"/><path d="M80 240L290 72" fill="none" stroke="#16776d" stroke-width="2"/><path d="M286.5487180658847 79.21724691355709L290 72" fill="none" stroke="#16776d" stroke-width="2"/><path d="M282.20118502562633 73.78283061323408L290 72" fill="none" stroke="#16776d" stroke-width="2"/><path d="M80 240L290 240" fill="none" stroke="#16776d" stroke-width="2"/><path d="M282.79642318117857 243.47972427288985L290 240" fill="none" stroke="#16776d" stroke-width="2"/><path d="M282.79642318117857 236.52027572711015L290 240" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="53" cy="86" r="25" fill="white" stroke="#173f39" stroke-width="2"/><text x="53" y="93" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">A</text><circle cx="53" cy="226" r="25" fill="white" stroke="#173f39" stroke-width="2"/><text x="53" y="233" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">B</text><circle cx="317" cy="86" r="25" fill="white" stroke="#173f39" stroke-width="2"/><text x="317" y="93" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">A</text><circle cx="317" cy="226" r="25" fill="white" stroke="#173f39" stroke-width="2"/><text x="317" y="233" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">B</text><text x="185" y="47" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">P = [ 3/4  1/4 ; 1/4  3/4 ]</text><rect x="139" y="118" width="92" height="67" fill="white"/><text x="185" y="143" font-size="20" font-weight="normal" text-anchor="middle" fill="#16776d">3/4</text><text x="185" y="172" font-size="20" font-weight="normal" text-anchor="middle" fill="#16776d">1/4</text><rect x="23" y="121" width="60" height="13" fill="#f1f0e9"/><rect x="23" y="121" width="60.0" height="13" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="53" y="158" font-size="20" font-weight="normal" text-anchor="middle" fill="#16776d">1</text><rect x="23" y="261" width="60" height="13" fill="#f1f0e9"/><rect x="23" y="261" width="0.0" height="13" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="53" y="298" font-size="20" font-weight="normal" text-anchor="middle" fill="#16776d">0</text><rect x="287" y="121" width="60" height="13" fill="#f1f0e9"/><rect x="287" y="121" width="45.0" height="13" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="317" y="158" font-size="20" font-weight="normal" text-anchor="middle" fill="#16776d">0.75</text><rect x="287" y="261" width="60" height="13" fill="#f1f0e9"/><rect x="287" y="261" width="15.0" height="13" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="317" y="298" font-size="20" font-weight="normal" text-anchor="middle" fill="#16776d">0.25</text><text x="53" y="320" font-size="24" font-weight="normal" text-anchor="middle" fill="#16776d">μ</text><text x="317" y="320" font-size="24" font-weight="normal" text-anchor="middle" fill="#16776d">μP</text></svg><text x="475" y="94" font-size="19" font-weight="bold" text-anchor="start" fill="#173f39">Tf ← f</text><svg x="475" y="110" width="420" height="330" viewBox="0 0 370 330"><path d="M290 72L80 72" fill="none" stroke="#16776d" stroke-width="2"/><path d="M87.20357681882142 68.52027572711016L80 72" fill="none" stroke="#16776d" stroke-width="2"/><path d="M87.20357681882142 75.47972427288984L80 72" fill="none" stroke="#16776d" stroke-width="2"/><path d="M290 240L80 72" fill="none" stroke="#16776d" stroke-width="2"/><path d="M87.7988149743737 73.78283061323408L80 72" fill="none" stroke="#16776d" stroke-width="2"/><path d="M83.45128193411529 79.21724691355709L80 72" fill="none" stroke="#16776d" stroke-width="2"/><path d="M290 72L80 240" fill="none" stroke="#16776d" stroke-width="2"/><path d="M83.45128193411529 232.7827530864429L80 240" fill="none" stroke="#16776d" stroke-width="2"/><path d="M87.7988149743737 238.2171693867659L80 240" fill="none" stroke="#16776d" stroke-width="2"/><path d="M290 240L80 240" fill="none" stroke="#16776d" stroke-width="2"/><path d="M87.20357681882142 236.52027572711015L80 240" fill="none" stroke="#16776d" stroke-width="2"/><path d="M87.20357681882142 243.47972427288985L80 240" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="53" cy="86" r="25" fill="white" stroke="#173f39" stroke-width="2"/><text x="53" y="93" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">A</text><circle cx="53" cy="226" r="25" fill="white" stroke="#173f39" stroke-width="2"/><text x="53" y="233" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">B</text><circle cx="317" cy="86" r="25" fill="white" stroke="#173f39" stroke-width="2"/><text x="317" y="93" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">A</text><circle cx="317" cy="226" r="25" fill="white" stroke="#173f39" stroke-width="2"/><text x="317" y="233" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">B</text><text x="185" y="47" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">P = [ 3/4  1/4 ; 1/4  3/4 ]</text><rect x="139" y="118" width="92" height="67" fill="white"/><text x="185" y="143" font-size="20" font-weight="normal" text-anchor="middle" fill="#16776d">3/4</text><text x="185" y="172" font-size="20" font-weight="normal" text-anchor="middle" fill="#16776d">1/4</text><text x="53" y="135" font-size="26" font-weight="normal" text-anchor="middle" fill="#a45b30">1</text><text x="317" y="135" font-size="26" font-weight="normal" text-anchor="middle" fill="#a45b30">0</text><text x="53" y="275" font-size="26" font-weight="normal" text-anchor="middle" fill="#a45b30">3</text><text x="317" y="275" font-size="26" font-weight="normal" text-anchor="middle" fill="#a45b30">4</text><text x="53" y="305" font-size="24" font-weight="normal" text-anchor="middle" fill="#a45b30">Tf</text><text x="317" y="305" font-size="24" font-weight="normal" text-anchor="middle" fill="#a45b30">f</text></svg><path d="M25 505L875 505" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="25" y="535" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">有限状态精确核：行是出发状态、列是到达状态，对角3/4、非对角1/4。左下色条长度表示质量，右图数值</text><text x="25" y="559" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">是收益，不是概率；所有箭头只是运算方向，不以线宽编码流量。Tf=(3f(A)/4+f(B)/4, f(A)/4+3f(B)/4)</text><text x="25" y="583" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">。独立选择μ与f，有限求和交换给Σᵧ(ΣₓμₓPₓᵧ)fᵧ=Σₓμₓ(ΣᵧPₓᵧfᵧ)。本图只解释一个固</text><text x="25" y="607" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">定时刻的核及其对偶作用，不以单个矩阵证明连续时间半群、生成元或Feller条件。</text></svg>