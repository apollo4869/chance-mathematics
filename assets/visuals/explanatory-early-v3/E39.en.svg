<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 822" width="900" height="822" role="img" aria-label="Two coordinates need not give two directions"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="822" fill="white"/><text x="30" y="45" font-size="26" font-weight="bold" text-anchor="start" fill="#173f39">Two coordinates need not give two directions</text><text x="25" y="94" font-size="19" font-weight="bold" text-anchor="start" fill="#173f39">rank 1</text><svg x="25" y="110" width="420" height="390" viewBox="0 0 370 390"><text x="185" y="24" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">Two orthogonal readings, one path</text><text x="185" y="56" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">F = (Z₁, 2Z₁)</text><path d="M88.10000000000001 224L287.6 224" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M185 343.7L185 104.3" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="293.3" y="224" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">F₁</text><text x="195" y="91" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">F₂</text><path d="M128 338L242 110" fill="none" stroke="#a45b30" stroke-width="4"/><path d="M185 224L242 110" fill="none" stroke="#16776d" stroke-width="2"/><path d="M241.8908225172498 117.99925498263809L242 110" fill="none" stroke="#16776d" stroke-width="2"/><path d="M235.66610250353963 114.88689497578301L242 110" fill="none" stroke="#16776d" stroke-width="2"/><text x="250" y="108" font-size="16" font-weight="normal" text-anchor="start" fill="#16776d">ΔZ₁</text><circle cx="185" cy="224" r="6" fill="white" stroke="#a45b30" stroke-width="2"/><text x="198" y="253" font-size="17" font-weight="normal" text-anchor="start" fill="#a45b30">ΔZ₂ ↦ 0</text><text x="185" y="374" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">Perturbation square → line</text></svg><text x="475" y="94" font-size="19" font-weight="bold" text-anchor="start" fill="#173f39">rank 2</text><svg x="475" y="110" width="420" height="390" viewBox="0 0 370 390"><text x="185" y="24" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">Two orthogonal readings, one path</text><text x="185" y="56" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">F = (Z₁, Z₁+Z₂)</text><path d="M88.10000000000001 224L287.6 224" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M185 343.7L185 104.3" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="293.3" y="224" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">F₁</text><text x="195" y="91" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">F₂</text><polygon points="128,338 242,224 242,110 128,224" fill="#eaf2ee" stroke="#16776d" stroke-width="2"/><path d="M156.5 309.5L156.5 195.5" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M128 309.5L242 195.5" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M185 281L185 167" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M128 281L242 167" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M213.5 252.5L213.5 138.5" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M128 252.5L242 138.5" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M185 224L242 167" fill="none" stroke="#16776d" stroke-width="2"/><path d="M239.366838612633 174.55423464740667L242 167" fill="none" stroke="#16776d" stroke-width="2"/><path d="M234.44576535259333 169.633161387367L242 167" fill="none" stroke="#16776d" stroke-width="2"/><text x="250" y="165" font-size="16" font-weight="normal" text-anchor="start" fill="#16776d">ΔZ₁</text><path d="M185 224L185 167" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M188.47972427288985 174.2035768188214L185 167" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M181.52027572711015 174.2035768188214L185 167" fill="none" stroke="#a45b30" stroke-width="2"/><text x="132" y="162" font-size="16" font-weight="normal" text-anchor="start" fill="#a45b30">ΔZ₂</text><text x="185" y="374" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">Perturbation square → area</text></svg><path d="M25 565L875 565" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="25" y="595" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">On one Brownian path set Z1=B1 and Z2=√12(∫0^1 Bs ds−B1/2)=∫0^1 √12(1/2−s)dBs.</text><text x="25" y="619" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Their L²[0,1] kernels are orthogonal unit vectors, hence Z1,Z2 are independent</text><text x="25" y="643" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">standard normals. Left response matrix [[1,0],[2,0]] gives γ=[[1,2],[2,4]];</text><text x="25" y="667" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">right [[1,0],[1,1]] gives γ=[[1,1],[1,2]]. The drawings are linear images of the</text><text x="25" y="691" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">noise perturbation square [-1,1]^2, not density heat maps or bounded Gaussian</text><text x="25" y="715" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">supports. The full-rank linear Gaussian example has a smooth density; arbitrary</text><text x="25" y="739" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Malliavin differentiability does not imply this. General results require the</text><text x="25" y="763" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">nondegeneracy and integrability conditions established in the text.</text></svg>