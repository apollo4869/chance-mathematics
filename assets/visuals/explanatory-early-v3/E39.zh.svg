<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" role="img" aria-label="两个坐标，不一定有两个方向"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="750" fill="white"/><text x="30" y="45" font-size="26" font-weight="bold" text-anchor="start" fill="#173f39">两个坐标，不一定有两个方向</text><text x="25" y="94" font-size="19" font-weight="bold" text-anchor="start" fill="#173f39">rank 1</text><svg x="25" y="110" width="420" height="390" viewBox="0 0 370 390"><text x="185" y="24" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">同一路径，两个正交读数</text><text x="185" y="56" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">F = (Z₁, 2Z₁)</text><path d="M88.10000000000001 224L287.6 224" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M185 343.7L185 104.3" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="293.3" y="224" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">F₁</text><text x="195" y="91" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">F₂</text><path d="M128 338L242 110" fill="none" stroke="#a45b30" stroke-width="4"/><path d="M185 224L242 110" fill="none" stroke="#16776d" stroke-width="2"/><path d="M241.8908225172498 117.99925498263809L242 110" fill="none" stroke="#16776d" stroke-width="2"/><path d="M235.66610250353963 114.88689497578301L242 110" fill="none" stroke="#16776d" stroke-width="2"/><text x="250" y="108" font-size="16" font-weight="normal" text-anchor="start" fill="#16776d">ΔZ₁</text><circle cx="185" cy="224" r="6" fill="white" stroke="#a45b30" stroke-width="2"/><text x="198" y="253" font-size="17" font-weight="normal" text-anchor="start" fill="#a45b30">ΔZ₂ ↦ 0</text><text x="185" y="374" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">扰动方块的像仍是一条线</text></svg><text x="475" y="94" font-size="19" font-weight="bold" text-anchor="start" fill="#173f39">rank 2</text><svg x="475" y="110" width="420" height="390" viewBox="0 0 370 390"><text x="185" y="24" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">同一路径，两个正交读数</text><text x="185" y="56" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">F = (Z₁, Z₁+Z₂)</text><path d="M88.10000000000001 224L287.6 224" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M185 343.7L185 104.3" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="293.3" y="224" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">F₁</text><text x="195" y="91" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">F₂</text><polygon points="128,338 242,224 242,110 128,224" fill="#eaf2ee" stroke="#16776d" stroke-width="2"/><path d="M156.5 309.5L156.5 195.5" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M128 309.5L242 195.5" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M185 281L185 167" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M128 281L242 167" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M213.5 252.5L213.5 138.5" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M128 252.5L242 138.5" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M185 224L242 167" fill="none" stroke="#16776d" stroke-width="2"/><path d="M239.366838612633 174.55423464740667L242 167" fill="none" stroke="#16776d" stroke-width="2"/><path d="M234.44576535259333 169.633161387367L242 167" fill="none" stroke="#16776d" stroke-width="2"/><text x="250" y="165" font-size="16" font-weight="normal" text-anchor="start" fill="#16776d">ΔZ₁</text><path d="M185 224L185 167" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M188.47972427288985 174.2035768188214L185 167" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M181.52027572711015 174.2035768188214L185 167" fill="none" stroke="#a45b30" stroke-width="2"/><text x="132" y="162" font-size="16" font-weight="normal" text-anchor="start" fill="#a45b30">ΔZ₂</text><text x="185" y="374" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">扰动方块的像有面积</text></svg><path d="M25 565L875 565" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="25" y="595" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">取同一Brownian运动上Z₁=B₁、Z₂=√12(∫₀¹Bₛds−B₁/2)=∫₀¹√12(1/2−s)dBₛ。两个核在</text><text x="25" y="619" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">L²[0,1]中正交且范数1，故(Z₁,Z₂)为独立标准正态。左响应矩阵[[1,0],[2,0]]，γ=[[1,2],[2,4]]；右</text><text x="25" y="643" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">[[1,0],[1,1]]，γ=[[1,1],[1,2]]。图画[-1,1]²噪声扰动方块的线性像，不是密度热图，也不把方块当作</text><text x="25" y="667" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Gaussian支撑。这里的线性Gaussian例子右侧有光滑密度，不能据此宣称任意可Malliavin微分输出都有光滑</text><text x="25" y="691" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">密度；一般结论还需正文的非退化与可积性条件。</text></svg>