<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 937.9142857142857" width="900" height="937.9142857142857" role="img" aria-label="Success on this step; a fresh start at its endpoint"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="937.9142857142857" fill="white"/><text x="30" y="40" font-size="25" font-weight="bold" text-anchor="start" fill="#173f39">Success on this step; a fresh start at its endpoint</text><svg x="35" y="80" width="390" height="351.0" viewBox="0 0 350 315"><circle cx="175" cy="35" r="25" fill="white" stroke="#16776d" stroke-width="2"/><text x="175" y="43" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">Xₙ=a</text><path d="M155 55L86 106" fill="none" stroke="#16776d" stroke-width="2"/><path d="M89.724627608074 98.91994709192277L86 106" fill="none" stroke="#16776d" stroke-width="2"/><path d="M93.86126161375815 104.5165695702013L86 106" fill="none" stroke="#16776d" stroke-width="2"/><text x="117" y="88" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">1/2</text><rect x="18" y="116" width="136" height="89" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="86" y="146" font-size="23" font-weight="normal" text-anchor="middle" fill="#16776d">ν</text><rect x="33" y="162" width="53" height="28" fill="#16776d"/><text x="60" y="182" font-size="18" font-weight="normal" text-anchor="middle" fill="white">a</text><rect x="86" y="162" width="53" height="28" fill="#a45b30"/><text x="113" y="182" font-size="18" font-weight="normal" text-anchor="middle" fill="white">b</text><path d="M195 55L264 106" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M256.13873838624187 104.5165695702013L264 106" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M260.275372391926 98.91994709192277L264 106" fill="none" stroke="#a45b30" stroke-width="2"/><text x="233" y="88" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">1/2</text><rect x="196" y="116" width="136" height="89" fill="white" stroke="#a45b30" stroke-width="1.5"/><text x="264" y="146" font-size="23" font-weight="normal" text-anchor="middle" fill="#a45b30">δa</text><rect x="211" y="162" width="106" height="28" fill="#16776d"/><text x="264" y="182" font-size="18" font-weight="normal" text-anchor="middle" fill="white">a</text><text x="86" y="229" font-size="16" font-weight="normal" text-anchor="middle" fill="#16776d">Fresh, not from x</text><text x="264" y="229" font-size="16" font-weight="normal" text-anchor="middle" fill="#a45b30">Stay at the current x</text><rect x="25" y="265" width="225.0" height="30" fill="#16776d"/><rect x="250.0" y="265" width="75.0" height="30" fill="#a45b30"/><text x="137.5" y="286" font-size="18" font-weight="normal" text-anchor="middle" fill="white">a: 3/4</text><text x="287.5" y="286" font-size="18" font-weight="normal" text-anchor="middle" fill="white">b: 1/4</text><text x="175" y="312" font-size="17" font-weight="normal" text-anchor="middle" fill="#65756e">P(a, ·)</text></svg><svg x="475" y="80" width="390" height="476.9142857142857" viewBox="0 0 350 428"><text x="175" y="23" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Successful edge → next endpoint</text><rect x="234" y="120" width="98" height="117" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="283" y="183.5" font-size="20" font-weight="normal" text-anchor="middle" fill="#16776d">[2,5)</text><rect x="234" y="237" width="98" height="117" fill="#fbf0df" stroke="#a45b30" stroke-width="1.5"/><text x="283" y="300.5" font-size="20" font-weight="normal" text-anchor="middle" fill="#a45b30">[5,8)</text><text x="15" y="48" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">0</text><circle cx="91" cy="42" r="14" fill="white" stroke="#65756e" stroke-width="2"/><text x="91" y="48" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">a</text><path d="M91 57L91 66" fill="none" stroke="#ccd9d1" stroke-width="2"/><text x="134" y="67" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">δ0=0</text><text x="15" y="87" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">1</text><circle cx="91" cy="81" r="14" fill="white" stroke="#65756e" stroke-width="2"/><text x="91" y="87" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">a</text><path d="M91 96L91 105" fill="none" stroke="#16776d" stroke-width="2"/><text x="134" y="106" font-size="16" font-weight="normal" text-anchor="start" fill="#16776d">δ1=1</text><text x="15" y="126" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">2</text><circle cx="91" cy="120" r="14" fill="white" stroke="#16776d" stroke-width="2"/><text x="91" y="126" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">b</text><path d="M91 135L91 144" fill="none" stroke="#ccd9d1" stroke-width="2"/><text x="134" y="145" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">δ2=0</text><text x="15" y="165" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">3</text><circle cx="91" cy="159" r="14" fill="white" stroke="#65756e" stroke-width="2"/><text x="91" y="165" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">b</text><path d="M91 174L91 183" fill="none" stroke="#ccd9d1" stroke-width="2"/><text x="134" y="184" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">δ3=0</text><text x="15" y="204" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">4</text><circle cx="91" cy="198" r="14" fill="white" stroke="#65756e" stroke-width="2"/><text x="91" y="204" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">b</text><path d="M91 213L91 222" fill="none" stroke="#16776d" stroke-width="2"/><text x="134" y="223" font-size="16" font-weight="normal" text-anchor="start" fill="#16776d">δ4=1</text><text x="15" y="243" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">5</text><circle cx="91" cy="237" r="14" fill="white" stroke="#16776d" stroke-width="2"/><text x="91" y="243" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">a</text><path d="M91 252L91 261" fill="none" stroke="#ccd9d1" stroke-width="2"/><text x="134" y="262" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">δ5=0</text><text x="15" y="282" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">6</text><circle cx="91" cy="276" r="14" fill="white" stroke="#65756e" stroke-width="2"/><text x="91" y="282" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">a</text><path d="M91 291L91 300" fill="none" stroke="#ccd9d1" stroke-width="2"/><text x="134" y="301" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">δ6=0</text><text x="15" y="321" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">7</text><circle cx="91" cy="315" r="14" fill="white" stroke="#65756e" stroke-width="2"/><text x="91" y="321" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">a</text><path d="M91 330L91 339" fill="none" stroke="#16776d" stroke-width="2"/><text x="134" y="340" font-size="16" font-weight="normal" text-anchor="start" fill="#16776d">δ7=1</text><text x="15" y="360" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">8</text><circle cx="91" cy="354" r="14" fill="white" stroke="#16776d" stroke-width="2"/><text x="91" y="360" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">b</text><text x="175" y="406" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">The right endpoint starts the next cycle</text></svg><text x="30" y="581.9142857142857" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">Success at n; fresh start at n+1. A shared endpoint belongs only to the next cycle.</text><path d="M30 613.9142857142857L870 613.9142857142857" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="643.9142857142857" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Exact finite model: E=C={a,b}, epsilon=1/2, nu=(delta_a+delta_b)/2 and</text><text x="30" y="667.9142857142857" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">R_x=delta_x. P has rows (3/4,1/4) and (1/4,3/4). Toss an independent coin</text><text x="30" y="691.9142857142857" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">delta_n first, then draw X_(n+1) from nu or R_x; do not observe the next state</text><text x="30" y="715.9142857142857" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">and retroactively add an uncorrected independent coin. The displayed successes</text><text x="30" y="739.9142857142857" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">at n=r,4,7 yield fresh starts at r+1,5,8. This is one valid positive-probability</text><text x="30" y="763.9142857142857" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">finite configuration, not simulated frequencies. A fresh nu endpoint is</text><text x="30" y="787.9142857142857" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">independent of the preceding information. From nu, half-open marks</text><text x="30" y="811.9142857142857" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">(L,X0,...,X_(L-1)) are iid; the right endpoint starts the next cycle, and the</text><text x="30" y="835.9142857142857" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">initial delay is separate. Here L is geometric(1/2) on positive integers with</text><text x="30" y="859.9142857142857" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">mean 2. A general small set needs return assumptions; finite cycles need not</text><text x="30" y="883.9142857142857" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">have finite mean, and regeneration alone does not align two clocks.</text></svg>