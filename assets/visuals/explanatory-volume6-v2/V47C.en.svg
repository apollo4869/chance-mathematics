<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 852.7142857142858" width="900" height="852.7142857142858" role="img" aria-label="A merger can be invisible to the sample"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="852.7142857142858" fill="white"/><text x="30" y="40" font-size="25" font-weight="bold" text-anchor="start" fill="#173f39">A merger can be invisible to the sample</text><svg x="35" y="80" width="390" height="367.7142857142857" viewBox="0 0 350 330"><text x="175" y="25" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">Full four-person record</text><rect x="38.5" y="54" width="98" height="58" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><circle cx="59.5" cy="83" r="11" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="59.5" y="89" font-size="16" font-weight="normal" text-anchor="middle" fill="white">1</text><circle cx="87.5" cy="83" r="11" fill="white" stroke="#65756e" stroke-width="2"/><text x="87.5" y="89" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">3</text><circle cx="115.5" cy="83" r="11" fill="white" stroke="#65756e" stroke-width="2"/><text x="115.5" y="89" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">4</text><rect x="236.0" y="54" width="53" height="58" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><circle cx="262.5" cy="83" r="11" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="262.5" y="89" font-size="16" font-weight="normal" text-anchor="middle" fill="white">2</text><path d="M175 121L175 180" fill="none" stroke="#16776d" stroke-width="2"/><path d="M171.52027572711015 172.7964231811786L175 180" fill="none" stroke="#16776d" stroke-width="2"/><path d="M178.47972427288985 172.7964231811786L175 180" fill="none" stroke="#16776d" stroke-width="2"/><text x="193" y="153" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">Keep [2]</text><text x="175" y="209" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Partition visible to the sample</text><rect x="61.0" y="223" width="53" height="58" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><circle cx="87.5" cy="252" r="11" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="87.5" y="258" font-size="16" font-weight="normal" text-anchor="middle" fill="white">1</text><rect x="236.0" y="223" width="53" height="58" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><circle cx="262.5" cy="252" r="11" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="262.5" y="258" font-size="16" font-weight="normal" text-anchor="middle" fill="white">2</text><text x="175" y="321" font-size="19" font-weight="normal" text-anchor="middle" fill="#a45b30">The restriction has not changed</text></svg><svg x="475" y="80" width="390" height="367.7142857142857" viewBox="0 0 350 330"><text x="175" y="25" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Each pair of full blocks has rate 1</text><rect x="24" y="52" width="43" height="31" fill="#16776d" stroke="#ccd9d1" stroke-width="1.5"/><text x="45" y="74" font-size="17" font-weight="normal" text-anchor="middle" fill="white">1</text><rect x="75" y="52" width="43" height="31" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><rect x="126" y="52" width="43" height="31" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><rect x="177" y="52" width="43" height="31" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><rect x="228" y="52" width="43" height="31" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><rect x="279" y="52" width="43" height="31" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><text x="175" y="111" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Full rate 1 = visible 1 + invisible 0</text><text x="22" y="155" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">Full events</text><path d="M25 185L325 185" fill="none" stroke="#ccd9d1" stroke-width="2"/><circle cx="71.875" cy="185" r="6" fill="#65756e" stroke="#65756e" stroke-width="2"/><text x="71.875" y="208" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">0.25</text><circle cx="156.25" cy="185" r="6" fill="#65756e" stroke="#65756e" stroke-width="2"/><text x="156.25" y="208" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">0.7</text><circle cx="287.5" cy="185" r="6" fill="white" stroke="#16776d" stroke-width="2"/><text x="287.5" y="208" font-size="14" font-weight="normal" text-anchor="middle" fill="#16776d">1.4</text><text x="25" y="208" font-size="14" font-weight="normal" text-anchor="start" fill="#65756e">0</text><text x="325" y="208" font-size="14" font-weight="normal" text-anchor="start" fill="#65756e">t</text><text x="22" y="235" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">Restricted events</text><path d="M25 265L325 265" fill="none" stroke="#ccd9d1" stroke-width="2"/><circle cx="287.5" cy="265" r="6" fill="white" stroke="#16776d" stroke-width="2"/><text x="287.5" y="288" font-size="14" font-weight="normal" text-anchor="middle" fill="#16776d">1.4</text><text x="25" y="288" font-size="14" font-weight="normal" text-anchor="start" fill="#65756e">0</text><text x="325" y="288" font-size="14" font-weight="normal" text-anchor="start" fill="#65756e">t</text><text x="175" y="326" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">Hide an event; do not delete elapsed time</text></svg><text x="30" y="472.7142857142857" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">Keeping [2]: visible rate stays 1; the first two events leave the restriction unchanged.</text><path d="M30 504.7142857142857L870 504.7142857142857" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="534.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Kingman gives every pair of current full blocks rate 1, without mass weighting.</text><text x="30" y="558.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">The illustrative four-person path merges {3}+{4}, then {1}+{3,4}, then</text><text x="30" y="582.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">{1,3,4}+{2}. Gray individuals are not in the retained sample [n]. Each visible</text><text x="30" y="606.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">block has one full-block preimage; each visible pair still merges at rate 1. A</text><text x="30" y="630.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">merger with an empty projection leaves the restriction unchanged. Each rate-bar</text><text x="30" y="654.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">cell is one unit-rate pair, not probability mass. Both axes retain the same</text><text x="30" y="678.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">elapsed time: the illustrative event times 0.25,0.7,1.4 are neither expected</text><text x="30" y="702.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">waits nor compressed after hiding events. The finite generators satisfy L4(f o</text><text x="30" y="726.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">r_n)=(Ln f) o r_n. Powers and the exponential series yield semigroup</text><text x="30" y="750.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">consistency; conditioning and the tower property give the restricted Markov law.</text><text x="30" y="774.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Matching margins or block counts alone is insufficient. No first-jump clock with</text><text x="30" y="798.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">infinite total rate is assumed.</text></svg>