<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 708.7142857142858" width="900" height="708.7142857142858" role="img" aria-label="合并发生了，样本未必看得见"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="708.7142857142858" fill="white"/><text x="30" y="40" font-size="25" font-weight="bold" text-anchor="start" fill="#173f39">合并发生了，样本未必看得见</text><svg x="35" y="80" width="390" height="367.7142857142857" viewBox="0 0 350 330"><text x="175" y="25" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">完整四人记录</text><rect x="38.5" y="54" width="98" height="58" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><circle cx="59.5" cy="83" r="11" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="59.5" y="89" font-size="16" font-weight="normal" text-anchor="middle" fill="white">1</text><circle cx="87.5" cy="83" r="11" fill="white" stroke="#65756e" stroke-width="2"/><text x="87.5" y="89" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">3</text><circle cx="115.5" cy="83" r="11" fill="white" stroke="#65756e" stroke-width="2"/><text x="115.5" y="89" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">4</text><rect x="236.0" y="54" width="53" height="58" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><circle cx="262.5" cy="83" r="11" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="262.5" y="89" font-size="16" font-weight="normal" text-anchor="middle" fill="white">2</text><path d="M175 121L175 180" fill="none" stroke="#16776d" stroke-width="2"/><path d="M171.52027572711015 172.7964231811786L175 180" fill="none" stroke="#16776d" stroke-width="2"/><path d="M178.47972427288985 172.7964231811786L175 180" fill="none" stroke="#16776d" stroke-width="2"/><text x="193" y="153" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">只留 [2]</text><text x="175" y="209" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">有限样本看见的划分</text><rect x="61.0" y="223" width="53" height="58" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><circle cx="87.5" cy="252" r="11" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="87.5" y="258" font-size="16" font-weight="normal" text-anchor="middle" fill="white">1</text><rect x="236.0" y="223" width="53" height="58" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><circle cx="262.5" cy="252" r="11" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="262.5" y="258" font-size="16" font-weight="normal" text-anchor="middle" fill="white">2</text><text x="175" y="321" font-size="19" font-weight="normal" text-anchor="middle" fill="#a45b30">限制划分没有改变</text></svg><svg x="475" y="80" width="390" height="367.7142857142857" viewBox="0 0 350 330"><text x="175" y="25" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">每个完整块对，速率1</text><rect x="24" y="52" width="43" height="31" fill="#16776d" stroke="#ccd9d1" stroke-width="1.5"/><text x="45" y="74" font-size="17" font-weight="normal" text-anchor="middle" fill="white">1</text><rect x="75" y="52" width="43" height="31" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><rect x="126" y="52" width="43" height="31" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><rect x="177" y="52" width="43" height="31" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><rect x="228" y="52" width="43" height="31" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><rect x="279" y="52" width="43" height="31" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><text x="175" y="111" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">完整总率 1 = 可见 1 + 不可见 0</text><text x="22" y="155" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">完整事件</text><path d="M25 185L325 185" fill="none" stroke="#ccd9d1" stroke-width="2"/><circle cx="71.875" cy="185" r="6" fill="#65756e" stroke="#65756e" stroke-width="2"/><text x="71.875" y="208" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">0.25</text><circle cx="156.25" cy="185" r="6" fill="#65756e" stroke="#65756e" stroke-width="2"/><text x="156.25" y="208" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">0.7</text><circle cx="287.5" cy="185" r="6" fill="white" stroke="#16776d" stroke-width="2"/><text x="287.5" y="208" font-size="14" font-weight="normal" text-anchor="middle" fill="#16776d">1.4</text><text x="25" y="208" font-size="14" font-weight="normal" text-anchor="start" fill="#65756e">0</text><text x="325" y="208" font-size="14" font-weight="normal" text-anchor="start" fill="#65756e">t</text><text x="22" y="235" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">限制事件</text><path d="M25 265L325 265" fill="none" stroke="#ccd9d1" stroke-width="2"/><circle cx="287.5" cy="265" r="6" fill="white" stroke="#16776d" stroke-width="2"/><text x="287.5" y="288" font-size="14" font-weight="normal" text-anchor="middle" fill="#16776d">1.4</text><text x="25" y="288" font-size="14" font-weight="normal" text-anchor="start" fill="#65756e">0</text><text x="325" y="288" font-size="14" font-weight="normal" text-anchor="start" fill="#65756e">t</text><text x="175" y="326" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">隐藏事件，不能删掉经过的时间</text></svg><text x="30" y="472.7142857142857" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">若只保留前2人：可见合并率仍为1；前两次事件不改变限制。</text><path d="M30 504.7142857142857L870 504.7142857142857" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="534.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">每对当前完整块的Kingman合并率为1，不按块质量加权。四人路径示意依次合并{3}+{4}、{1}+{3,4}、</text><text x="30" y="558.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">{1,3,4}+{2}；灰色人不在保留样本[n]中。每个可见块对应唯一完整块，因此当前可见块对的速率仍各为1，</text><text x="30" y="582.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">含空投影块的合并不改变限制。图上速率条每格为一对的速率1，不是概率质量。两条时间轴共用原时间，示</text><text x="30" y="606.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">意事件时刻0.25、0.7、1.4不因隐藏事件而压缩；这些时刻是一条说明性路径，不是等待时间期望。有限生</text><text x="30" y="630.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">成矩阵满足L₄(f∘rₙ)=(Lₙf)∘rₙ，逐幂再求指数级数给半群一致性，条件期望塔式再给限制过程的</text><text x="30" y="654.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Markov性。不能只匹配边缘或块数就宣布路径一致，也不从无穷总率安装一个首跳时钟。</text></svg>