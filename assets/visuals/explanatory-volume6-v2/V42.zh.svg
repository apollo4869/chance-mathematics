>δ0=0</text><text x="15" y="87" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">1</text><circle cx="91" cy="81" r="14" fill="white" stroke="#65756e" stroke-width="2"/><text x="91" y="87" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">a</text><path d="M91 96L91 105" fill="none" stroke="#16776d" stroke-width="2"/><text x="134" y="106" font-size="16" font-weight="normal" text-anchor="start" fill="#16776d">δ1=1</text><text x="15" y="126" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">2</text><circle cx="91" cy="120" r="14" fill="white" stroke="#16776d" stroke-width="2"/><text x="91" y="126" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">b</text><path d="M91 135L91 144" fill="none" stroke="#ccd9d1" stroke-width="2"/><text x="134" y="145" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">δ2=0</text><text x="15" y="165" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">3</text><circle cx="91" cy="159" r="14" fill="white" stroke="#65756e" stroke-width="2"/><text x="91" y="165" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">b</text><path d="M91 174L91 183" fill="none" stroke="#ccd9d1" stroke-width="2"/><text x="134" y="184" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">δ3=0</text><text x="15" y="204" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">4</text><circle cx="91" cy="198" r="14" fill="white" stroke="#65756e" stroke-width="2"/><text x="91" y="204" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">b</text><path d="M91 213L91 222" fill="none" stroke="#16776d" stroke-width="2"/><text x="134" y="223" font-size="16" font-weight="normal" text-anchor="start" fill="#16776d">δ4=1</text><text x="15" y="243" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">5</text><circle cx="91" cy="237" r="14" fill="white" stroke="#16776d" stroke-width="2"/><text x="91" y="243" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">a</text><path d="M91 252L91 261" fill="none" stroke="#ccd9d1" stroke-width="2"/><text x="134" y="262" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">δ5=0</text><text x="15" y="282" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">6</text><circle cx="91" cy="276" r="14" fill="white" stroke="#65756e" stroke-width="2"/><text x="91" y="282" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">a</text><path d="M91 291L91 300" fill="none" stroke="#ccd9d1" stroke-width="2"/><text x="134" y="301" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">δ6=0</text><text x="15" y="321" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">7</text><circle cx="91" cy="315" r="14" fill="white" stroke="#65756e" stroke-width="2"/><text x="91" y="321" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">a</text><path d="M91 330L91 339" fill="none" stroke="#16776d" stroke-width="2"/><text x="134" y="340" font-size="16" font-weight="normal" text-anchor="start" fill="#16776d">δ7=1</text><text x="15" y="360" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">8</text><circle cx="91" cy="354" r="14" fill="white" stroke="#16776d" stroke-width="2"/><text x="91" y="360" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">b</text><text x="175" y="406" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">右端点属于下一周期</text></svg><text x="30" y="581.9142857142857" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">成功在n；重启在n+1。两段共用的端点只归下一段。</text><path d="M30 613.9142857142857L870 613.9142857142857" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="643.9142857142857" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">精确有限模型：E=C={a,b}，ε=1/2，ν=(δa+δb)/2，Rₓ=δₓ。因此P的两行为(3/4,1/4)、(1/4,3/4)。</text><text x="30" y="667.9142857142857" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">先抽独立硬币δₙ，再按ν或Rₓ抽Xₙ₊₁，不能在看完下一状态后补一枚未经校正的独立硬币。图示三次</text><text x="30" y="691.9142857142857" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">成功发生在n=r、4、7，重启端点为r+1、5、8；所示记录是一个合法的正概率有限配置，不是模拟频率。ν</text><text x="30" y="715.9142857142857" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">终点独立于此前信息；从ν开始的半开周期标记(L,X₀,…,X_{L−1})为iid，右端点属于下一周期，初始延</text><text x="30" y="739.9142857142857" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">迟另计。这里L~Geom(1/2)取值1,2,…且均值2；一般小集还需返回条件，有限周期不自动有有限均值，再生</text><text x="30" y="763.9142857142857" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">也不自动给同刻耦合。</text></svg>