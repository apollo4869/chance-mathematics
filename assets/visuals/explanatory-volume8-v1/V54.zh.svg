<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100" role="img" aria-label="树没有变，抽样质量变了"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><text x="450.0" y="23" font-size="20" font-weight="bold" text-anchor="middle" fill="#173f39">树没有变，抽样质量变了</text><svg x="25.0" y="55" width="850" height="425" viewBox="0 0 850 425"><text x="425.0" y="23" font-size="20" font-weight="bold" text-anchor="middle" fill="#173f39">同一条长1的树，时间分配可以改变</text><rect x="35.0" y="105" width="195.0" height="45" fill="#16776d"/><rect x="230.0" y="105" width="195.0" height="45" fill="#16776d"/><text x="35" y="91" font-size="18" font-weight="normal" text-anchor="start" fill="#65756e">U ~ Unif[0,1]</text><text x="35" y="177" font-size="14" font-weight="normal" text-anchor="start" fill="#65756e">0</text><text x="425" y="177" font-size="14" font-weight="normal" text-anchor="end" fill="#65756e">1</text><path d="M230.0 198L230.0 153" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M233.47972427288985 160.2035768188214L230.0 153" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M226.52027572711015 160.2035768188214L230.0 153" fill="none" stroke="#a45b30" stroke-width="2"/><text x="230.0" y="231" font-size="20" font-weight="normal" text-anchor="middle" fill="#a45b30">U = 1/2</text><text x="230.0" y="262" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">顶端停顿时间 a = 0</text><rect x="629.0" y="90" width="42.0" height="220" fill="#c8ded3"/><path d="M650 90L650 310" fill="none" stroke="#173f39" stroke-width="2"/><circle cx="650" cy="90" r="4" fill="white" stroke="#173f39" stroke-width="2"/><circle cx="650" cy="310" r="6" fill="white" stroke="#173f39" stroke-width="2"/><text x="692" y="98" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">1</text><text x="692" y="316" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">ρ = 0</text><circle cx="650" cy="90.0" r="7" fill="white" stroke="#16776d" stroke-width="2"/><text x="622" y="95.0" font-size="16" font-weight="normal" text-anchor="end" fill="#16776d">p(U)</text><text x="650" y="349" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">几何长度恒为1</text><rect x="40" y="340" width="0.0" height="20" fill="#a45b30"/><rect x="40.0" y="340" width="360.0" height="20" fill="#eaf2ee"/><rect x="40" y="340" width="360" height="20" fill="none" stroke="#ccd9d1" stroke-width="1.5"/><text x="40" y="328" font-size="18" font-weight="normal" text-anchor="start" fill="#a45b30">顶端原子质量 0</text><text x="425.0" y="413" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">细线是距离；宽带与圆面积是质量</text></svg><svg x="25.0" y="505" width="850" height="425" viewBox="0 0 850 425"><text x="425.0" y="23" font-size="20" font-weight="bold" text-anchor="middle" fill="#173f39">同一条长1的树，时间分配可以改变</text><rect x="35.0" y="105" width="97.5" height="45" fill="#16776d"/><rect x="132.5" y="105" width="195.0" height="45" fill="#a45b30"/><rect x="327.5" y="105" width="97.5" height="45" fill="#16776d"/><text x="35" y="91" font-size="18" font-weight="normal" text-anchor="start" fill="#65756e">U ~ Unif[0,1]</text><text x="35" y="177" font-size="14" font-weight="normal" text-anchor="start" fill="#65756e">0</text><text x="425" y="177" font-size="14" font-weight="normal" text-anchor="end" fill="#65756e">1</text><path d="M230.0 198L230.0 153" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M233.47972427288985 160.2035768188214L230.0 153" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M226.52027572711015 160.2035768188214L230.0 153" fill="none" stroke="#a45b30" stroke-width="2"/><text x="230.0" y="231" font-size="20" font-weight="normal" text-anchor="middle" fill="#a45b30">U = 1/2</text><text x="230.0" y="262" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">顶端停顿时间 a = 1/2</text><rect x="639.5" y="90" width="21.0" height="220" fill="#c8ded3"/><path d="M650 90L650 310" fill="none" stroke="#173f39" stroke-width="2"/><circle cx="650" cy="90" r="20.50609665440988" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><circle cx="650" cy="310" r="6" fill="white" stroke="#173f39" stroke-width="2"/><text x="692" y="98" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">1</text><text x="692" y="316" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">ρ = 0</text><circle cx="650" cy="90.0" r="7" fill="white" stroke="#16776d" stroke-width="2"/><text x="622" y="95.0" font-size="16" font-weight="normal" text-anchor="end" fill="#16776d">p(U)</text><text x="650" y="349" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">几何长度恒为1</text><rect x="40" y="340" width="180.0" height="20" fill="#a45b30"/><rect x="220.0" y="340" width="180.0" height="20" fill="#eaf2ee"/><rect x="40" y="340" width="360" height="20" fill="none" stroke="#ccd9d1" stroke-width="1.5"/><text x="40" y="328" font-size="18" font-weight="normal" text-anchor="start" fill="#a45b30">顶端原子质量 1/2</text><text x="425.0" y="413" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">细线是距离；宽带与圆面积是质量</text></svg><text x="25" y="977" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">确定性编码hₐ从0线性上升到1，在1停留a，再线性回0；上升、下降各用(1−a)/2时间，a∈{0,1/4,1/2}。</text><text x="25" y="1002" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">商树始终保根等距于[0,1]，但均匀时间的推前为μₐ=(1−a)Unif[0,1]+aδ₁。几何细线不变，宽带只表示</text><text x="25" y="1027" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">连续质量密度，顶端圆面积表示原子质量。U滑块指定一次示意输入，U不是树上位置。一般连续编码允许原</text><text x="25" y="1052" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">子；这不是Brownian样本，Brownian CRT的无原子性仍依正文定理。</text></svg>