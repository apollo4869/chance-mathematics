<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1175" width="900" height="1175" role="img" aria-label="The tree stays; its sampling mass changes"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><text x="450.0" y="23" font-size="20" font-weight="bold" text-anchor="middle" fill="#173f39">The tree stays; its sampling mass changes</text><svg x="25.0" y="55" width="850" height="425" viewBox="0 0 850 425"><text x="425.0" y="23" font-size="20" font-weight="bold" text-anchor="middle" fill="#173f39">One unit tree, different time allocations</text><rect x="35.0" y="105" width="195.0" height="45" fill="#16776d"/><rect x="230.0" y="105" width="195.0" height="45" fill="#16776d"/><text x="35" y="91" font-size="18" font-weight="normal" text-anchor="start" fill="#65756e">U ~ Unif[0,1]</text><text x="35" y="177" font-size="14" font-weight="normal" text-anchor="start" fill="#65756e">0</text><text x="425" y="177" font-size="14" font-weight="normal" text-anchor="end" fill="#65756e">1</text><path d="M230.0 198L230.0 153" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M233.47972427288985 160.2035768188214L230.0 153" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M226.52027572711015 160.2035768188214L230.0 153" fill="none" stroke="#a45b30" stroke-width="2"/><text x="230.0" y="231" font-size="20" font-weight="normal" text-anchor="middle" fill="#a45b30">U = 1/2</text><text x="230.0" y="262" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">Top pause a = 0</text><rect x="629.0" y="90" width="42.0" height="220" fill="#c8ded3"/><path d="M650 90L650 310" fill="none" stroke="#173f39" stroke-width="2"/><circle cx="650" cy="90" r="4" fill="white" stroke="#173f39" stroke-width="2"/><circle cx="650" cy="310" r="6" fill="white" stroke="#173f39" stroke-width="2"/><text x="692" y="98" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">1</text><text x="692" y="316" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">ρ = 0</text><circle cx="650" cy="90.0" r="7" fill="white" stroke="#16776d" stroke-width="2"/><text x="622" y="95.0" font-size="16" font-weight="normal" text-anchor="end" fill="#16776d">p(U)</text><text x="650" y="349" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">Geometric length stays 1</text><rect x="40" y="340" width="0.0" height="20" fill="#a45b30"/><rect x="40.0" y="340" width="360.0" height="20" fill="#eaf2ee"/><rect x="40" y="340" width="360" height="20" fill="none" stroke="#ccd9d1" stroke-width="1.5"/><text x="40" y="328" font-size="18" font-weight="normal" text-anchor="start" fill="#a45b30">Top atom mass 0</text><text x="425.0" y="413" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">Thin line: geometry; band and disk: mass</text></svg><svg x="25.0" y="505" width="850" height="425" viewBox="0 0 850 425"><text x="425.0" y="23" font-size="20" font-weight="bold" text-anchor="middle" fill="#173f39">One unit tree, different time allocations</text><rect x="35.0" y="105" width="97.5" height="45" fill="#16776d"/><rect x="132.5" y="105" width="195.0" height="45" fill="#a45b30"/><rect x="327.5" y="105" width="97.5" height="45" fill="#16776d"/><text x="35" y="91" font-size="18" font-weight="normal" text-anchor="start" fill="#65756e">U ~ Unif[0,1]</text><text x="35" y="177" font-size="14" font-weight="normal" text-anchor="start" fill="#65756e">0</text><text x="425" y="177" font-size="14" font-weight="normal" text-anchor="end" fill="#65756e">1</text><path d="M230.0 198L230.0 153" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M233.47972427288985 160.2035768188214L230.0 153" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M226.52027572711015 160.2035768188214L230.0 153" fill="none" stroke="#a45b30" stroke-width="2"/><text x="230.0" y="231" font-size="20" font-weight="normal" text-anchor="middle" fill="#a45b30">U = 1/2</text><text x="230.0" y="262" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">Top pause a = 1/2</text><rect x="639.5" y="90" width="21.0" height="220" fill="#c8ded3"/><path d="M650 90L650 310" fill="none" stroke="#173f39" stroke-width="2"/><circle cx="650" cy="90" r="20.50609665440988" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><circle cx="650" cy="310" r="6" fill="white" stroke="#173f39" stroke-width="2"/><text x="692" y="98" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">1</text><text x="692" y="316" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">ρ = 0</text><circle cx="650" cy="90.0" r="7" fill="white" stroke="#16776d" stroke-width="2"/><text x="622" y="95.0" font-size="16" font-weight="normal" text-anchor="end" fill="#16776d">p(U)</text><text x="650" y="349" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">Geometric length stays 1</text><rect x="40" y="340" width="180.0" height="20" fill="#a45b30"/><rect x="220.0" y="340" width="180.0" height="20" fill="#eaf2ee"/><rect x="40" y="340" width="360" height="20" fill="none" stroke="#ccd9d1" stroke-width="1.5"/><text x="40" y="328" font-size="18" font-weight="normal" text-anchor="start" fill="#a45b30">Top atom mass 1/2</text><text x="425.0" y="413" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">Thin line: geometry; band and disk: mass</text></svg><text x="25" y="977" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">The deterministic code rises linearly from 0 to 1, pauses for a, then returns</text><text x="25" y="1002" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">linearly to 0, with a in {0,1/4,1/2}. Each sloping part lasts (1-a)/2. Its</text><text x="25" y="1027" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">rooted quotient tree is always [0,1], but uniform time pushes forward to</text><text x="25" y="1052" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">(1-a)Unif[0,1]+a delta_1. The thin line is geometry; band width is diffuse mass</text><text x="25" y="1077" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">density; the top disk area is atomic mass. The slider chooses an illustrative U,</text><text x="25" y="1102" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">not a new probability law. This is not a Brownian sample; atomlessness of</text><text x="25" y="1127" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">Brownian CRT mass is a separate theorem.</text></svg>