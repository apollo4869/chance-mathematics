<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 735" width="360" height="735" role="img" aria-label="树没有变，抽样质量变了"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><text x="180.0" y="23" font-size="17" font-weight="bold" text-anchor="middle" fill="#173f39">同一条长1的树，时间分配可以改变</text><rect x="25.0" y="98" width="116.25" height="45" fill="#16776d"/><rect x="141.25" y="98" width="77.5" height="45" fill="#a45b30"/><rect x="218.75" y="98" width="116.25" height="45" fill="#16776d"/><text x="25" y="84" font-size="18" font-weight="normal" text-anchor="start" fill="#65756e">U ~ Unif[0,1]</text><text x="25" y="170" font-size="14" font-weight="normal" text-anchor="start" fill="#65756e">0</text><text x="335" y="170" font-size="14" font-weight="normal" text-anchor="end" fill="#65756e">1</text><path d="M257.5 191L257.5 146" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M260.9797242728898 153.2035768188214L257.5 146" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M254.02027572711015 153.2035768188214L257.5 146" fill="none" stroke="#a45b30" stroke-width="2"/><text x="180.0" y="224" font-size="20" font-weight="normal" text-anchor="middle" fill="#a45b30">U = 3/4</text><text x="180.0" y="255" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">顶端停顿时间 a = 1/4</text><rect x="164.25" y="346" width="31.5" height="238" fill="#c8ded3"/><path d="M180 346L180 584" fill="none" stroke="#173f39" stroke-width="2"/><circle cx="180" cy="346" r="14.5" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><circle cx="180" cy="584" r="6" fill="white" stroke="#173f39" stroke-width="2"/><text x="222" y="354" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">1</text><text x="222" y="590" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">ρ = 0</text><circle cx="180" cy="425.33333333333337" r="7" fill="white" stroke="#16776d" stroke-width="2"/><text x="152" y="430.33333333333337" font-size="16" font-weight="normal" text-anchor="end" fill="#16776d">p(U)</text><text x="180" y="623" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">几何长度恒为1</text><rect x="40" y="651" width="70.0" height="20" fill="#a45b30"/><rect x="110.0" y="651" width="210.0" height="20" fill="#eaf2ee"/><rect x="40" y="651" width="280" height="20" fill="none" stroke="#ccd9d1" stroke-width="1.5"/><text x="40" y="639" font-size="18" font-weight="normal" text-anchor="start" fill="#a45b30">顶端原子质量 1/4</text><text x="180.0" y="723" font-size="13" font-weight="normal" text-anchor="middle" fill="#65756e">细线是距离；宽带与圆面积是质量</text></svg>