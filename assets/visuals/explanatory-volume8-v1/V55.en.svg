ray="4 4"/><text x="212.5" y="340" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">Shape</text><text x="212.5" y="375" font-size="27" font-weight="bold" text-anchor="middle" fill="#a45b30">1</text><text x="425.0" y="340" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">Root</text><text x="425.0" y="375" font-size="27" font-weight="bold" text-anchor="middle" fill="#16776d">0</text><text x="637.5" y="340" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">Mass</text><text x="637.5" y="375" font-size="27" font-weight="bold" text-anchor="middle" fill="#16776d">0</text><text x="425.0" y="398" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">Errors in this common placement</text></svg><svg x="25.0" y="925" width="850" height="410" viewBox="0 0 850 410"><text x="425.0" y="23" font-size="20" font-weight="bold" text-anchor="middle" fill="#173f39">One joint compromise</text><text x="35" y="101" font-size="24" font-weight="bold" text-anchor="start" fill="#173f39">X</text><path d="M285.0 135L705.0 135" fill="none" stroke="#173f39" stroke-width="3"/><path d="M285.0 126L285.0 144" fill="none" stroke="#65756e" stroke-width="1"/><text x="285.0" y="168" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">-1</text><path d="M705.0 126L705.0 144" fill="none" stroke="#65756e" stroke-width="1"/><text x="705.0" y="168" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">2</text><circle cx="425.0" cy="135" r="6" fill="white" stroke="#16776d" stroke-width="2"/><text x="425.0" y="119" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">ρ</text><circle cx="565.0" cy="135" r="15" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><text x="565.0" y="141" font-size="17" font-weight="normal" text-anchor="middle" fill="white">1</text><text x="565.0" y="109" font-size="14" font-weight="normal" text-anchor="middle" fill="#a45b30">all mass</text><text x="35" y="231" font-size="24" font-weight="bold" text-anchor="start" fill="#173f39">Y</text><path d="M215.0 265L635.0 265" fill="none" stroke="#173f39" stroke-width="3"/><path d="M215.0 256L215.0 274" fill="none" stroke="#65756e" stroke-width="1"/><text x="215.0" y="298" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">-3/2</text><path d="M635.0 256L635.0 274" fill="none" stroke="#65756e" stroke-width="1"/><text x="635.0" y="298" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">3/2</text><circle cx="495.0" cy="265" r="6" fill="white" stroke="#16776d" stroke-width="2"/><text x="495.0" y="249" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">ρ</text><circle cx="635.0" cy="265" r="15" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><text x="635.0" y="271" font-size="17" font-weight="normal" text-anchor="middle" fill="white">1</text><text x="635.0" y="239" font-size="14" font-weight="normal" text-anchor="middle" fill="#a45b30">all mass</text><path d="M425.0 143L495.0 257" fill="none" stroke="#16776d" stroke-width="1" stroke-dasharray="4 4"/><path d="M565.0 152L635.0 248" fill="none" stroke="#a45b30" stroke-width="1" stroke-dasharray="4 4"/><text x="212.5" y="340" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">Shape</text><text x="212.5" y="375" font-size="27" font-weight="bold" text-anchor="middle" fill="#a45b30">1/2</text><text x="425.0" y="340" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">Root</text><text x="425.0" y="375" font-size="27" font-weight="bold" text-anchor="middle" fill="#a45b30">1/2</text><text x="637.5" y="340" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">Mass</text><text x="637.5" y="375" font-size="27" font-weight="bold" text-anchor="middle" fill="#a45b30">1/2</text><text x="425.0" y="398" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">Errors in this common placement</text></svg><text x="25" y="1382" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">X=Y=[-1,2], with root 0 and masses delta_1 and delta_-1. Three isometric</text><text x="25" y="1407" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">placements of Y are identity, reflection, and reflection followed by translation</text><text x="25" y="1432" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">by 1/2. Their current (Hausdorff,root,Prokhorov) errors are (0,0,1), (1,0,0),</text><text x="25" y="1457" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">and (1/2,1/2,1/2). Two Dirac masses separated by 2 have Prokhorov distance 1 in</text><text x="25" y="1482" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">the probability convention. Separately rGH=rGP=0, but rGHP=1/2: eccentricities</text><text x="25" y="1507" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">of the mass points are 2 and 3, so any common witness with error r&lt;1 requires</text><text x="25" y="1532" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">3&lt;=2+2r. The third placement attains the bound. These are explicit witnesses for</text><text x="25" y="1557" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">this interval example, not a general embedding algorithm.</text></svg>