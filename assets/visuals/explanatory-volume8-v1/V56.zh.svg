or="middle" fill="#65756e">上列数值是分离率；候选事件率均为1</text></svg><text x="25" y="1267" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">只比较一块的有限样本生成机制，候选分裂事件率均为1。按样本数尽量均分时，两人必分开，三人有三种等</text><text x="25" y="1292" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">概率单人侧，指定两人仅以2/3分开。正确对照为各标签独立投公平位：二人及三人投影的指定对分离概率都</text><text x="25" y="1317" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">为1/2；八份三位输入等概率，000和111不是有效分裂。图中删除3只删除观察，不重抽1、2的颜色。所列速</text><text x="25" y="1342" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">率=事件率×可见分离概率；不是单凭图片证明一般无限碎裂。每块未来独立、可测构造及可积条件仍依正文</text><text x="25" y="1367" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">。</text></svg>