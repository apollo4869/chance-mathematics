ight="normal" text-anchor="end" fill="#16776d">p(U)</text><text x="650" y="349" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">几何长度恒为1</text><rect x="40" y="340" width="90.0" height="20" fill="#a45b30"/><rect x="130.0" y="340" width="270.0" height="20" fill="#eaf2ee"/><rect x="40" y="340" width="360" height="20" fill="none" stroke="#ccd9d1" stroke-width="1.5"/><text x="40" y="328" font-size="18" font-weight="normal" text-anchor="start" fill="#a45b30">顶端原子质量 1/4</text><text x="425.0" y="413" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">细线是距离；宽带与圆面积是质量</text></svg>