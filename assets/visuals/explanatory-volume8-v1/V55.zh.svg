ke-width="3"/><path d="M215.0 256L215.0 274" fill="none" stroke="#65756e" stroke-width="1"/><text x="215.0" y="298" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">-3/2</text><path d="M635.0 256L635.0 274" fill="none" stroke="#65756e" stroke-width="1"/><text x="635.0" y="298" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">3/2</text><circle cx="495.0" cy="265" r="6" fill="white" stroke="#16776d" stroke-width="2"/><text x="495.0" y="249" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">ρ</text><circle cx="635.0" cy="265" r="15" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><text x="635.0" y="271" font-size="17" font-weight="normal" text-anchor="middle" fill="white">1</text><text x="635.0" y="239" font-size="14" font-weight="normal" text-anchor="middle" fill="#a45b30">全部质量</text><path d="M425.0 143L495.0 257" fill="none" stroke="#16776d" stroke-width="1" stroke-dasharray="4 4"/><path d="M565.0 152L635.0 248" fill="none" stroke="#a45b30" stroke-width="1" stroke-dasharray="4 4"/><text x="212.5" y="340" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">全空间</text><text x="212.5" y="375" font-size="27" font-weight="bold" text-anchor="middle" fill="#a45b30">1/2</text><text x="425.0" y="340" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">根</text><text x="425.0" y="375" font-size="27" font-weight="bold" text-anchor="middle" fill="#a45b30">1/2</text><text x="637.5" y="340" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">质量</text><text x="637.5" y="375" font-size="27" font-weight="bold" text-anchor="middle" fill="#a45b30">1/2</text><text x="425.0" y="398" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">这是当前共同摆放的三项误差</text></svg><text x="25" y="1382" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">X=Y=[−1,2]，两根均为0，μX=δ₁、μY=δ₋₁。图示三种等距嵌入：恒等、反射、反射再平移1/2；只改</text><text x="25" y="1407" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">变共同背景中的位置，不改变内部距离。当前见证的(Hausdorff,根,Prokhorov)误差依次为(0,0,1)、</text><text x="25" y="1432" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">(1,0,0)、(1/2,1/2,1/2)。dP采用概率测度规范，距离2的两原子dP=1。分别优化可给rGH=rGP=0，rGHP却为</text><text x="25" y="1457" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">1/2：两质量点在各自全空间中的最远距离是2与3，任一误差r&lt;1的共同见证必须有3≤2+2r；第三种摆放取到</text><text x="25" y="1482" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">上界。这是正文区间反例的有限几何计算，不将某种摆放当作一般最优嵌入。</text></svg>