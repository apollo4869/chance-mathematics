<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1260" width="900" height="1260" role="img" aria-label="Length decides where a new branch attaches"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><text x="450.0" y="23" font-size="20" font-weight="bold" text-anchor="middle" fill="#173f39">Length decides where a new branch attaches</text><svg x="25.0" y="55" width="850" height="455" viewBox="0 0 850 455"><text x="425.0" y="23" font-size="20" font-weight="bold" text-anchor="middle" fill="#173f39">Locate U along accumulated length</text><svg x="20" y="50" width="360" height="390" viewBox="0 0 360 390"><path d="M180 320L180 250" fill="none" stroke="#16776d" stroke-width="3"/><text x="167.0" y="285.0" font-size="16" font-weight="normal" text-anchor="end" fill="#16776d">1/2</text><path d="M180 250L96 138" fill="none" stroke="#496c8e" stroke-width="3"/><text x="125.0" y="194.0" font-size="16" font-weight="normal" text-anchor="end" fill="#496c8e">1</text><path d="M180 250L236 208" fill="none" stroke="#70846c" stroke-width="3"/><text x="195.0" y="229.0" font-size="16" font-weight="normal" text-anchor="end" fill="#70846c">1/2</text><circle cx="138.0" cy="194.0" r="6" fill="white" stroke="#a45b30" stroke-width="2"/><circle cx="180" cy="320" r="4" fill="white" stroke="#173f39" stroke-width="2"/><text x="192" y="324" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">ρ</text><circle cx="180" cy="250" r="4" fill="white" stroke="#173f39" stroke-width="2"/><text x="192" y="254" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e"></text><circle cx="96" cy="138" r="4" fill="white" stroke="#173f39" stroke-width="2"/><text x="108" y="142" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">1</text><circle cx="236" cy="208" r="4" fill="white" stroke="#173f39" stroke-width="2"/><text x="248" y="212" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">2</text><text x="180" y="30" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Condition on this metric tree</text><text x="180" y="370" font-size="19" font-weight="normal" text-anchor="middle" fill="#a45b30">New branch b = 0.4495</text></svg><rect x="438" y="105" width="92.5" height="20" fill="#16776d"/><rect x="530.5" y="105" width="185.0" height="20" fill="#496c8e"/><rect x="715.5" y="105" width="92.5" height="20" fill="#70846c"/><rect x="438" y="105" width="370" height="20" fill="none" stroke="#ccd9d1" stroke-width="1.5"/><text x="484.25" y="151" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">1/4</text><text x="623.0" y="151" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">1/2</text><text x="761.75" y="151" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">1/4</text><path d="M623.0 70L623.0 102" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M619.5202757271102 94.79642318117858L623.0 102" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M626.4797242728898 94.79642318117858L623.0 102" fill="none" stroke="#a45b30" stroke-width="2"/><text x="623.0" y="190" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">U = 1/2 · E = 4</text><text x="623.0" y="228" font-size="21" font-weight="normal" text-anchor="middle" fill="#16776d">L: 2 → 2.4495</text><text x="623.0" y="269" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">With known lengths: not 1/3 per edge</text><text x="623.0" y="307" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">Standard e: cumulative intensity 2r²</text><text x="425.0" y="443" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">Length selects attachment; mass needs construction</text></svg><svg x="25.0" y="535" width="850" height="455" viewBox="0 0 850 455"><text x="425.0" y="23" font-size="20" font-weight="bold" text-anchor="middle" fill="#173f39">Locate U along accumulated length</text><svg x="20" y="50" width="360" height="390" viewBox="0 0 360 390"><path d="M180 320L180 250" fill="none" stroke="#16776d" stroke-width="3"/><text x="167.0" y="285.0" font-size="16" font-weight="normal" text-anchor="end" fill="#16776d">1/2</text><path d="M180 250L96 138" fill="none" stroke="#496c8e" stroke-width="3"/><text x="125.0" y="194.0" font-size="16" font-weight="normal" text-anchor="end" fill="#496c8e">1</text><path d="M180 250L236 208" fill="none" stroke="#70846c" stroke-width="3"/><text x="195.0" y="229.0" font-size="16" font-weight="normal" text-anchor="end" fill="#70846c">1/2</text><circle cx="138.0" cy="194.0" r="6" fill="white" stroke="#a45b30" stroke-width="2"/><path d="M138.0 194.0L87.65714880828408 231.75713839378693" fill="none" stroke="#a45b30" stroke-width="3"/><circle cx="87.65714880828408" cy="231.75713839378693" r="6" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><text x="87.65714880828408" y="219.75713839378693" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">3</text><circle cx="180" cy="320" r="4" fill="white" stroke="#173f39" stroke-width="2"/><text x="192" y="324" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">ρ</text><circle cx="180" cy="250" r="4" fill="white" stroke="#173f39" stroke-width="2"/><text x="192" y="254" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e"></text><circle cx="96" cy="138" r="4" fill="white" stroke="#173f39" stroke-width="2"/><text x="108" y="142" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">1</text><circle cx="236" cy="208" r="4" fill="white" stroke="#173f39" stroke-width="2"/><text x="248" y="212" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">2</text><text x="180" y="30" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Old distances stay</text><text x="180" y="370" font-size="19" font-weight="normal" text-anchor="middle" fill="#a45b30">New branch b = 0.4495</text></svg><rect x="438" y="105" width="92.5" height="20" fill="#16776d"/><rect x="530.5" y="105" width="185.0" height="20" fill="#496c8e"/><rect x="715.5" y="105" width="92.5" height="20" fill="#70846c"/><rect x="438" y="105" width="370" height="20" fill="none" stroke="#ccd9d1" stroke-width="1.5"/><text x="484.25" y="151" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">1/4</text><text x="623.0" y="151" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">1/2</text><text x="761.75" y="151" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">1/4</text><path d="M623.0 70L623.0 102" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M619.5202757271102 94.79642318117858L623.0 102" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M626.4797242728898 94.79642318117858L623.0 102" fill="none" stroke="#a45b30" stroke-width="2"/><text x="623.0" y="190" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">U = 1/2 · E = 4</text><text x="623.0" y="228" font-size="21" font-weight="normal" text-anchor="middle" fill="#16776d">L: 2 → 2.4495</text><text x="623.0" y="269" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">With known lengths: not 1/3 per edge</text><text x="623.0" y="307" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">Standard e: cumulative intensity 2r²</text><text x="425.0" y="443" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">Length selects attachment; mass needs construction</text></svg><text x="25" y="1037" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">Condition on a two-leaf metric tree with edge lengths 1/2,1,1/2 and total s=2. A</text><text x="25" y="1062" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">length-uniform attachment selects edges with probabilities 1/4,1/2,1/4, not 1/3</text><text x="25" y="1087" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">when those lengths are known. Independent illustrative inputs U,E give arclength</text><text x="25" y="1112" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">sU, new total L=sqrt(s²+E/2), and branch length L-s. With E exponential of rate</text><text x="25" y="1137" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">1 this is the standard-e clock 4r dr; buttons merely specify inputs. Grafting</text><text x="25" y="1162" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">preserves old distances. Empirical birth-leaf mass is not normalized skeleton</text><text x="25" y="1187" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">length; finite grafting does not prove infinite compactness or existence of</text><text x="25" y="1212" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">mass. Aldous uses r dr and the 2e scale, so lengths are halved here.</text></svg>