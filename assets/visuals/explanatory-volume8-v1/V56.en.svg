<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1515" width="900" height="1515" role="img" aria-label="Hiding a third label must preserve the pair law"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><text x="450.0" y="23" font-size="20" font-weight="bold" text-anchor="middle" fill="#173f39">Hiding a third label must preserve the pair law</text><svg x="25.0" y="55" width="850" height="570" viewBox="0 0 850 570"><text x="425.0" y="23" font-size="20" font-weight="bold" text-anchor="middle" fill="#173f39">Balance the sample</text><svg x="30" y="55" width="350" height="245" viewBox="0 0 350 245"><text x="175" y="22" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">One three-label observation</text><rect x="28" y="65" width="120" height="128" fill="#eaf2ee" stroke="#ccd9d1" stroke-width="1.5"/><circle cx="88" cy="90" r="13" fill="white" stroke="#16776d" stroke-width="2"/><text x="88" y="95" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">1</text><circle cx="88" cy="127" r="13" fill="white" stroke="#16776d" stroke-width="2"/><text x="88" y="132" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">2</text><rect x="202" y="65" width="120" height="128" fill="#f6eadd" stroke="#ccd9d1" stroke-width="1.5"/><circle cx="262" cy="90" r="13" fill="white" stroke="#a45b30" stroke-width="2"/><text x="262" y="95" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">3</text><text x="175" y="233" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">1 and 2 stay together</text></svg><svg x="465" y="55" width="350" height="245" viewBox="0 0 350 245"><text x="175" y="22" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">Hide 3; keep 1 and 2</text><rect x="28" y="65" width="120" height="128" fill="#eaf2ee" stroke="#ccd9d1" stroke-width="1.5"/><circle cx="88" cy="90" r="13" fill="white" stroke="#16776d" stroke-width="2"/><text x="88" y="95" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">1</text><circle cx="88" cy="127" r="13" fill="white" stroke="#16776d" stroke-width="2"/><text x="88" y="132" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">2</text><rect x="202" y="65" width="120" height="128" fill="#f6eadd" stroke="#ccd9d1" stroke-width="1.5"/><circle cx="262" cy="90" r="13" fill="white" stroke="#ccd9d1" stroke-width="2"/><text x="262" y="95" font-size="17" font-weight="normal" text-anchor="middle" fill="#ccd9d1">3</text><path d="M245 73L279 107" fill="none" stroke="#65756e" stroke-width="1"/><text x="175" y="233" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">1 and 2 stay together</text></svg><path d="M390 170L445 170" fill="none" stroke="#65756e" stroke-width="2"/><path d="M437.79642318117857 173.47972427288985L445 170" fill="none" stroke="#65756e" stroke-width="2"/><path d="M437.79642318117857 166.52027572711015L445 170" fill="none" stroke="#65756e" stroke-width="2"/><text x="425.0" y="321" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">All equiprobable inputs</text><rect x="288.0" y="345" width="86" height="44" fill="#eaf2ee" stroke="#ccd9d1" stroke-width="1.5"/><circle cx="302.0" cy="366" r="7" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><circle cx="325.0" cy="366" r="7" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="348.0" cy="366" r="7" fill="#16776d" stroke="#16776d" stroke-width="2"/><rect x="382.0" y="345" width="86" height="44" fill="#eaf2ee" stroke="#ccd9d1" stroke-width="1.5"/><circle cx="396.0" cy="366" r="7" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="419.0" cy="366" r="7" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><circle cx="442.0" cy="366" r="7" fill="#16776d" stroke="#16776d" stroke-width="2"/><rect x="476.0" y="345" width="86" height="44" fill="#f6eadd" stroke="#16776d" stroke-width="1.5"/><circle cx="490.0" cy="366" r="7" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="513.0" cy="366" r="7" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="536.0" cy="366" r="7" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><text x="425.0" y="430" font-size="20" font-weight="bold" text-anchor="middle" fill="#a45b30">Direct pair: 1; restricted triple: 2/3</text><text x="425.0" y="558" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">Visible separation rates; raw event rate is 1</text></svg><svg x="25.0" y="650" width="850" height="570" viewBox="0 0 850 570"><text x="425.0" y="23" font-size="20" font-weight="bold" text-anchor="middle" fill="#173f39">Independent fair bits</text><svg x="30" y="55" width="350" height="245" viewBox="0 0 350 245"><text x="175" y="22" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">One three-label observation</text><rect x="28" y="65" width="120" height="128" fill="#eaf2ee" stroke="#ccd9d1" stroke-width="1.5"/><circle cx="88" cy="90" r="13" fill="white" stroke="#16776d" stroke-width="2"/><text x="88" y="95" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">1</text><circle cx="88" cy="127" r="13" fill="white" stroke="#16776d" stroke-width="2"/><text x="88" y="132" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">2</text><rect x="202" y="65" width="120" height="128" fill="#f6eadd" stroke="#ccd9d1" stroke-width="1.5"/><circle cx="262" cy="90" r="13" fill="white" stroke="#a45b30" stroke-width="2"/><text x="262" y="95" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">3</text><text x="175" y="233" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">1 and 2 stay together</text></svg><svg x="465" y="55" width="350" height="245" viewBox="0 0 350 245"><text x="175" y="22" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">Hide 3; keep 1 and 2</text><rect x="28" y="65" width="120" height="128" fill="#eaf2ee" stroke="#ccd9d1" stroke-width="1.5"/><circle cx="88" cy="90" r="13" fill="white" stroke="#16776d" stroke-width="2"/><text x="88" y="95" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">1</text><circle cx="88" cy="127" r="13" fill="white" stroke="#16776d" stroke-width="2"/><text x="88" y="132" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">2</text><rect x="202" y="65" width="120" height="128" fill="#f6eadd" stroke="#ccd9d1" stroke-width="1.5"/><circle cx="262" cy="90" r="13" fill="white" stroke="#ccd9d1" stroke-width="2"/><text x="262" y="95" font-size="17" font-weight="normal" text-anchor="middle" fill="#ccd9d1">3</text><path d="M245 73L279 107" fill="none" stroke="#65756e" stroke-width="1"/><text x="175" y="233" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">1 and 2 stay together</text></svg><path d="M390 170L445 170" fill="none" stroke="#65756e" stroke-width="2"/><path d="M437.79642318117857 173.47972427288985L445 170" fill="none" stroke="#65756e" stroke-width="2"/><path d="M437.79642318117857 166.52027572711015L445 170" fill="none" stroke="#65756e" stroke-width="2"/><text x="425.0" y="321" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">All equiprobable inputs</text><rect x="241.0" y="345" width="86" height="44" fill="#f6eadd" stroke="#ccd9d1" stroke-width="1.5"/><circle cx="255.0" cy="366" r="7" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="278.0" cy="366" r="7" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="301.0" cy="366" r="7" fill="#16776d" stroke="#16776d" stroke-width="2"/><rect x="335.0" y="345" width="86" height="44" fill="#f6eadd" stroke="#16776d" stroke-width="1.5"/><circle cx="349.0" cy="366" r="7" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="372.0" cy="366" r="7" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="395.0" cy="366" r="7" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><rect x="429.0" y="345" width="86" height="44" fill="#eaf2ee" stroke="#ccd9d1" stroke-width="1.5"/><circle cx="443.0" cy="366" r="7" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="466.0" cy="366" r="7" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><circle cx="489.0" cy="366" r="7" fill="#16776d" stroke="#16776d" stroke-width="2"/><rect x="523.0" y="345" width="86" height="44" fill="#eaf2ee" stroke="#ccd9d1" stroke-width="1.5"/><circle cx="537.0" cy="366" r="7" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="560.0" cy="366" r="7" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><circle cx="583.0" cy="366" r="7" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><rect x="241.0" y="403" width="86" height="44" fill="#eaf2ee" stroke="#ccd9d1" stroke-width="1.5"/><circle cx="255.0" cy="424" r="7" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><circle cx="278.0" cy="424" r="7" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="301.0" cy="424" r="7" fill="#16776d" stroke="#16776d" stroke-width="2"/><rect x="335.0" y="403" width="86" height="44" fill="#eaf2ee" stroke="#ccd9d1" stroke-width="1.5"/><circle cx="349.0" cy="424" r="7" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><circle cx="372.0" cy="424" r="7" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="395.0" cy="424" r="7" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><rect x="429.0" y="403" width="86" height="44" fill="#f6eadd" stroke="#ccd9d1" stroke-width="1.5"/><circle cx="443.0" cy="424" r="7" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><circle cx="466.0" cy="424" r="7" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><circle cx="489.0" cy="424" r="7" fill="#16776d" stroke="#16776d" stroke-width="2"/><rect x="523.0" y="403" width="86" height="44" fill="#f6eadd" stroke="#ccd9d1" stroke-width="1.5"/><circle cx="537.0" cy="424" r="7" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><circle cx="560.0" cy="424" r="7" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><circle cx="583.0" cy="424" r="7" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><text x="425.0" y="500" font-size="20" font-weight="bold" text-anchor="middle" fill="#16776d">Direct pair = restricted triple = 1/2</text><text x="425.0" y="558" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">Visible separation rates; raw event rate is 1</text></svg><text x="25" y="1267" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">Only the finite generator of one block is compared, with raw candidate-event</text><text x="25" y="1292" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">rate 1. Balancing the observed sample always separates two labels; among the</text><text x="25" y="1317" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">three equiprobable singleton sides for three labels, a fixed pair separates with</text><text x="25" y="1342" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">probability 2/3. In the independent fair-bit model the pair separates with</text><text x="25" y="1367" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">probability 1/2 both directly and after restricting three labels. The eight bit</text><text x="25" y="1392" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">words are equiprobable; 000 and 111 cause no effective split. Hiding label 3</text><text x="25" y="1417" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">removes an observation, not the colors of labels 1 and 2. Visible rates are raw</text><text x="25" y="1442" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">rate times separation probability. General infinite fragmentation, independent</text><text x="25" y="1467" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">block futures and integrability still require the text.</text></svg>