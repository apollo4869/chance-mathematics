<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1054.142857142857" width="900" height="1054.142857142857" role="img" aria-label="A new table need not mean a new value"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="1054.142857142857" fill="white"/><text x="30" y="44" font-size="26" font-weight="bold" text-anchor="start" fill="#173f39">A new table need not mean a new value</text><text x="30" y="84" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">Seat first, then label each table. Do these operations define the same</text><text x="30" y="108" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">partition?</text><svg x="35" y="129" width="390" height="334.2857142857143" viewBox="0 0 350 300"><circle cx="60" cy="118" r="34" fill="white" stroke="#16776d" stroke-width="2"/><text x="60" y="126" font-size="24" font-weight="normal" text-anchor="middle" fill="#16776d">A</text><circle cx="35" cy="58" r="16" fill="white" stroke="#65756e" stroke-width="2"/><text x="35" y="64" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">1</text><path d="M35 75L60 84" fill="none" stroke="#ccd9d1" stroke-width="1"/><circle cx="85" cy="58" r="16" fill="white" stroke="#65756e" stroke-width="2"/><text x="85" y="64" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">2</text><path d="M85 75L60 84" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="60" y="229" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">Z1 = z</text><circle cx="174" cy="118" r="34" fill="white" stroke="#a45b30" stroke-width="2"/><text x="174" y="126" font-size="24" font-weight="normal" text-anchor="middle" fill="#a45b30">B</text><circle cx="149" cy="58" r="16" fill="white" stroke="#65756e" stroke-width="2"/><text x="149" y="64" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">3</text><path d="M149 75L174 84" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="174" y="229" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">Z2 = z</text><circle cx="288" cy="118" r="34" fill="white" stroke="#6d6697" stroke-width="2"/><text x="288" y="126" font-size="24" font-weight="normal" text-anchor="middle" fill="#6d6697">C</text><circle cx="263" cy="58" r="16" fill="#eaf2ee" stroke="#16776d" stroke-width="2"/><text x="263" y="64" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">4</text><path d="M263 75L288 84" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="288" y="229" font-size="18" font-weight="normal" text-anchor="middle" fill="#6d6697">Z3 = z</text><text x="175" y="282" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">Tables track ancestry; labels give values</text></svg><svg x="475" y="129" width="390" height="334.2857142857143" viewBox="0 0 350 300"><text x="175" y="33" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">Regroup by observed value</text><rect x="30" y="65" width="290" height="46" fill="#eaf2ee" stroke="#ccd9d1" stroke-width="1.5"/><text x="50" y="95" font-size="22" font-weight="normal" text-anchor="start" fill="#16776d">z</text><text x="195" y="95" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">{ 1, 2, 3, 4 }</text><text x="175" y="282" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">Equal labels may merge distinct tables</text></svg><text x="30" y="498.2857142857143" font-size="22" font-weight="normal" text-anchor="start" fill="#a45b30">Comparison state</text><svg x="35" y="513.2857142857142" width="330" height="282.85714285714283" viewBox="0 0 350 300"><circle cx="60" cy="118" r="34" fill="white" stroke="#16776d" stroke-width="2"/><text x="60" y="126" font-size="24" font-weight="normal" text-anchor="middle" fill="#16776d">A</text><circle cx="35" cy="58" r="16" fill="white" stroke="#65756e" stroke-width="2"/><text x="35" y="64" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">1</text><path d="M35 75L60 84" fill="none" stroke="#ccd9d1" stroke-width="1"/><circle cx="85" cy="58" r="16" fill="white" stroke="#65756e" stroke-width="2"/><text x="85" y="64" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">2</text><path d="M85 75L60 84" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="60" y="229" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">Z1 = a</text><circle cx="174" cy="118" r="34" fill="white" stroke="#a45b30" stroke-width="2"/><text x="174" y="126" font-size="24" font-weight="normal" text-anchor="middle" fill="#a45b30">B</text><circle cx="149" cy="58" r="16" fill="white" stroke="#65756e" stroke-width="2"/><text x="149" y="64" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">3</text><path d="M149 75L174 84" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="174" y="229" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">Z2 = b</text><circle cx="288" cy="118" r="34" fill="white" stroke="#6d6697" stroke-width="2"/><text x="288" y="126" font-size="24" font-weight="normal" text-anchor="middle" fill="#6d6697">C</text><circle cx="263" cy="58" r="16" fill="#eaf2ee" stroke="#16776d" stroke-width="2"/><text x="263" y="64" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">4</text><path d="M263 75L288 84" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="288" y="229" font-size="18" font-weight="normal" text-anchor="middle" fill="#6d6697">Z3 = c</text><text x="175" y="282" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">Tables track ancestry; labels give values</text></svg><svg x="475" y="513.2857142857142" width="330" height="282.85714285714283" viewBox="0 0 350 300"><text x="175" y="33" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">Regroup by observed value</text><rect x="30" y="65" width="290" height="46" fill="#eaf2ee" stroke="#ccd9d1" stroke-width="1.5"/><text x="50" y="95" font-size="22" font-weight="normal" text-anchor="start" fill="#16776d">a</text><text x="195" y="95" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">{ 1, 2 }</text><rect x="30" y="123" width="290" height="46" fill="#eaf2ee" stroke="#ccd9d1" stroke-width="1.5"/><text x="50" y="153" font-size="22" font-weight="normal" text-anchor="start" fill="#16776d">b</text><text x="195" y="153" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">{ 3 }</text><rect x="30" y="181" width="290" height="46" fill="#eaf2ee" stroke="#ccd9d1" stroke-width="1.5"/><text x="50" y="211" font-size="22" font-weight="normal" text-anchor="start" fill="#16776d">c</text><text x="195" y="211" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">{ 4 }</text><text x="175" y="282" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">Equal labels may merge distinct tables</text></svg><path d="M30 826.1428571428571L870 826.1428571428571" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="855.1428571428571" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Standard one-parameter CRP with alpha=1. Given A={1,2}, B={3}, customer 4 joins</text><text x="30" y="879.1428571428571" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">A, B or a new table with probabilities 1/2, 1/4, 1/4. Table labels are iid H and</text><text x="30" y="903.1428571428571" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">independent of seating. For H=(delta_z+delta_w)/2, the displayed all-z labels</text><text x="30" y="927.1428571428571" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">form a positive-probability configuration, not an almost-sure outcome. Nonatomic</text><text x="30" y="951.1428571428571" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">H gives distinct labels almost surely. Buttons inspect conditional branches, not</text><text x="30" y="975.1428571428571" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">equiprobable alternatives. Equality of observed values may coarsen the table</text><text x="30" y="999.1428571428571" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">partition. P(1~Pi2)=1/2, whereas this atomic H gives P(X1=X2)=3/4.</text></svg>