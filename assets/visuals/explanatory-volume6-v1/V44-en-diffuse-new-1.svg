<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 300" width="350" height="300" role="img" aria-label="A new table need not mean a new value"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><text x="175" y="33" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">Regroup by observed value</text><rect x="30" y="65" width="290" height="46" fill="#eaf2ee" stroke="#ccd9d1" stroke-width="1.5"/><text x="50" y="95" font-size="22" font-weight="normal" text-anchor="start" fill="#16776d">a</text><text x="195" y="95" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">{ 1, 2 }</text><rect x="30" y="123" width="290" height="46" fill="#eaf2ee" stroke="#ccd9d1" stroke-width="1.5"/><text x="50" y="153" font-size="22" font-weight="normal" text-anchor="start" fill="#16776d">b</text><text x="195" y="153" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">{ 3 }</text><rect x="30" y="181" width="290" height="46" fill="#eaf2ee" stroke="#ccd9d1" stroke-width="1.5"/><text x="50" y="211" font-size="22" font-weight="normal" text-anchor="start" fill="#16776d">c</text><text x="195" y="211" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">{ 4 }</text><text x="175" y="282" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">Equal labels may merge distinct tables</text></svg>