<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1081.5714285714287" width="900" height="1081.5714285714287" role="img" aria-label="Same row laws, different triangles"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="1081.5714285714287" fill="white"/><text x="30" y="44" font-size="26" font-weight="bold" text-anchor="start" fill="#173f39">Same row laws, different triangles</text><text x="30" y="84" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">One row has exactly the same law in two infinite random graphs. Three vertices</text><text x="30" y="108" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">reveal the difference.</text><svg x="35" y="129" width="390" height="323.14285714285717" viewBox="0 0 350 290"><path d="M175 66L60 216" fill="none" stroke="#16776d" stroke-width="4"/><circle cx="117.5" cy="141.0" r="13" fill="white" stroke="white" stroke-width="2"/><text x="117.5" y="147.0" font-size="19" font-weight="normal" text-anchor="middle" fill="#16776d">1</text><path d="M60 216L290 216" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="5 5"/><circle cx="175.0" cy="216.0" r="13" fill="white" stroke="white" stroke-width="2"/><text x="175.0" y="222.0" font-size="19" font-weight="normal" text-anchor="middle" fill="#65756e">0</text><path d="M290 216L175 66" fill="none" stroke="#16776d" stroke-width="4"/><circle cx="232.5" cy="141.0" r="13" fill="white" stroke="white" stroke-width="2"/><text x="232.5" y="147.0" font-size="19" font-weight="normal" text-anchor="middle" fill="#16776d">1</text><circle cx="175" cy="66" r="23" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><text x="175" y="73" font-size="22" font-weight="normal" text-anchor="middle" fill="white">1</text><circle cx="60" cy="216" r="23" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="60" y="223" font-size="22" font-weight="normal" text-anchor="middle" fill="white">2</text><circle cx="290" cy="216" r="23" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="290" y="223" font-size="22" font-weight="normal" text-anchor="middle" fill="white">3</text><text x="175" y="26" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">One color per vertex; connect unlike colors</text><text x="175" y="278" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">X₁₂X₂₃X₃₁ = 101</text></svg><svg x="475" y="129" width="390" height="250.71428571428572" viewBox="0 0 350 225"><text x="175" y="25" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">Eight equiprobable inputs, each 1/8</text><path d="M45 55L22 90" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><path d="M22 90L68 90" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><path d="M68 90L45 55" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><circle cx="45" cy="55" r="3" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><circle cx="22" cy="90" r="3" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><circle cx="68" cy="90" r="3" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><path d="M130 55L107 90" fill="none" stroke="#16776d" stroke-width="2"/><path d="M107 90L153 90" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><path d="M153 90L130 55" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="130" cy="55" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="107" cy="90" r="3" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><circle cx="153" cy="90" r="3" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><path d="M215 55L192 90" fill="none" stroke="#16776d" stroke-width="2"/><path d="M192 90L238 90" fill="none" stroke="#16776d" stroke-width="2"/><path d="M238 90L215 55" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><circle cx="215" cy="55" r="3" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><circle cx="192" cy="9