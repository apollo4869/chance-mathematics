2"/><circle cx="238" cy="170" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><path d="M300 135L277 170" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><path d="M277 170L323 170" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><path d="M323 170L300 135" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><circle cx="300" cy="135" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="277" cy="170" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="323" cy="170" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="175" y="220" font-size="24" font-weight="normal" text-anchor="middle" fill="#a45b30">P(111) = 0</text></svg><text x="30" y="487.14285714285717" font-size="22" font-weight="normal" text-anchor="start" fill="#a45b30">Comparison state</text><svg x="35" y="502.14285714285717" width="330" height="273.42857142857144" viewBox="0 0 350 290"><path d="M175 66L60 216" fill="none" stroke="#16776d" stroke-width="4"/><circle cx="117.5" cy="141.0" r="13" fill="white" stroke="white" stroke-width="2"/><text x="117.5" y="147.0" font-size="19" font-weight="normal" text-anchor="middle" fill="#16776d">1</text><path d="M60 216L290 216" fill="none" stroke="#16776d" stroke-width="4"/><circle cx="175.0" cy="216.0" r="13" fill="white" stroke="white" stroke-width="2"/><text x="175.0" y="222.0" font-size="19" font-weight="normal" text-anchor="middle" fill="#16776d">1</text><path d="M290 216L175 66" fill="none" stroke="#16776d" stroke-width="4"/><circle cx="232.5" cy="141.0" r="13" fill="white" stroke="white" stroke-width="2"/><text x="232.5" y="147.0" font-size="19" font-weight="normal" text-anchor="middle" fill="#16776d">1</text><circle cx="175" cy="66" r="23" fill="white" stroke="#65756e" stroke-width="2"/><text x="175" y="73" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">1</text><circle cx="60" cy="216" r="23" fill="white" stroke="#65756e" stroke-width="2"/><text x="60" y="223" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">2</text><circle cx="290" cy="216" r="23" fill="white" stroke="#65756e" stroke-width="2"/><text x="290" y="223" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">3</text><text x="175" y="26" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">One independent bit per pair</text><text x="175" y="278" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">X₁₂X₂₃X₃₁ = 111</text></svg><svg x="475" y="502.14285714285717" width="330" height="212.14285714285714" viewBox="0 0 350 225"><text x="175" y="25" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">Eight equiprobable inputs, each 1/8</text><path d="M45 55L22 90" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><path d="M22 90L68 90" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><path d="M68 90L45 55" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><circle cx="45" cy="55" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="22" cy="90" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="68" cy="90" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><path d="M130 55L107 90" fill="none" stroke="#16776d" stroke-width="2"/><path d="M107 90L153 90" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><path d="M153 90L130 55" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><circle cx="130" cy="55" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="107" cy="90" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="153" cy="90" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><path d="M215 55L192 90" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><path d="M192 90L238 90" fill="none" stroke="#16776d" stroke-width="2"/><path d="M238 90L215 55" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><circle cx="215" cy="55" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="192" cy="90" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="238" cy="90" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><path d="M300 55L277 90" fill="none" stroke="#16776d" stroke-width="2"/><path d="M277 90L323 90" fill="none" stroke="#16776d" stroke-width="2"/><path d="M323 90L300 55" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><circle cx="300" cy="55" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="277" cy="90" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="323" cy="90" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><path d="M45 135L22 170" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><path d="M22 170L68 170" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><path d="M68 170L45 135" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="45" cy="135" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="22" cy="170" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="68" cy="170" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><path d="M130 135L107 170" fill="none" stroke="#16776d" stroke-width="2"/><path d="M107 170L153 170" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><path d="M153 170L130 135" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="130" cy="135" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="107" cy="170" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="153" cy="170" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><path d="M215 135L192 170" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><path d="M192 170L238 170" fill="none" stroke="#16776d" stroke-width="2"/><path d="M238 170L215 135" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="215" cy="135" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="192" cy="170" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="238" cy="170" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><path d="M300 135L277 170" fill="none" stroke="#16776d" stroke-width="2"/><path d="M277 170L323 170" fill="none" stroke="#16776d" stroke-width="2"/><path d="M323 170L300 135" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="300" cy="135" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="277" cy="170" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="323" cy="170" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="300" cy="153" r="34" fill="none" stroke="#a45b30" stroke-width="2"/><text x="175" y="220" font-size="24" font-weight="normal" text-anchor="middle" fill="#a45b30">P(111) = 1/8</text></svg><path d="M30 805.5714285714287L870 805.5714285714287" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="834.5714285714287" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Infinite symmetric undirected arrays with zero diagonal. A assigns independent</text><text x="30" y="858.5714285714287" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">fair bits to unordered pairs. B assigns iid fair vertex colors and puts an edge</text><text x="30" y="882.5714285714287" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">between unlike colors. Each row off the diagonal is iid Bernoulli(1/2) in both</text><text x="30" y="906.5714285714287" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">models, but the all-edge triangle probabilities are 1/8 and 0. Buttons enumerate</text><text x="30" y="930.5714285714287" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">three independent input bits: edges in A, vertex colors in B. The lower panel</text><text x="30" y="954.5714285714287" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">lists all eight equiprobable inputs. Shared vertices organize higher-order</text><text x="30" y="978.5714285714287" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">constraints; here individual edge pairs are independent. This counterexample</text><text x="30" y="1002.5714285714287" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">does not prove the general Aldous–Hoover theorem; global inputs, separate</text><text x="30" y="1026.5714285714287" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">exchangeability and diagonal mechanisms remain in the text.</text></svg>