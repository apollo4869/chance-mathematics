<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1057.5714285714287" width="900" height="1057.5714285714287" role="img" aria-label="Each rotation preserves law; not every selection does"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="1057.5714285714287" fill="white"/><text x="30" y="44" font-size="26" font-weight="bold" text-anchor="start" fill="#173f39">Each rotation preserves law; not every selection does</text><text x="30" y="84" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">Every fixed rotation moves uniform mass uniformly. What if the angle is chosen</text><text x="30" y="108" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">after seeing the point?</text><svg x="35" y="129" width="390" height="323.14285714285717" viewBox="0 0 350 290"><circle cx="175" cy="137" r="91" fill="white" stroke="#ccd9d1" stroke-width="2"/><circle cx="175.0" cy="46.0" r="6" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="239.34671708797583" cy="72.65328291202417" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="266.0" cy="137.0" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="239.34671708797583" cy="201.34671708797583" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="175.0" cy="228.0" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="110.65328291202418" cy="201.34671708797583" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="84.0" cy="137.0" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="110.65328291202417" cy="72.65328291202418" r="6" fill="white" stroke="#65756e" stroke-width="2"/><text x="175" y="25" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Input: 8 equiprobable angles</text><text x="175" y="276" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">Probability 1/8 at each position</text></svg><svg x="475" y="129" width="390" height="323.14285714285717" viewBox="0 0 350 290"><circle cx="175" cy="137" r="91" fill="white" stroke="#ccd9d1" stroke-width="2"/><circle cx="266.0" cy="137.0" r="6" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="239.34671708797583" cy="201.34671708797583" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="175.0" cy="228.0" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="110.65328291202418" cy="201.34671708797583" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="84.0" cy="137.0" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="110.65328291202417" cy="72.65328291202418" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="174.99999999999997" cy="46.0" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="239.3467170879758" cy="72.65328291202417" r="6" fill="white" stroke="#65756e" stroke-width="2"/><path d="M175 137L250.0 137.0" fill="none" stroke="#16776d" stroke-width="2"/><text x="175" y="25" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Rotate all by 90°</text><text x="175" y="276" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">Probability 1/8 at each position</text></svg><text x="30" y="487.14285714285717" font-size="22" font-weight="normal" text-anchor="start" fill="#a45b30">Comparison state</text><svg x="35" y="502.14285714285717" width="330" height="273.42857142857144" viewBox="0 0 350 290"><circle cx="175" cy="137" r="91" fill="white" stroke="#ccd9d1" stroke-width="2"/><circle cx="175.0" cy="46.0" r="6" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="239.34671708797583" cy="72.65328291202417" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="266.0" cy="137.0" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="239.34671708797583" cy="201.34671708797583" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="175.0" cy="228.0" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="110.65328291202418" cy="201.34671708797583" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="84.0" cy="137.0" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="110.65328291202417" cy="72.65328291202418" r="6" fill="white" stroke="#65756e" stroke-width="2"/><text x="175" y="25" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Input: 8 equiprobable angles</text><text x="175" y="276" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">Probability 1/8 at each position</text></svg><svg x="475" y="502.14285714285717" width="330" height="273.42857142857144" viewBox="0 0 350 290"><circle cx="175" cy="137" r="91" fill="white" stroke="#ccd9d1" stroke-width="2"/><circle cx="175.0" cy="46.0" r="16.970562748477143" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="175" y="149" font-size="24" font-weight="normal" text-anchor="middle" fill="#a45b30">P{0}=1</text><text x="175" y="25" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Read angle, then send it to 0</text><text x="175" y="276" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">All eight masses meet at one point</text></svg><path d="M30 805.5714285714287L870 805.5714285714287" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="834.5714285714287" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Eight equiprobable circle angles with multiples of 90 degrees give an exact</text><text x="30" y="858.5714285714287" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">finite-group example, not quadrature for continuous Haar measure. Each fixed</text><text x="30" y="882.5714285714287" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">rotation permutes the eight masses; a(theta)=-theta sends them all to 0. Circle</text><text x="30" y="906.5714285714287" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">area denotes probability; the concentrated disk has eight times one input mass.</text><text x="30" y="930.5714285714287" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">The continuous analogue follows from arc-length invariance. Not every data-</text><text x="30" y="954.5714285714287" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">dependent rotation fails: a radius-based orbit choice may preserve law.</text><text x="30" y="978.5714285714287" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Predictable choices for fresh noise require the independence assumptions of</text><text x="30" y="1002.5714285714287" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">section 45.16.</text></svg>