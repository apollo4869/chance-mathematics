<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 958.1428571428571" width="900" height="958.1428571428571" role="img" aria-label="新开一桌，未必出现新值"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="958.1428571428571" fill="white"/><text x="30" y="44" font-size="26" font-weight="bold" text-anchor="start" fill="#173f39">新开一桌，未必出现新值</text><text x="30" y="84" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">先分桌，再给桌贴标签。这两步会得到同一份划分吗？</text><svg x="35" y="105" width="390" height="334.2857142857143" viewBox="0 0 350 300"><circle cx="60" cy="118" r="34" fill="white" stroke="#16776d" stroke-width="2"/><text x="60" y="126" font-size="24" font-weight="normal" text-anchor="middle" fill="#16776d">A</text><circle cx="35" cy="58" r="16" fill="white" stroke="#65756e" stroke-width="2"/><text x="35" y="64" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">1</text><path d="M35 75L60 84" fill="none" stroke="#ccd9d1" stroke-width="1"/><circle cx="85" cy="58" r="16" fill="white" stroke="#65756e" stroke-width="2"/><text x="85" y="64" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">2</text><path d="M85 75L60 84" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="60" y="229" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">Z1 = z</text><circle cx="174" cy="118" r="34" fill="white" stroke="#a45b30" stroke-width="2"/><text x="174" y="126" font-size="24" font-weight="normal" text-anchor="middle" fill="#a45b30">B</text><circle cx="149" cy="58" r="16" fill="white" stroke="#65756e" stroke-width="2"/><text x="149" y="64" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">3</text><path d="M149 75L174 84" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="174" y="229" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">Z2 = z</text><circle cx="288" cy="118" r="34" fill="white" stroke="#6d6697" stroke-width="2"/><text x="288" y="126" font-size="24" font-weight="normal" text-anchor="middle" fill="#6d6697">C</text><circle cx="263" cy="58" r="16" fill="#eaf2ee" stroke="#16776d" stroke-width="2"/><text x="263" y="64" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">4</text><path d="M263 75L288 84" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="288" y="229" font-size="18" font-weight="normal" text-anchor="middle" fill="#6d6697">Z3 = z</text><text x="175" y="282" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">圆桌记祖先，标签记观测值</text></svg><svg x="475" y="105" width="390" height="334.2857142857143" viewBox="0 0 350 300"><text x="175" y="33" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">按观测值重新归类</text><rect x="30" y="65" width="290" height="46" fill="#eaf2ee" stroke="#ccd9d1" stroke-width="1.5"/><text x="50" y="95" font-size="22" font-weight="normal" text-anchor="start" fill="#16776d">z</text><text x="195" y="95" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">{ 1, 2, 3, 4 }</text><text x="175" y="282" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">同名标签可以合并不同餐桌</text></svg><text x="30" y="474.2857142857143" font-size="22" font-weight="normal" text-anchor="start" fill="#a45b30">对照状态</text><svg x="35" y="489.2857142857143" width="330" height="282.85714285714283" viewBox="0 0 350 300"><circle cx="60" cy="118" r="34" fill="white" stroke="#16776d" stroke-width="2"/><text x="60" y="126" font-size="24" font-weight="normal" text-anchor="middle" fill="#16776d">A</text><circle cx="35" cy="58" r="16" fill="white" stroke="#65756e" stroke-width="2"/><text x="35" y="64" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">1</text><path d="M35 75L60 84" fill="none" stroke="#ccd9d1" stroke-width="1"/><circle cx="85" cy="58" r="16" fill="white" stroke="#65756e" stroke-width="2"/><text x="85" y="64" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">2</text><path d="M85 75L60 84" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="60" y="229" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">Z1 = a</text><circle cx="174" cy="118" r="34" fill="white" stroke="#a45b30" stroke-width="2"/><text x="174" y="126" font-size="24" font-weight="normal" text-anchor="middle" fill="#a45b30">B</text><circle cx="149" cy="58" r="16" fill="white" stroke="#65756e" stroke-width="2"/><text x="149" y="64" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">3</text><path d="M149 75L174 84" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="174" y="229" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">Z2 = b</text><circle cx="288" cy="118" r="34" fill="white" stroke="#6d6697" stroke-width="2"/><text x="288" y="126" font-size="24" font-weight="normal" text-anchor="middle" fill="#6d6697">C</text><circle cx="263" cy="58" r="16" fill="#eaf2ee" stroke="#16776d" stroke-width="2"/><text x="263" y="64" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">4</text><path d="M263 75L288 84" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="288" y="229" font-size="18" font-weight="normal" text-anchor="middle" fill="#6d6697">Z3 = c</text><text x="175" y="282" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">圆桌记祖先，标签记观测值</text></svg><svg x="475" y="489.2857142857143" width="330" height="282.85714285714283" viewBox="0 0 350 300"><text x="175" y="33" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">按观测值重新归类</text><rect x="30" y="65" width="290" height="46" fill="#eaf2ee" stroke="#ccd9d1" stroke-width="1.5"/><text x="50" y="95" font-size="22" font-weight="normal" text-anchor="start" fill="#16776d">a</text><text x="195" y="95" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">{ 1, 2 }</text><rect x="30" y="123" width="290" height="46" fill="#eaf2ee" stroke="#ccd9d1" stroke-width="1.5"/><text x="50" y="153" font-size="22" font-weight="normal" text-anchor="start" fill="#16776d">b</text><text x="195" y="153" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">{ 3 }</text><rect x="30" y="181" width="290" height="46" fill="#eaf2ee" stroke="#ccd9d1" stroke-width="1.5"/><text x="50" y="211" font-size="22" font-weight="normal" text-anchor="start" fill="#16776d">c</text><text x="195" y="211" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">{ 4 }</text><text x="175" y="282" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">同名标签可以合并不同餐桌</text></svg><path d="M30 802.1428571428571L870 802.1428571428571" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="831.1428571428571" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">标准一参数CRP，α=1；已有桌A={1,2}、B={3}，第四人坐A、B或新桌的预测概率分别1/2、1/4、1/4。每桌</text><text x="30" y="855.1428571428571" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">标签独立从H抽取，并独立于餐桌过程。原子示例H=(δz+δw)/2，所显示各已开桌恰同为z是一个正概率条件</text><text x="30" y="879.1428571428571" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">配置，不是几乎必然结论；无原子H时标签几乎必然互异。图上选择分支是检查条件结果，不宣称三个分支等</text><text x="30" y="903.1428571428571" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">可能。实际观测值相等划分可以比餐桌划分更粗。P(1∼Π2)=1/2，而本原子H下P(X₁=X₂)=3/4。</text></svg>