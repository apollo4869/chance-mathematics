<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 937.5714285714287" width="900" height="937.5714285714287" role="img" aria-label="每个旋转保律，不等于任意选法保律"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="937.5714285714287" fill="white"/><text x="30" y="44" font-size="26" font-weight="bold" text-anchor="start" fill="#173f39">每个旋转保律，不等于任意选法保律</text><text x="30" y="84" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">每个固定旋转都把概率均匀搬过去。先看见点，再挑旋转，还会均匀吗？</text><svg x="35" y="105" width="390" height="323.14285714285717" viewBox="0 0 350 290"><circle cx="175" cy="137" r="91" fill="white" stroke="#ccd9d1" stroke-width="2"/><circle cx="175.0" cy="46.0" r="6" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="239.34671708797583" cy="72.65328291202417" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="266.0" cy="137.0" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="239.34671708797583" cy="201.34671708797583" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="175.0" cy="228.0" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="110.65328291202418" cy="201.34671708797583" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="84.0" cy="137.0" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="110.65328291202417" cy="72.65328291202418" r="6" fill="white" stroke="#65756e" stroke-width="2"/><text x="175" y="25" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">输入：8个等可能角度</text><text x="175" y="276" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">每个位置概率1/8</text></svg><svg x="475" y="105" width="390" height="323.14285714285717" viewBox="0 0 350 290"><circle cx="175" cy="137" r="91" fill="white" stroke="#ccd9d1" stroke-width="2"/><circle cx="266.0" cy="137.0" r="6" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="239.34671708797583" cy="201.34671708797583" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="175.0" cy="228.0" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="110.65328291202418" cy="201.34671708797583" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="84.0" cy="137.0" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="110.65328291202417" cy="72.65328291202418" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="174.99999999999997" cy="46.0" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="239.3467170879758" cy="72.65328291202417" r="6" fill="white" stroke="#65756e" stroke-width="2"/><path d="M175 137L250.0 137.0" fill="none" stroke="#16776d" stroke-width="2"/><text x="175" y="25" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">同转 90°</text><text x="175" y="276" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">每个位置概率1/8</text></svg><text x="30" y="463.14285714285717" font-size="22" font-weight="normal" text-anchor="start" fill="#a45b30">对照状态</text><svg x="35" y="478.14285714285717" width="330" height="273.42857142857144" viewBox="0 0 350 290"><circle cx="175" cy="137" r="91" fill="white" stroke="#ccd9d1" stroke-width="2"/><circle cx="175.0" cy="46.0" r="6" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="239.34671708797583" cy="72.65328291202417" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="266.0" cy="137.0" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="239.34671708797583" cy="201.34671708797583" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="175.0" cy="228.0" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="110.65328291202418" cy="201.34671708797583" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="84.0" cy="137.0" r="6" fill="white" stroke="#65756e" stroke-width="2"/><circle cx="110.65328291202417" cy="72.65328291202418" r="6" fill="white" stroke="#65756e" stroke-width="2"/><text x="175" y="25" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">输入：8个等可能角度</text><text x="175" y="276" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">每个位置概率1/8</text></svg><svg x="475" y="478.14285714285717" width="330" height="273.42857142857144" viewBox="0 0 350 290"><circle cx="175" cy="137" r="91" fill="white" stroke="#ccd9d1" stroke-width="2"/><circle cx="175.0" cy="46.0" r="16.970562748477143" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="175" y="149" font-size="24" font-weight="normal" text-anchor="middle" fill="#a45b30">P{0}=1</text><text x="175" y="25" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">看完角度，再转到0</text><text x="175" y="276" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">八份质量全部聚到同一点</text></svg><path d="M30 781.5714285714287L870 781.5714285714287" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="810.5714285714287" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">图用圆上的8个等可能角度和90°整数倍旋转，构成精确有限群例子，不是用8点近似连续Haar积分。每个固定</text><text x="30" y="834.5714285714287" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">旋转都置换8份质量；a(θ)=−θ却把它们送到0。圆点面积表示概率，集中后面积为单点的8倍。连续均匀圆</text><text x="30" y="858.5714285714287" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">周的同类结论由弧长不变证明。并非所有依赖数据的旋转都失效：按轨道半径选择旋转可保律；使用独立新噪</text><text x="30" y="882.5714285714287" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">声前的可测选择另需§45.16的条件独立假设。</text></svg>