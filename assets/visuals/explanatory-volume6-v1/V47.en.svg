<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1170.7142857142858" width="900" height="1170.7142857142858" role="img" aria-label="Residual mass is not one more color"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="1170.7142857142858" fill="white"/><text x="30" y="44" font-size="26" font-weight="bold" text-anchor="start" fill="#173f39">Residual mass is not one more color</text><text x="30" y="84" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">Do points outside the positive mass bands share one residual class, or form</text><text x="30" y="108" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">separate singletons?</text><svg x="35" y="129" width="390" height="384.42857142857144" viewBox="0 0 350 345"><text x="175" y="25" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">A shared positive band defines a block</text><rect x="15" y="51" width="160" height="33" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="175" y="51" width="80.0" height="33" fill="#fbf0df" stroke="#a45b30" stroke-width="1.5"/><rect x="255.0" y="51" width="80.0" height="33" fill="white" stroke="#65756e" stroke-width="1.5"/><text x="95" y="75" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">s₁=1/2</text><text x="215.0" y="75" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">s₂=1/4</text><text x="295.0" y="75" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">dust</text><circle cx="47.0" cy="121" r="4" fill="#16776d" stroke="#16776d" stroke-width="2"/><path d="M47.0 88L47.0 115" fill="none" stroke="#16776d" stroke-width="1"/><path d="M47.0 132L47.0 164" fill="none" stroke="#16776d" stroke-width="2"/><path d="M43.52027572711016 156.7964231811786L47.0 164" fill="none" stroke="#16776d" stroke-width="2"/><path d="M50.47972427288984 156.7964231811786L47.0 164" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="47.0" cy="180" r="14" fill="white" stroke="#16776d" stroke-width="2"/><text x="47.0" y="186" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">1</text><circle cx="111.0" cy="121" r="4" fill="#16776d" stroke="#16776d" stroke-width="2"/><path d="M111.0 88L111.0 115" fill="none" stroke="#16776d" stroke-width="1"/><path d="M111.0 132L111.0 164" fill="none" stroke="#16776d" stroke-width="2"/><path d="M107.52027572711016 156.7964231811786L111.0 164" fill="none" stroke="#16776d" stroke-width="2"/><path d="M114.47972427288984 156.7964231811786L111.0 164" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="111.0" cy="180" r="14" fill="white" stroke="#16776d" stroke-width="2"/><text x="111.0" y="186" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">2</text><circle cx="207.0" cy="121" r="4" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><path d="M207.0 88L207.0 115" fill="none" stroke="#a45b30" stroke-width="1"/><path d="M207.0 132L207.0 164" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M203.52027572711015 156.7964231811786L207.0 164" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M210.47972427288985 156.7964231811786L207.0 164" fill="none" stroke="#a45b30" stroke-width="2"/><circle cx="207.0" cy="180" r="14" fill="white" stroke="#a45b30" stroke-width="2"/><text x="207.0" y="186" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">3</text><circle cx="267.8" cy="121" r="4" fill="white" stroke="#65756e" stroke-width="2"/><path d="M267.8 88L267.8 115" fill="none" stroke="#65756e" stroke-width="1"/><path d="M267.8 132L267.8 164" fill="none" stroke="#65756e" stroke-width="2"/><path d="M264.3202757271102 156.7964231811786L267.8 164" fill="none" stroke="#65756e" stroke-width="2"/><path d="M271.27972427288984 156.7964231811786L267.8 164" fill="none" stroke="#65756e" stroke-width="2"/><circle cx="267.8" cy="180" r="14" fill="white" stroke="#65756e" stroke-width="2"/><text x="267.8" y="186" font-size="18" font-weight="normal" text-anchor="middle" fill="#65756e">4</text><circle cx="293.4" cy="121" r="4" fill="white" stroke="#65756e" stroke-width="2"/><path d="M293.4 88L293.4 115" fill="none" stroke="#65756e" stroke-width="1"/><path d="M293.4 132L293.4 201" fill="none" stroke="#65756e" stroke-width="2"/><path d="M289.92027572711015 193.7964231811786L293.4 201" fill="none" stroke="#65756e" stroke-width="2"/><path d="M296.8797242728898 193.7964231811786L293.4 201" fill="none" stroke="#65756e" stroke-width="2"/><circle cx="293.4" cy="217" r="14" fill="white" stroke="#65756e" stroke-width="2"/><text x="293.4" y="223" font-size="18" font-weight="normal" text-anchor="middle" fill="#65756e">5</text><circle cx="319.0" cy="121" r="4" fill="white" stroke="#65756e" stroke-width="2"/><path d="M319.0 88L319.0 115" fill="none" stroke="#65756e" stroke-width="1"/><path d="M319.0 132L319.0 238" fill="none" stroke="#65756e" stroke-width="2"/><path d="M315.5202757271102 230.7964231811786L319.0 238" fill="none" stroke="#65756e" stroke-width="2"/><path d="M322.4797242728898 230.7964231811786L319.0 238" fill="none" stroke="#65756e" stroke-width="2"/><circle cx="319.0" cy="254" r="14" fill="white" stroke="#65756e" stroke-width="2"/><text x="319.0" y="260" font-size="18" font-weight="normal" text-anchor="middle" fill="#65756e">6</text><text x="175" y="281" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">Points held fixed; band masses change</text><text x="175" y="320" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">s₁ + s₂ + d = 1</text></svg><svg x="475" y="129" width="390" height="384.42857142857144" viewBox="0 0 350 345"><text x="175" y="25" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">Keep only the equivalence relation</text><rect x="48" y="52" width="254" height="37" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="175" y="77" font-size="22" font-weight="normal" text-anchor="middle" fill="#16776d">{ 1, 2 }</text><rect x="48" y="99" width="254" height="37" fill="#fbf0df" stroke="#a45b30" stroke-width="1.5"/><text x="175" y="124" font-size="22" font-weight="normal" text-anchor="middle" fill="#a45b30">{ 3 }</text><rect x="48" y="146" width="254" height="37" fill="white" stroke="#65756e" stroke-width="1.5"/><text x="175" y="171" font-size="22" font-weight="normal" text-anchor="middle" fill="#65756e">{ 4 }</text><rect x="48" y="193" width="254" height="37" fill="white" stroke="#65756e" stroke-width="1.5"/><text x="175" y="218" font-size="22" font-weight="normal" text-anchor="middle" fill="#65756e">{ 5 }</text><rect x="48" y="240" width="254" height="37" fill="white" stroke="#65756e" stroke-width="1.5"/><text x="175" y="265" font-size="22" font-weight="normal" text-anchor="middle" fill="#65756e">{ 6 }</text><text x="175" y="337" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">Each dust point is its own singleton</text></svg><text x="30" y="548.4285714285714" font-size="22" font-weight="normal" text-anchor="start" fill="#a45b30">Comparison state</text><svg x="35" y="563.4285714285714" width="330" height="325.2857142857143" viewBox="0 0 350 345"><text x="175" y="25" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">A shared positive band defines a block</text><rect x="15" y="51" width="160" height="33" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><rect x="175" y="51" width="160.0" height="33" fill="#fbf0df" stroke="#a45b30" stroke-width="1.5"/><text x="95" y="75" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">s₁=1/2</text><text x="255.0" y="75" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">s₂=1/2</text><circle cx="47.0" cy="121" r="4" fill="#16776d" stroke="#16776d" stroke-width="2"/><path d="M47.0 88L47.0 115" fill="none" stroke="#16776d" stroke-width="1"/><path d="M47.0 132L47.0 164" fill="none" stroke="#16776d" stroke-width="2"/><path d="M43.52027572711016 156.7964231811786L47.0 164" fill="none" stroke="#16776d" stroke-width="2"/><path d="M50.47972427288984 156.7964231811786L47.0 164" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="47.0" cy="180" r="14" fill="white" stroke="#16776d" stroke-width="2"/><text x="47.0" y="186" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">1</text><circle cx="111.0" cy="121" r="4" fill="#16776d" stroke="#16776d" stroke-width="2"/><path d="M111.0 88L111.0 115" fill="none" stroke="#16776d" stroke-width="1"/><path d="M111.0 132L111.0 164" fill="none" stroke="#16776d" stroke-width="2"/><path d="M107.52027572711016 156.7964231811786L111.0 164" fill="none" stroke="#16776d" stroke-width="2"/><path d="M114.47972427288984 156.7964231811786L111.0 164" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="111.0" cy="180" r="14" fill="white" stroke="#16776d" stroke-width="2"/><text x="111.0" y="186" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">2</text><circle cx="207.0" cy="121" r="4" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><path d="M207.0 88L207.0 115" fill="none" stroke="#a45b30" stroke-width="1"/><path d="M207.0 132L207.0 164" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M203.52027572711015 156.7964231811786L207.0 164" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M210.47972427288985 156.7964231811786L207.0 164" fill="none" stroke="#a45b30" stroke-width="2"/><circle cx="207.0" cy="180" r="14" fill="white" stroke="#a45b30" stroke-width="2"/><text x="207.0" y="186" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">3</text><circle cx="267.8" cy="121" r="4" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><path d="M267.8 88L267.8 115" fill="none" stroke="#a45b30" stroke-width="1"/><path d="M267.8 132L267.8 164" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M264.3202757271102 156.7964231811786L267.8 164" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M271.27972427288984 156.7964231811786L267.8 164" fill="none" stroke="#a45b30" stroke-width="2"/><circle cx="267.8" cy="180" r="14" fill="white" stroke="#a45b30" stroke-width="2"/><text x="267.8" y="186" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">4</text><circle cx="293.4" cy="121" r="4" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><path d="M293.4 88L293.4 115" fill="none" stroke="#a45b30" stroke-width="1"/><path d="M293.4 132L293.4 201" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M289.92027572711015 193.7964231811786L293.4 201" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M296.8797242728898 193.7964231811786L293.4 201" fill="none" stroke="#a45b30" stroke-width="2"/><circle cx="293.4" cy="217" r="14" fill="white" stroke="#a45b30" stroke-width="2"/><text x="293.4" y="223" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">5</text><circle cx="319.0" cy="121" r="4" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><path d="M319.0 88L319.0 115" fill="none" stroke="#a45b30" stroke-width="1"/><path d="M319.0 132L319.0 238" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M315.5202757271102 230.7964231811786L319.0 238" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M322.4797242728898 230.7964231811786L319.0 238" fill="none" stroke="#a45b30" stroke-width="2"/><circle cx="319.0" cy="254" r="14" fill="white" stroke="#a45b30" stroke-width="2"/><text x="319.0" y="260" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">6</text><text x="175" y="281" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">Points held fixed; band masses change</text><text x="175" y="320" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">s₁ + s₂ + d = 1</text></svg><svg x="475" y="563.4285714285714" width="330" height="325.2857142857143" viewBox="0 0 350 345"><text x="175" y="25" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">Keep only the equivalence relation</text><rect x="48" y="52" width="254" height="37" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="175" y="77" font-size="22" font-weight="normal" text-anchor="middle" fill="#16776d">{ 1, 2 }</text><rect x="48" y="99" width="254" height="37" fill="#fbf0df" stroke="#a45b30" stroke-width="1.5"/><text x="175" y="124" font-size="22" font-weight="normal" text-anchor="middle" fill="#a45b30">{ 3, 4, 5, 6 }</text><text x="175" y="337" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">Each dust point is its own singleton</text></svg><path d="M30 918.7142857142858L870 918.7142857142858" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="947.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Deterministic paintbox masses s1=1/2, s2=1/2-d, with d=0,1/4,1/2; omit zero</text><text x="30" y="971.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">bands. Given masses, each individual samples an independent uniform point;</text><text x="30" y="995.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">shared positive bands define a class, while residual points are singletons. Six</text><text x="30" y="1019.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">fixed positions illustrate the rule, not frequencies or their limiting theorem.</text><text x="30" y="1043.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Residual mass is not a shared color; d squared is not added to the same-block</text><text x="30" y="1067.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">probability s1 squared+s2 squared. Random masses require Kingman mixing, common</text><text x="30" y="1091.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">null sets and measurable ranking. A static paintbox does not specify coalescent</text><text x="30" y="1115.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">clocks: pair rate 1 is an additional Kingman rule.</text></svg>