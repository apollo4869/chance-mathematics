<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1066.4857142857143" width="900" height="1066.4857142857143" role="img" aria-label="Shift the record; the environment stays"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="1066.4857142857143" fill="white"/><text x="30" y="44" font-size="26" font-weight="bold" text-anchor="start" fill="#173f39">Shift the record; the environment stays</text><text x="30" y="84" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">After shifting the record, what random information can still remain?</text><svg x="35" y="105" width="390" height="340.9714285714286" viewBox="0 0 350 306"><rect x="94" y="12" width="162" height="44" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="175" y="41" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">Θ = 1/4</text><text x="175" y="83" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">The same environment keeps generating</text><path d="M175 94L175 115" fill="none" stroke="#16776d" stroke-width="2"/><path d="M171.52027572711015 107.79642318117858L175 115" fill="none" stroke="#16776d" stroke-width="2"/><path d="M178.47972427288985 107.79642318117858L175 115" fill="none" stroke="#16776d" stroke-width="2"/><rect x="20" y="135" width="42" height="45" fill="white" stroke="#16776d" stroke-width="1.5"/><text x="41" y="165" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><text x="41" y="205" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">0</text><rect x="72" y="135" width="42" height="45" fill="white" stroke="#16776d" stroke-width="1.5"/><text x="93" y="165" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><text x="93" y="205" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><rect x="124" y="135" width="42" height="45" fill="#16776d" stroke="#16776d" stroke-width="1.5"/><text x="145" y="165" font-size="24" font-weight="normal" text-anchor="middle" fill="white">1</text><text x="145" y="205" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">2</text><rect x="176" y="135" width="42" height="45" fill="white" stroke="#16776d" stroke-width="1.5"/><text x="197" y="165" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><text x="197" y="205" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">3</text><rect x="228" y="135" width="42" height="45" fill="white" stroke="#16776d" stroke-width="1.5"/><text x="249" y="165" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><text x="249" y="205" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">4</text><rect x="280" y="135" width="42" height="45" fill="#16776d" stroke="#16776d" stroke-width="1.5"/><text x="301" y="165" font-size="24" font-weight="normal" text-anchor="middle" fill="white">1</text><text x="301" y="205" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">5</text><text x="175" y="246" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Window starts at index 0</text><text x="175" y="282" font-size="20" font-weight="bold" text-anchor="middle" fill="#16776d">The window changes; Θ does not</text></svg><svg x="475" y="105" width="390" height="340.9714285714286" viewBox="0 0 350 306"><rect x="22" y="55" width="153.0" height="30" fill="#16776d"/><rect x="175.0" y="55" width="153.0" height="30" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><text x="22" y="45" font-size="18" font-weight="normal" text-anchor="start" fill="#173f39">Mix both environments</text><text x="328" y="111" font-size="22" font-weight="normal" text-anchor="end" fill="#16776d">0.5</text><text x="175" y="144" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">E X₀ = 1/2</text><rect x="22" y="211" width="76.5" height="30" fill="#16776d"/><rect x="98.5" y="211" width="229.5" height="30" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><text x="22" y="201" font-size="18" font-weight="normal" text-anchor="start" fill="#173f39">This path retains its environment</text><text x="328" y="267" font-size="22" font-weight="normal" text-anchor="end" fill="#16776d">0.25</text><text x="175" y="304" font-size="25" font-weight="normal" text-anchor="middle" fill="#16776d">lim AₙX₀ = Θ</text></svg><text x="30" y="480.9714285714286" font-size="22" font-weight="normal" text-anchor="start" fill="#a45b30">Comparison state</text><svg x="35" y="495.9714285714286" width="330" height="288.51428571428573" viewBox="0 0 350 306"><rect x="94" y="12" width="162" height="44" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="175" y="41" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">Θ = 3/4</text><text x="175" y="83" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">The same environment keeps generating</text><path d="M175 94L175 115" fill="none" stroke="#16776d" stroke-width="2"/><path d="M171.52027572711015 107.79642318117858L175 115" fill="none" stroke="#16776d" stroke-width="2"/><path d="M178.47972427288985 107.79642318117858L175 115" fill="none" stroke="#16776d" stroke-width="2"/><rect x="20" y="135" width="42" height="45" fill="#16776d" stroke="#16776d" stroke-width="1.5"/><text x="41" y="165" font-size="24" font-weight="normal" text-anchor="middle" fill="white">1</text><text x="41" y="205" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">0</text><rect x="72" y="135" width="42" height="45" fill="#16776d" stroke="#16776d" stroke-width="1.5"/><text x="93" y="165" font-size="24" font-weight="normal" text-anchor="middle" fill="white">1</text><text x="93" y="205" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><rect x="124" y="135" width="42" height="45" fill="white" stroke="#16776d" stroke-width="1.5"/><text x="145" y="165" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><text x="145" y="205" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">2</text><rect x="176" y="135" width="42" height="45" fill="#16776d" stroke="#16776d" stroke-width="1.5"/><text x="197" y="165" font-size="24" font-weight="normal" text-anchor="middle" fill="white">1</text><text x="197" y="205" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">3</text><rect x="228" y="135" width="42" height="45" fill="#16776d" stroke="#16776d" stroke-width="1.5"/><text x="249" y="165" font-size="24" font-weight="normal" text-anchor="middle" fill="white">1</text><text x="249" y="205" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">4</text><rect x="280" y="135" width="42" height="45" fill="white" stroke="#16776d" stroke-width="1.5"/><text x="301" y="165" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><text x="301" y="205" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">5</text><text x="175" y="246" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Window starts at index 0</text><text x="175" y="282" font-size="20" font-weight="bold" text-anchor="middle" fill="#16776d">The window changes; Θ does not</text></svg><svg x="475" y="495.9714285714286" width="330" height="288.51428571428573" viewBox="0 0 350 306"><rect x="22" y="55" width="153.0" height="30" fill="#16776d"/><rect x="175.0" y="55" width="153.0" height="30" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><text x="22" y="45" font-size="18" font-weight="normal" text-anchor="start" fill="#173f39">Mix both environments</text><text x="328" y="111" font-size="22" font-weight="normal" text-anchor="end" fill="#16776d">0.5</text><text x="175" y="144" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">E X₀ = 1/2</text><rect x="22" y="211" width="229.5" height="30" fill="#16776d"/><rect x="251.5" y="211" width="76.5" height="30" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><text x="22" y="201" font-size="18" font-weight="normal" text-anchor="start" fill="#173f39">This path retains its environment</text><text x="328" y="267" font-size="22" font-weight="normal" text-anchor="end" fill="#16776d">0.75</text><text x="175" y="304" font-size="25" font-weight="normal" text-anchor="middle" fill="#16776d">lim AₙX₀ = Θ</text></svg><path d="M30 814.4857142857143L870 814.4857142857143" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="843.4857142857143" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Θ is 1/4 or 3/4 with equal probabilities; given Θ, the Xk are iid Bernoulli(Θ).</text><text x="30" y="867.4857142857143" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Displayed windows are deterministic examples, not simulations or a proof of the</text><text x="30" y="891.4857142857143" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">strong law; finite frequencies are not limits. The conditional strong law gives</text><text x="30" y="915.4857142857143" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">limit Θ, while the mixture mean is 1/2. Here the invariant sigma-field is</text><text x="30" y="939.4857142857143" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">sigma(Θ), modulo null sets. Controls move a finite window or compare conditional</text><text x="30" y="963.4857142857143" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">environments; they do not resample Θ along one path. General Birkhoff requires</text><text x="30" y="987.4857142857143" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">measure preservation and integrability; ergodicity makes the conditional mean</text><text x="30" y="1011.4857142857143" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">constant but does not imply mixing.</text></svg>