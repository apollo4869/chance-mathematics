l="#173f39">3</text><text x="175" y="26" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">每对各自抽一位</text><text x="175" y="278" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">X₁₂X₂₃X₃₁ = 111</text></svg><svg x="475" y="478.14285714285717" width="330" height="212.14285714285714" viewBox="0 0 350 225"><text x="175" y="25" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">8份等概率输入，各占1/8</text><path d="M45 55L22 90" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><path d="M22 90L68 90" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><path d="M68 90L45 55" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><circle cx="45" cy="55" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="22" cy="90" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="68" cy="90" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><path d="M130 55L107 90" fill="none" stroke="#16776d" stroke-width="2"/><path d="M107 90L153 90" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><path d="M153 90L130 55" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><circle cx="130" cy="55" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="107" cy="90" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="153" cy="90" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><path d="M215 55L192 90" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><path d="M192 90L238 90" fill="none" stroke="#16776d" stroke-width="2"/><path d="M238 90L215 55" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><circle cx="215" cy="55" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="192" cy="90" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="238" cy="90" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><path d="M300 55L277 90" fill="none" stroke="#16776d" stroke-width="2"/><path d="M277 90L323 90" fill="none" stroke="#16776d" stroke-width="2"/><path d="M323 90L300 55" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><circle cx="300" cy="55" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="277" cy="90" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="323" cy="90" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><path d="M45 135L22 170" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><path d="M22 170L68 170" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><path d="M68 170L45 135" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="45" cy="135" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="22" cy="170" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="68" cy="170" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><path d="M130 135L107 170" fill="none" stroke="#16776d" stroke-width="2"/><path d="M107 170L153 170" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><path d="M153 170L130 135" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="130" cy="135" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="107" cy="170" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="153" cy="170" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><path d="M215 135L192 170" fill="none" stroke="#ccd9d1" stroke-width="2" stroke-dasharray="3 3"/><path d="M192 170L238 170" fill="none" stroke="#16776d" stroke-width="2"/><path d="M238 170L215 135" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="215" cy="135" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="192" cy="170" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="238" cy="170" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><path d="M300 135L277 170" fill="none" stroke="#16776d" stroke-width="2"/><path d="M277 170L323 170" fill="none" stroke="#16776d" stroke-width="2"/><path d="M323 170L300 135" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="300" cy="135" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="277" cy="170" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="323" cy="170" r="3" fill="#16776d" stroke="#16776d" stroke-width="2"/><circle cx="300" cy="153" r="34" fill="none" stroke="#a45b30" stroke-width="2"/><text x="175" y="220" font-size="24" font-weight="normal" text-anchor="middle" fill="#a45b30">P(111) = 1/8</text></svg><path d="M30 781.5714285714287L870 781.5714285714287" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="810.5714285714287" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">无限对称无向数组，对角固定0。模型A每个无序人对取独立公平位；模型B每个顶点取独立公平两色，异色记</text><text x="30" y="834.5714285714287" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">1。两模型固定一行略去对角后均为iid Bernoulli(1/2)，但三角全1概率分别1/8、0。按钮遍历三个独立输</text><text x="30" y="858.5714285714287" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">入位：A为三个边位，B为三个顶点色；下方枚举全部8份等概率输入。共享顶点会组织高阶约束，不意味着每</text><text x="30" y="882.5714285714287" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">对相邻边都相关，本例边两两独立。此为已有表示的具体反例，不代替一般Aldous–Hoover表示证明；全局</text><text x="30" y="906.5714285714287" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">输入、分别交换与对角机制仍依正文。</text></svg>