="#a45b30" stroke-width="2"/><path d="M293.4 88L293.4 115" fill="none" stroke="#a45b30" stroke-width="1"/><path d="M293.4 132L293.4 201" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M289.92027572711015 193.7964231811786L293.4 201" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M296.8797242728898 193.7964231811786L293.4 201" fill="none" stroke="#a45b30" stroke-width="2"/><circle cx="293.4" cy="217" r="14" fill="white" stroke="#a45b30" stroke-width="2"/><text x="293.4" y="223" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">5</text><circle cx="319.0" cy="121" r="4" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><path d="M319.0 88L319.0 115" fill="none" stroke="#a45b30" stroke-width="1"/><path d="M319.0 132L319.0 238" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M315.5202757271102 230.7964231811786L319.0 238" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M322.4797242728898 230.7964231811786L319.0 238" fill="none" stroke="#a45b30" stroke-width="2"/><circle cx="319.0" cy="254" r="14" fill="white" stroke="#a45b30" stroke-width="2"/><text x="319.0" y="260" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">6</text><text x="175" y="281" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">点的位置固定，改变质量分配</text><text x="175" y="320" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">s₁ + s₂ + d = 1</text></svg><svg x="475" y="539.4285714285714" width="330" height="325.2857142857143" viewBox="0 0 350 345"><text x="175" y="25" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">只看谁与谁同类</text><rect x="48" y="52" width="254" height="37" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="175" y="77" font-size="22" font-weight="normal" text-anchor="middle" fill="#16776d">{ 1, 2 }</text><rect x="48" y="99" width="254" height="37" fill="#fbf0df" stroke="#a45b30" stroke-width="1.5"/><text x="175" y="124" font-size="22" font-weight="normal" text-anchor="middle" fill="#a45b30">{ 3, 4, 5, 6 }</text><text x="175" y="337" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">dust中的点各自成块</text></svg><path d="M30 894.7142857142858L870 894.7142857142858" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="923.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">确定paintbox质量s₁=1/2、s₂=1/2−d，d=0、1/4或1/2；零长度色带删去。条件于质量，每个人独立均匀</text><text x="30" y="947.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">取[0,1]点；正色带同类，剩余部分各为单点。图中6个点位置为确定示意，不是抽样频率或频率极限的证明</text><text x="30" y="971.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">。剩余部分不是共享颜色；两次抽到dust的概率d²不计为同块概率。两人同块概率s₁²+s₂²。一般随机质量</text><text x="30" y="995.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">还需Kingman的混合、共同零集及可测排序定理。静态paintbox不决定合并时钟；每块对速率1是另加的</text><text x="30" y="1019.7142857142858" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Kingman规则。</text></svg>