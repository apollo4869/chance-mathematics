<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 970.4857142857143" width="900" height="970.4857142857143" role="img" aria-label="移走开头，环境仍然留下"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="970.4857142857143" fill="white"/><text x="30" y="44" font-size="26" font-weight="bold" text-anchor="start" fill="#173f39">移走开头，环境仍然留下</text><text x="30" y="84" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">把开头移走以后，哪些随机信息仍会留在同一条记录中？</text><svg x="35" y="105" width="390" height="340.9714285714286" viewBox="0 0 350 306"><rect x="94" y="12" width="162" height="44" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="175" y="41" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">Θ = 1/4</text><text x="175" y="83" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">同一环境，一直参与生成</text><path d="M175 94L175 115" fill="none" stroke="#16776d" stroke-width="2"/><path d="M171.52027572711015 107.79642318117858L175 115" fill="none" stroke="#16776d" stroke-width="2"/><path d="M178.47972427288985 107.79642318117858L175 115" fill="none" stroke="#16776d" stroke-width="2"/><rect x="20" y="135" width="42" height="45" fill="white" stroke="#16776d" stroke-width="1.5"/><text x="41" y="165" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><text x="41" y="205" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">0</text><rect x="72" y="135" width="42" height="45" fill="white" stroke="#16776d" stroke-width="1.5"/><text x="93" y="165" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><text x="93" y="205" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><rect x="124" y="135" width="42" height="45" fill="#16776d" stroke="#16776d" stroke-width="1.5"/><text x="145" y="165" font-size="24" font-weight="normal" text-anchor="middle" fill="white">1</text><text x="145" y="205" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">2</text><rect x="176" y="135" width="42" height="45" fill="white" stroke="#16776d" stroke-width="1.5"/><text x="197" y="165" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><text x="197" y="205" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">3</text><rect x="228" y="135" width="42" height="45" fill="white" stroke="#16776d" stroke-width="1.5"/><text x="249" y="165" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><text x="249" y="205" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">4</text><rect x="280" y="135" width="42" height="45" fill="#16776d" stroke="#16776d" stroke-width="1.5"/><text x="301" y="165" font-size="24" font-weight="normal" text-anchor="middle" fill="white">1</text><text x="301" y="205" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">5</text><text x="175" y="246" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">当前窗口起点：0</text><text x="175" y="282" font-size="20" font-weight="bold" text-anchor="middle" fill="#16776d">窗口变了，Θ没有变</text></svg><svg x="475" y="105" width="390" height="340.9714285714286" viewBox="0 0 350 306"><rect x="22" y="55" width="153.0" height="30" fill="#16776d"/><rect x="175.0" y="55" width="153.0" height="30" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><text x="22" y="45" font-size="18" font-weight="normal" text-anchor="start" fill="#173f39">把两种环境混在一起</text><text x="328" y="111" font-size="22" font-weight="normal" text-anchor="end" fill="#16776d">0.5</text><text x="175" y="144" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">E X₀ = 1/2</text><rect x="22" y="211" width="76.5" height="30" fill="#16776d"/><rect x="98.5" y="211" width="229.5" height="30" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><text x="22" y="201" font-size="18" font-weight="normal" text-anchor="start" fill="#173f39">一条长记录留下的环境</text><text x="328" y="267" font-size="22" font-weight="normal" text-anchor="end" fill="#16776d">0.25</text><text x="175" y="304" font-size="25" font-weight="normal" text-anchor="middle" fill="#16776d">lim AₙX₀ = Θ</text></svg><text x="30" y="480.9714285714286" font-size="22" font-weight="normal" text-anchor="start" fill="#a45b30">对照状态</text><svg x="35" y="495.9714285714286" width="330" height="288.51428571428573" viewBox="0 0 350 306"><rect x="94" y="12" width="162" height="44" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="175" y="41" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">Θ = 3/4</text><text x="175" y="83" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">同一环境，一直参与生成</text><path d="M175 94L175 115" fill="none" stroke="#16776d" stroke-width="2"/><path d="M171.52027572711015 107.79642318117858L175 115" fill="none" stroke="#16776d" stroke-width="2"/><path d="M178.47972427288985 107.79642318117858L175 115" fill="none" stroke="#16776d" stroke-width="2"/><rect x="20" y="135" width="42" height="45" fill="#16776d" stroke="#16776d" stroke-width="1.5"/><text x="41" y="165" font-size="24" font-weight="normal" text-anchor="middle" fill="white">1</text><text x="41" y="205" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">0</text><rect x="72" y="135" width="42" height="45" fill="#16776d" stroke="#16776d" stroke-width="1.5"/><text x="93" y="165" font-size="24" font-weight="normal" text-anchor="middle" fill="white">1</text><text x="93" y="205" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><rect x="124" y="135" width="42" height="45" fill="white" stroke="#16776d" stroke-width="1.5"/><text x="145" y="165" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><text x="145" y="205" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">2</text><rect x="176" y="135" width="42" height="45" fill="#16776d" stroke="#16776d" stroke-width="1.5"/><text x="197" y="165" font-size="24" font-weight="normal" text-anchor="middle" fill="white">1</text><text x="197" y="205" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">3</text><rect x="228" y="135" width="42" height="45" fill="#16776d" stroke="#16776d" stroke-width="1.5"/><text x="249" y="165" font-size="24" font-weight="normal" text-anchor="middle" fill="white">1</text><text x="249" y="205" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">4</text><rect x="280" y="135" width="42" height="45" fill="white" stroke="#16776d" stroke-width="1.5"/><text x="301" y="165" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><text x="301" y="205" font-size="14" font-weight="normal" text-anchor="middle" fill="#65756e">5</text><text x="175" y="246" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">当前窗口起点：0</text><text x="175" y="282" font-size="20" font-weight="bold" text-anchor="middle" fill="#16776d">窗口变了，Θ没有变</text></svg><svg x="475" y="495.9714285714286" width="330" height="288.51428571428573" viewBox="0 0 350 306"><rect x="22" y="55" width="153.0" height="30" fill="#16776d"/><rect x="175.0" y="55" width="153.0" height="30" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><text x="22" y="45" font-size="18" font-weight="normal" text-anchor="start" fill="#173f39">把两种环境混在一起</text><text x="328" y="111" font-size="22" font-weight="normal" text-anchor="end" fill="#16776d">0.5</text><text x="175" y="144" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">E X₀ = 1/2</text><rect x="22" y="211" width="229.5" height="30" fill="#16776d"/><rect x="251.5" y="211" width="76.5" height="30" fill="white" stroke="#ccd9d1" stroke-width="1.5"/><text x="22" y="201" font-size="18" font-weight="normal" text-anchor="start" fill="#173f39">一条长记录留下的环境</text><text x="328" y="267" font-size="22" font-weight="normal" text-anchor="end" fill="#16776d">0.75</text><text x="175" y="304" font-size="25" font-weight="normal" text-anchor="middle" fill="#16776d">lim AₙX₀ = Θ</text></svg><path d="M30 814.4857142857143L870 814.4857142857143" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="843.4857142857143" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Θ等概率取1/4或3/4；条件于Θ，各Xₖ为iid Bernoulli(Θ)。记录窗口是确定示意、不是模拟或强律证明</text><text x="30" y="867.4857142857143" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">；其有限比例不等于极限。给定环境的强律使长期平均趋Θ，整份混合律的均值则为1/2。不变σ域在本例等</text><text x="30" y="891.4857142857143" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">于σ(Θ)，模零集。按钮只移动有限观察窗口或切换条件环境，不在一条实现中重新抽环境。一般Birkhoff</text><text x="30" y="915.4857142857143" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">结论须保测与可积；遍历才使条件平均为常数，遍历也不自动推出混合。</text></svg>