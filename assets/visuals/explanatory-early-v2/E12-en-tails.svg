<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" role="img" aria-label="A centered future does not cancel the crossing in conditional mean square"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><text x="180" y="30" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">After ++, S₂=2</text><text x="180" y="53" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">Read terminal square S₄² below</text><text x="45" y="78" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">++</text><path d="M45 90L45 122" fill="none" stroke="#16776d" stroke-width="2"/><path d="M41.52027572711016 114.79642318117858L45 122" fill="none" stroke="#16776d" stroke-width="2"/><path d="M48.47972427288984 114.79642318117858L45 122" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="45" cy="153" r="25" fill="white" stroke="#16776d" stroke-width="2"/><text x="45" y="161" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">16</text><text x="45" y="207" font-size="18" font-weight="normal" text-anchor="middle" fill="#65756e">1/4</text><text x="133" y="78" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">+−</text><path d="M133 90L133 122" fill="none" stroke="#16776d" stroke-width="2"/><path d="M129.52027572711015 114.79642318117858L133 122" fill="none" stroke="#16776d" stroke-width="2"/><path d="M136.47972427288985 114.79642318117858L133 122" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="133" cy="153" r="25" fill="white" stroke="#16776d" stroke-width="2"/><text x="133" y="161" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">4</text><text x="133" y="207" font-size="18" font-weight="normal" text-anchor="middle" fill="#65756e">1/4</text><text x="221" y="78" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">−+</text><path d="M221 90L221 122" fill="none" stroke="#16776d" stroke-width="2"/><path d="M217.52027572711015 114.79642318117858L221 122" fill="none" stroke="#16776d" stroke-width="2"/><path d="M224.47972427288985 114.79642318117858L221 122" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="221" cy="153" r="25" fill="white" stroke="#16776d" stroke-width="2"/><text x="221" y="161" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">4</text><text x="221" y="207" font-size="18" font-weight="normal" text-anchor="middle" fill="#65756e">1/4</text><text x="309" y="78" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">−−</text><path d="M309 90L309 122" fill="none" stroke="#16776d" stroke-width="2"/><path d="M305.5202757271102 114.79642318117858L309 122" fill="none" stroke="#16776d" stroke-width="2"/><path d="M312.4797242728898 114.79642318117858L309 122" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="309" cy="153" r="25" fill="white" stroke="#16776d" stroke-width="2"/><text x="309" y="161" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><text x="309" y="207" font-size="18" font-weight="normal" text-anchor="middle" fill="#65756e">1/4</text><text x="180" y="251" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">(16 + 4 + 4 + 0) / 4 = 6</text><text x="180" y="284" font-size="16" font-weight="normal" text-anchor="middle" fill="#a45b30">An endpoint may be 0; mean square is ≥4</text></svg>