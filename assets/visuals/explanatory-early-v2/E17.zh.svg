ke-width="2"/><text x="33" y="312" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">11</text><path d="M58 305L133 305" fill="none" stroke="#16776d" stroke-width="2"/><path d="M125.79642318117858 308.4797242728898L133 305" fill="none" stroke="#16776d" stroke-width="2"/><path d="M125.79642318117858 301.5202757271102L133 305" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="178" cy="65" r="35" fill="#eaf2ee" stroke="#16776d" stroke-width="2"/><text x="178" y="72" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">1/10</text><path d="M215 65L279 65" fill="none" stroke="#16776d" stroke-width="2"/><path d="M271.79642318117857 68.47972427288984L279 65" fill="none" stroke="#16776d" stroke-width="2"/><path d="M271.79642318117857 61.52027572711016L279 65" fill="none" stroke="#16776d" stroke-width="2"/><text x="327" y="73" font-size="26" font-weight="normal" text-anchor="middle" fill="#173f39">3/10</text><circle cx="178" cy="185" r="35" fill="#eaf2ee" stroke="#16776d" stroke-width="2"/><text x="178" y="192" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">1/2</text><path d="M215 185L279 185" fill="none" stroke="#16776d" stroke-width="2"/><path d="M271.79642318117857 188.47972427288985L279 185" fill="none" stroke="#16776d" stroke-width="2"/><path d="M271.79642318117857 181.52027572711015L279 185" fill="none" stroke="#16776d" stroke-width="2"/><text x="327" y="193" font-size="26" font-weight="normal" text-anchor="middle" fill="#173f39">1/2</text><circle cx="178" cy="305" r="35" fill="#eaf2ee" stroke="#16776d" stroke-width="2"/><text x="178" y="312" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">9/10</text><path d="M215 305L279 305" fill="none" stroke="#16776d" stroke-width="2"/><path d="M271.79642318117857 308.4797242728898L279 305" fill="none" stroke="#16776d" stroke-width="2"/><path d="M271.79642318117857 301.5202757271102L279 305" fill="none" stroke="#16776d" stroke-width="2"/><text x="327" y="313" font-size="26" font-weight="normal" text-anchor="middle" fill="#173f39">7/10</text><text x="195" y="361" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">不同历史可合并：但不能丢掉预测差别</text></svg><path d="M25 545L875 545" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="25" y="575" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Θ先等概率取1/4、3/4，给定Θ后各次Bernoulli(Θ)独立。q=P(Θ=3/4|历史)。长度2的00、10、01、11依</text><text x="25" y="599" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">次给q=1/10、1/2、1/2、9/10；预测w(q)=1/4+q/2依次3/10、1/2、1/2、7/10。箭头表示信息映射，不表示</text><text x="25" y="623" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">历史等概率。只保留末位不能恢复原预测；后验则可依正文T₀、T₁更新并给出Markov核。图没有断言所有</text><text x="25" y="647" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">模型都具有一维或唯一最小状态，也没有把未画出的未来独立性当作图形结论。</text></svg>