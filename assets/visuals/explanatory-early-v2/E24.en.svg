<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1071" width="900" height="1071" role="img" aria-label="Align a jump; never erase a pulse"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="1071" fill="white"/><text x="30" y="45" font-size="26" font-weight="bold" text-anchor="start" fill="#173f39">Align a jump; never erase a pulse</text><text x="25" y="94" font-size="19" font-weight="bold" text-anchor="start" fill="#173f39">Shifted jump: error 0</text><svg x="25" y="110" width="420" height="418" viewBox="0 0 360 418"><text x="180" y="24" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Original record</text><svg x="10" y="35" width="340" height="155" viewBox="0 0 340 196"><path d="M25 151L170.0 151" fill="none" stroke="#b6c3bb" stroke-width="2" stroke-dasharray="4 4"/><circle cx="170.0" cy="151" r="4" fill="white" stroke="#b6c3bb" stroke-width="2"/><circle cx="170.0" cy="52" r="4" fill="#b6c3bb" stroke="#b6c3bb" stroke-width="2"/><path d="M170.0 52L315 52" fill="none" stroke="#b6c3bb" stroke-width="2" stroke-dasharray="4 4"/><path d="M25 151L242.5 151" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="242.5" cy="151" r="4" fill="white" stroke="#16776d" stroke-width="2"/><circle cx="242.5" cy="52" r="4" fill="#16776d" stroke="#16776d" stroke-width="2"/><path d="M242.5 52L315 52" fill="none" stroke="#16776d" stroke-width="2"/><text x="13" y="58" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">1</text><text x="13" y="157" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">0</text><text x="170" y="187" font-size="15" font-weight="normal" text-anchor="middle" fill="#173f39">Gray dashes: reference; solid: current</text></svg><path d="M180 194L180 220" fill="none" stroke="#16776d" stroke-width="2"/><path d="M176.52027572711015 212.7964231811786L180 220" fill="none" stroke="#16776d" stroke-width="2"/><path d="M183.47972427288985 212.7964231811786L180 220" fill="none" stroke="#16776d" stroke-width="2"/><text x="180" y="246" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">After the same clock</text><svg x="10" y="255" width="340" height="155" viewBox="0 0 340 196"><path d="M25 151L170.0 151" fill="none" stroke="#b6c3bb" stroke-width="2" stroke-dasharray="4 4"/><circle cx="170.0" cy="151" r="4" fill="white" stroke="#b6c3bb" stroke-width="2"/><circle cx="170.0" cy="52" r="4" fill="#b6c3bb" stroke="#b6c3bb" stroke-width="2"/><path d="M170.0 52L315 52" fill="none" stroke="#b6c3bb" stroke-width="2" stroke-dasharray="4 4"/><path d="M25 151L170.0 151" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="170.0" cy="151" r="4" fill="white" stroke="#16776d" stroke-width="2"/><circle cx="170.0" cy="52" r="4" fill="#16776d" stroke="#16776d" stroke-width="2"/><path d="M170.0 52L315 52" fill="none" stroke="#16776d" stroke-width="2"/><text x="13" y="58" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">1</text><text x="13" y="157" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">0</text><text x="170" y="187" font-size="15" font-weight="normal" text-anchor="middle" fill="#173f39">Gray dashes: reference; solid: current</text></svg></svg><text x="475" y="94" font-size="19" font-weight="bold" text-anchor="start" fill="#173f39">Pulse: error 1</text><svg x="475" y="110" width="420" height="418" viewBox="0 0 360 418"><text x="180" y="24" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Original record</text><svg x="10" y="35" width="340" height="155" viewBox="0 0 340 196"><path d="M25 151L315 151" fill="none" stroke="#b6c3bb" stroke-width="1" stroke-dasharray="4 4"/><path d="M25 151L242.5 151" fill="none" stroke="#a45b30" stroke-width="2"/><circle cx="242.5" cy="151" r="4" fill="white" stroke="#a45b30" stroke-width="2"/><circle cx="242.5" cy="52" r="4" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><path d="M242.5 52L260.625 52" fill="none" stroke="#a45b30" stroke-width="2"/><circle cx="260.625" cy="52" r="4" fill="white" stroke="#a45b30" stroke-width="2"/><circle cx="260.625" cy="151" r="4" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><path d="M260.625 151L315 151" fill="none" stroke="#a45b30" stroke-width="2"/><text x="13" y="58" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">1</text><text x="13" y="157" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">0</text><text x="170" y="187" font-size="15" font-weight="normal" text-anchor="middle" fill="#173f39">Gray dashes: reference; solid: current</text></svg><path d="M180 194L180 220" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M176.52027572711015 212.7964231811786L180 220" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M183.47972427288985 212.7964231811786L180 220" fill="none" stroke="#a45b30" stroke-width="2"/><text x="180" y="246" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">After the same clock</text><svg x="10" y="255" width="340" height="155" viewBox="0 0 340 196"><path d="M25 151L315 151" fill="none" stroke="#b6c3bb" stroke-width="1" stroke-dasharray="4 4"/><path d="M25 151L170.0 151" fill="none" stroke="#a45b30" stroke-width="2"/><circle cx="170.0" cy="151" r="4" fill="white" stroke="#a45b30" stroke-width="2"/><circle cx="170.0" cy="52" r="4" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><path d="M170.0 52L206.25 52" fill="none" stroke="#a45b30" stroke-width="2"/><circle cx="206.25" cy="52" r="4" fill="white" stroke="#a45b30" stroke-width="2"/><circle cx="206.25" cy="151" r="4" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><path d="M206.25 151L315 151" fill="none" stroke="#a45b30" stroke-width="2"/><text x="13" y="58" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">1</text><text x="13" y="157" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">0</text><text x="170" y="187" font-size="15" font-weight="normal" text-anchor="middle" fill="#173f39">Gray dashes: reference; solid: current</text></svg></svg><text x="25" y="577" font-size="19" font-weight="bold" text-anchor="start" fill="#173f39">Clock: reference to record</text><svg x="25" y="593" width="420" height="132" viewBox="0 0 340 132"><path d="M25 25L315 25" fill="none" stroke="#65756e" stroke-width="1"/><text x="3" y="31" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">0</text><text x="328" y="31" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><path d="M25 105L315 105" fill="none" stroke="#65756e" stroke-width="1"/><text x="3" y="111" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">0</text><text x="328" y="111" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><path d="M25 30L25 96" fill="none" stroke="#16776d" stroke-width="2"/><path d="M21.520275727110157 88.79642318117858L25 96" fill="none" stroke="#16776d" stroke-width="2"/><path d="M28.479724272889843 88.79642318117858L25 96" fill="none" stroke="#16776d" stroke-width="2"/><path d="M170.0 30L242.5 96" fill="none" stroke="#16776d" stroke-width="2"/><path d="M234.8306288494518 93.72387474968109L242.5 96" fill="none" stroke="#16776d" stroke-width="2"/><path d="M239.5155926007092 88.57751305322412L242.5 96" fill="none" stroke="#16776d" stroke-width="2"/><path d="M315 30L315 96" fill="none" stroke="#16776d" stroke-width="2"/><path d="M311.5202757271102 88.79642318117858L315 96" fill="none" stroke="#16776d" stroke-width="2"/><path d="M318.4797242728898 88.79642318117858L315 96" fill="none" stroke="#16776d" stroke-width="2"/><text x="170.0" y="18" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">a</text><text x="242.5" y="130" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">a+δ</text><text x="40" y="72" font-size="25" font-weight="normal" text-anchor="start" fill="#16776d">λ</text></svg><path d="M25 790L875 790" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="25" y="820" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Let a=1/2, 0&lt;δ≤1/4. Left: x=1_[a,1], xδ=1_[a+δ,1]. The piecewise-linear</text><text x="25" y="844" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">increasing continuous homeomorphism λ passes through (0,0),(a,a+δ),(1,1). Thus</text><text x="25" y="868" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">‖λ−id‖∞=δ and xδ∘λ=x. Right: zδ=1_[a+δ,a+δ+δ²), compared with zero. The same λ</text><text x="25" y="892" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">moves its support to [a,a+δ²(1−a)/(1−a−δ)). Every onto time homeomorphism</text><text x="25" y="916" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">preserves supremum 1; the impossibility is not inferred from one chosen clock.</text><text x="25" y="940" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Filled/open endpoints specify right-continuous values; gray dashes are the</text><text x="25" y="964" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">reference, solid lines the record; no vertical interpolation is drawn. As δ→0</text><text x="25" y="988" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">the left converges in J1, while the right cannot tend to zero in J1. Small</text><text x="25" y="1012" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">timing error and small amplitude error are different requirements.</text></svg>