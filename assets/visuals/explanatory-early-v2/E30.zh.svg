<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 659" width="900" height="659" role="img" aria-label="同样在跳点取1，时间规则却不同"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="659" fill="white"/><text x="30" y="45" font-size="26" font-weight="bold" text-anchor="start" fill="#173f39">同样在跳点取1，时间规则却不同</text><text x="25" y="94" font-size="19" font-weight="bold" text-anchor="start" fill="#173f39">可预测规则</text><svg x="25" y="110" width="420" height="275" viewBox="0 0 370 275"><text x="185" y="26" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">同一份到达记录，K=3、λ=1</text><path d="M38 76L332 76" fill="none" stroke="#65756e" stroke-width="1"/><circle cx="106.6" cy="76" r="5" fill="#173f39" stroke="#173f39" stroke-width="2"/><circle cx="243.8" cy="76" r="5" fill="#173f39" stroke="#173f39" stroke-width="2"/><text x="12" y="81" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">N</text><text x="38" y="106" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">0</text><text x="136" y="106" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><text x="234" y="106" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">2</text><text x="332" y="106" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">3</text><text x="12" y="154" font-size="18" font-weight="normal" text-anchor="start" fill="#173f39">H</text><rect x="38" y="130" width="294" height="35" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><circle cx="38" cy="148" r="4" fill="white" stroke="#16776d" stroke-width="2"/><circle cx="332" cy="148" r="4" fill="#16776d" stroke="#16776d" stroke-width="2"/><path d="M106.6 83L106.6 126" fill="none" stroke="#16776d" stroke-width="1" stroke-dasharray="3 4"/><path d="M243.8 83L243.8 126" fill="none" stroke="#16776d" stroke-width="1" stroke-dasharray="3 4"/><text x="185" y="201" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">在整个(0,3]上预先取1</text><text x="185" y="238" font-size="25" font-weight="normal" text-anchor="middle" fill="#173f39">dN: 2     dt: 3</text><text x="185" y="269" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">点表示精确时刻，没有正长度</text></svg><text x="475" y="94" font-size="19" font-weight="bold" text-anchor="start" fill="#173f39">只选已发生的跳点</text><svg x="475" y="110" width="420" height="275" viewBox="0 0 370 275"><text x="185" y="26" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">同一份到达记录，K=3、λ=1</text><path d="M38 76L332 76" fill="none" stroke="#65756e" stroke-width="1"/><circle cx="106.6" cy="76" r="5" fill="#173f39" stroke="#173f39" stroke-width="2"/><circle cx="243.8" cy="76" r="5" fill="#173f39" stroke="#173f39" stroke-width="2"/><text x="12" y="81" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">N</text><text x="38" y="106" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">0</text><text x="136" y="106" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><text x="234" y="106" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">2</text><text x="332" y="106" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">3</text><text x="12" y="154" font-size="18" font-weight="normal" text-anchor="start" fill="#173f39">H</text><path d="M38 148L332 148" fill="none" stroke="#ccd9d1" stroke-width="1"/><circle cx="106.6" cy="148" r="7" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><circle cx="243.8" cy="148" r="7" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><path d="M106.6 83L106.6 126" fill="none" stroke="#a45b30" stroke-width="1" stroke-dasharray="3 4"/><path d="M243.8 83L243.8 126" fill="none" stroke="#a45b30" stroke-width="1" stroke-dasharray="3 4"/><text x="185" y="201" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">只在刚发生的跳点为1</text><text x="185" y="238" font-size="25" font-weight="normal" text-anchor="middle" fill="#173f39">dN: 2     dt: 0</text><text x="185" y="269" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">点表示精确时刻，没有正长度</text></svg><path d="M25 450L875 450" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="25" y="480" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">率1 Poisson过程、通常增广自然滤过、K=3。左规则H≡1在(0,3]可预测，路径收益∫H dN−∫H dt=N₃−3</text><text x="25" y="504" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">，期望0。右规则Hₜ=ΔNₜ适应且可选，但不可预测，不是合法的可预测事前策略；这里只计算路径</text><text x="25" y="528" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Stieltjes收益，未把它定义为可预测随机积分。路径收益N₃−0，期望3。右图圆点是零长度时刻，不是窄</text><text x="25" y="552" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">的正长度区间；有限跳点对dt零测，对dN却各有质量1。三条手选记录只展示路径计算，未赋等概率、不是模</text><text x="25" y="576" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">拟、不能用来估计期望。总体期望来自E N₃=3，且自然滤过和无同时重跳的Poisson模型不可省略；未把此</text><text x="25" y="600" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">结论推广到任意滤过。</text></svg>