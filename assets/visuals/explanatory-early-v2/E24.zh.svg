60.625" cy="151" r="4" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><path d="M260.625 151L315 151" fill="none" stroke="#a45b30" stroke-width="2"/><text x="13" y="58" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">1</text><text x="13" y="157" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">0</text><text x="170" y="187" font-size="15" font-weight="normal" text-anchor="middle" fill="#173f39">灰虚线：参考；实线：当前记录</text></svg><path d="M180 194L180 220" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M176.52027572711015 212.7964231811786L180 220" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M183.47972427288985 212.7964231811786L180 220" fill="none" stroke="#a45b30" stroke-width="2"/><text x="180" y="246" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">同一时钟对齐后</text><svg x="10" y="255" width="340" height="155" viewBox="0 0 340 196"><path d="M25 151L315 151" fill="none" stroke="#b6c3bb" stroke-width="1" stroke-dasharray="4 4"/><path d="M25 151L170.0 151" fill="none" stroke="#a45b30" stroke-width="2"/><circle cx="170.0" cy="151" r="4" fill="white" stroke="#a45b30" stroke-width="2"/><circle cx="170.0" cy="52" r="4" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><path d="M170.0 52L206.25 52" fill="none" stroke="#a45b30" stroke-width="2"/><circle cx="206.25" cy="52" r="4" fill="white" stroke="#a45b30" stroke-width="2"/><circle cx="206.25" cy="151" r="4" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><path d="M206.25 151L315 151" fill="none" stroke="#a45b30" stroke-width="2"/><text x="13" y="58" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">1</text><text x="13" y="157" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">0</text><text x="170" y="187" font-size="15" font-weight="normal" text-anchor="middle" fill="#173f39">灰虚线：参考；实线：当前记录</text></svg></svg><text x="25" y="577" font-size="19" font-weight="bold" text-anchor="start" fill="#173f39">时钟：从参考到原记录</text><svg x="25" y="593" width="420" height="132" viewBox="0 0 340 132"><path d="M25 25L315 25" fill="none" stroke="#65756e" stroke-width="1"/><text x="3" y="31" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">0</text><text x="328" y="31" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><path d="M25 105L315 105" fill="none" stroke="#65756e" stroke-width="1"/><text x="3" y="111" font-size="16" font-weight="normal" text-anchor="start" fill="#65756e">0</text><text x="328" y="111" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><path d="M25 30L25 96" fill="none" stroke="#16776d" stroke-width="2"/><path d="M21.520275727110157 88.79642318117858L25 96" fill="none" stroke="#16776d" stroke-width="2"/><path d="M28.479724272889843 88.79642318117858L25 96" fill="none" stroke="#16776d" stroke-width="2"/><path d="M170.0 30L242.5 96" fill="none" stroke="#16776d" stroke-width="2"/><path d="M234.8306288494518 93.72387474968109L242.5 96" fill="none" stroke="#16776d" stroke-width="2"/><path d="M239.5155926007092 88.57751305322412L242.5 96" fill="none" stroke="#16776d" stroke-width="2"/><path d="M315 30L315 96" fill="none" stroke="#16776d" stroke-width="2"/><path d="M311.5202757271102 88.79642318117858L315 96" fill="none" stroke="#16776d" stroke-width="2"/><path d="M318.4797242728898 88.79642318117858L315 96" fill="none" stroke="#16776d" stroke-width="2"/><text x="170.0" y="18" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">a</text><text x="242.5" y="130" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">a+δ</text><text x="40" y="72" font-size="25" font-weight="normal" text-anchor="start" fill="#16776d">λ</text></svg><path d="M25 790L875 790" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="25" y="820" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">a=1/2，0&lt;δ≤1/4。左x=1_[a,1]、xδ=1_[a+δ,1]；λ是经过(0,0),(a,a+δ),(1,1)的递增分段线性连续</text><text x="25" y="844" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">同胚。‖λ−id‖∞=δ，xδ∘λ=x。右zδ=1_[a+δ,a+δ+δ²)，参考是零函数；同一λ将其支撑变为</text><text x="25" y="868" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">[a,a+δ²(1−a)/(1−a−δ))。任何满射时间同胚都保留其上确界1，故不仅这幅图中的λ不能删除它。所有</text><text x="25" y="892" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">端点用实心/空心区别右连续取值；灰虚线是参考，实线是当前，不画竖直插值。δ→0时，左在J₁收敛，右</text><text x="25" y="916" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">不在J₁趋零。把发生时刻接近与振幅小分开，才是两场景的差别。</text></svg>