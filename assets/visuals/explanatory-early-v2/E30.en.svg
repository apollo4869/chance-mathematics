<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 779" width="900" height="779" role="img" aria-label="Same value at arrivals, different time rules"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="779" fill="white"/><text x="30" y="45" font-size="26" font-weight="bold" text-anchor="start" fill="#173f39">Same value at arrivals, different time rules</text><text x="25" y="94" font-size="19" font-weight="bold" text-anchor="start" fill="#173f39">Predictable rule</text><svg x="25" y="110" width="420" height="275" viewBox="0 0 370 275"><text x="185" y="26" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Same arrivals, K=3 and λ=1</text><path d="M38 76L332 76" fill="none" stroke="#65756e" stroke-width="1"/><circle cx="106.6" cy="76" r="5" fill="#173f39" stroke="#173f39" stroke-width="2"/><circle cx="243.8" cy="76" r="5" fill="#173f39" stroke="#173f39" stroke-width="2"/><text x="12" y="81" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">N</text><text x="38" y="106" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">0</text><text x="136" y="106" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><text x="234" y="106" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">2</text><text x="332" y="106" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">3</text><text x="12" y="154" font-size="18" font-weight="normal" text-anchor="start" fill="#173f39">H</text><rect x="38" y="130" width="294" height="35" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><circle cx="38" cy="148" r="4" fill="white" stroke="#16776d" stroke-width="2"/><circle cx="332" cy="148" r="4" fill="#16776d" stroke="#16776d" stroke-width="2"/><path d="M106.6 83L106.6 126" fill="none" stroke="#16776d" stroke-width="1" stroke-dasharray="3 4"/><path d="M243.8 83L243.8 126" fill="none" stroke="#16776d" stroke-width="1" stroke-dasharray="3 4"/><text x="185" y="201" font-size="18" font-weight="normal" text-anchor="middle" fill="#16776d">Choose 1 throughout (0,3] in advance</text><text x="185" y="238" font-size="25" font-weight="normal" text-anchor="middle" fill="#173f39">dN: 2     dt: 3</text><text x="185" y="269" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">Dots are exact instants, not intervals</text></svg><text x="475" y="94" font-size="19" font-weight="bold" text-anchor="start" fill="#173f39">Jump-only rule</text><svg x="475" y="110" width="420" height="275" viewBox="0 0 370 275"><text x="185" y="26" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Same arrivals, K=3 and λ=1</text><path d="M38 76L332 76" fill="none" stroke="#65756e" stroke-width="1"/><circle cx="106.6" cy="76" r="5" fill="#173f39" stroke="#173f39" stroke-width="2"/><circle cx="243.8" cy="76" r="5" fill="#173f39" stroke="#173f39" stroke-width="2"/><text x="12" y="81" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">N</text><text x="38" y="106" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">0</text><text x="136" y="106" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><text x="234" y="106" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">2</text><text x="332" y="106" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">3</text><text x="12" y="154" font-size="18" font-weight="normal" text-anchor="start" fill="#173f39">H</text><path d="M38 148L332 148" fill="none" stroke="#ccd9d1" stroke-width="1"/><circle cx="106.6" cy="148" r="7" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><circle cx="243.8" cy="148" r="7" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><path d="M106.6 83L106.6 126" fill="none" stroke="#a45b30" stroke-width="1" stroke-dasharray="3 4"/><path d="M243.8 83L243.8 126" fill="none" stroke="#a45b30" stroke-width="1" stroke-dasharray="3 4"/><text x="185" y="201" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">1 only at the just-observed jumps</text><text x="185" y="238" font-size="25" font-weight="normal" text-anchor="middle" fill="#173f39">dN: 2     dt: 0</text><text x="185" y="269" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">Dots are exact instants, not intervals</text></svg><path d="M25 450L875 450" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="25" y="480" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Rate-one Poisson process with its usual augmented natural filtration and K=3.</text><text x="25" y="504" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">The predictable choice H≡1 on (0,3] gives pathwise payoff N3−3, of expectation</text><text x="25" y="528" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">0. Ht=ΔNt is adapted and optional but not predictable, so it is not a legitimate</text><text x="25" y="552" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">strategy chosen beforehand. Only its pathwise Stieltjes payoff is computed here,</text><text x="25" y="576" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">not a predictable stochastic integral; it gives N3−0, of expectation 3. Dots</text><text x="25" y="600" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">denote zero-duration instants, not narrow positive-length intervals. Finitely</text><text x="25" y="624" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">many jumps have zero dt mass but unit dN mass each. The three hand-chosen</text><text x="25" y="648" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">records illustrate pathwise calculations only; they are not equiprobable or</text><text x="25" y="672" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">simulated estimates of expectations. Expectations use E N3=3. The natural</text><text x="25" y="696" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">filtration and simple Poisson jumps matter; no assertion for every filtration is</text><text x="25" y="720" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">made.</text></svg>