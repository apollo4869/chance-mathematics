<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 778" width="900" height="778" role="img" aria-label="Compress the past, preserve the prediction"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="778" fill="white"/><text x="30" y="45" font-size="26" font-weight="bold" text-anchor="start" fill="#173f39">Compress the past, preserve the prediction</text><text x="25" y="94" font-size="19" font-weight="bold" text-anchor="start" fill="#173f39">Last bit: information lost</text><svg x="25" y="110" width="420" height="370" viewBox="0 0 390 370"><text x="33" y="24" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">History</text><text x="180" y="24" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">Retained state</text><text x="326" y="24" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">Next is 1</text><text x="33" y="72" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">00</text><path d="M58 65L133 105" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M125.00638550203294 104.68042644369272L133 105" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M128.28142011181163 98.5397365503577L133 105" fill="none" stroke="#a45b30" stroke-width="2"/><text x="33" y="147" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">10</text><path d="M58 140L133 105" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M127.94376495748833 111.19955540300084L133 105" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M125.00071532075827 104.89302046715073L133 105" fill="none" stroke="#a45b30" stroke-width="2"/><text x="33" y="237" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">01</text><path d="M58 230L133 265" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M125.00071532075827 265.10697953284927L133 265" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M127.94376495748833 258.80044459699917L133 265" fill="none" stroke="#a45b30" stroke-width="2"/><text x="33" y="312" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">11</text><path d="M58 305L133 265" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M128.28142011181163 271.4602634496423L133 265" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M125.00638550203294 265.31957355630726L133 265" fill="none" stroke="#a45b30" stroke-width="2"/><circle cx="178" cy="105" r="33" fill="#f3e9df" stroke="#a45b30" stroke-width="2"/><text x="178" y="114" font-size="27" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><circle cx="178" cy="265" r="33" fill="#f3e9df" stroke="#a45b30" stroke-width="2"/><text x="178" y="274" font-size="27" font-weight="normal" text-anchor="middle" fill="#173f39">1</text><path d="M215 105L278 65" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M273.78380865754957 71.79880361268407L278 65" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M270.05348761030837 65.92354796327916L278 65" fill="none" stroke="#a45b30" stroke-width="2"/><text x="327" y="73" font-size="25" font-weight="normal" text-anchor="middle" fill="#a45b30">3/10</text><path d="M215 105L278 140" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M270.01303741414716 139.54346013078052L278 140" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M273.3928444053065 133.45980754669375L278 140" fill="none" stroke="#a45b30" stroke-width="2"/><text x="327" y="148" font-size="25" font-weight="normal" text-anchor="middle" fill="#a45b30">1/2</text><path d="M215 265L278 230" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M273.3928444053065 236.54019245330625L278 230" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M270.01303741414716 230.45653986921948L278 230" fill="none" stroke="#a45b30" stroke-width="2"/><text x="327" y="238" font-size="25" font-weight="normal" text-anchor="middle" fill="#a45b30">1/2</text><path d="M215 265L278 305" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M270.05348761030837 304.0764520367208L278 305" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M273.78380865754957 298.2011963873159L278 305" fill="none" stroke="#a45b30" stroke-width="2"/><text x="327" y="313" font-size="25" font-weight="normal" text-anchor="middle" fill="#a45b30">7/10</text><text x="195" y="361" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">Merge histories only when predictions agree</text></svg><text x="475" y="94" font-size="19" font-weight="bold" text-anchor="start" fill="#173f39">Posterior: prediction retained</text><svg x="475" y="110" width="420" height="370" viewBox="0 0 390 370"><text x="33" y="24" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">History</text><text x="180" y="24" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">Retained state</text><text x="326" y="24" font-size="17" font-weight="normal" text-anchor="middle" fill="#173f39">Next is 1</text><text x="33" y="72" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">00</text><path d="M58 65L133 65" fill="none" stroke="#16776d" stroke-width="2"/><path d="M125.79642318117858 68.47972427288984L133 65" fill="none" stroke="#16776d" stroke-width="2"/><path d="M125.79642318117858 61.52027572711016L133 65" fill="none" stroke="#16776d" stroke-width="2"/><text x="33" y="147" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">10</text><path d="M58 140L133 185" fill="none" stroke="#16776d" stroke-width="2"/><path d="M125.0326804695738 184.2776292502535L133 185" fill="none" stroke="#16776d" stroke-width="2"/><path d="M128.61328720649374 178.309951355387L133 185" fill="none" stroke="#16776d" stroke-width="2"/><text x="33" y="237" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">01</text><path d="M58 230L133 185" fill="none" stroke="#16776d" stroke-width="2"/><path d="M128.61328720649374 191.690048644613L133 185" fill="none" stroke="#16776d" stroke-width="2"/><path d="M125.0326804695738 185.7223707497465L133 185" fill="none" stroke="#16776d" stroke-width="2"/><text x="33" y="312" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">11</text><path d="M58 305L133 305" fill="none" stroke="#16776d" stroke-width="2"/><path d="M125.79642318117858 308.4797242728898L133 305" fill="none" stroke="#16776d" stroke-width="2"/><path d="M125.79642318117858 301.5202757271102L133 305" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="178" cy="65" r="35" fill="#eaf2ee" stroke="#16776d" stroke-width="2"/><text x="178" y="72" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">1/10</text><path d="M215 65L279 65" fill="none" stroke="#16776d" stroke-width="2"/><path d="M271.79642318117857 68.47972427288984L279 65" fill="none" stroke="#16776d" stroke-width="2"/><path d="M271.79642318117857 61.52027572711016L279 65" fill="none" stroke="#16776d" stroke-width="2"/><text x="327" y="73" font-size="26" font-weight="normal" text-anchor="middle" fill="#173f39">3/10</text><circle cx="178" cy="185" r="35" fill="#eaf2ee" stroke="#16776d" stroke-width="2"/><text x="178" y="192" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">1/2</text><path d="M215 185L279 185" fill="none" stroke="#16776d" stroke-width="2"/><path d="M271.79642318117857 188.47972427288985L279 185" fill="none" stroke="#16776d" stroke-width="2"/><path d="M271.79642318117857 181.52027572711015L279 185" fill="none" stroke="#16776d" stroke-width="2"/><text x="327" y="193" font-size="26" font-weight="normal" text-anchor="middle" fill="#173f39">1/2</text><circle cx="178" cy="305" r="35" fill="#eaf2ee" stroke="#16776d" stroke-width="2"/><text x="178" y="312" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">9/10</text><path d="M215 305L279 305" fill="none" stroke="#16776d" stroke-width="2"/><path d="M271.79642318117857 308.4797242728898L279 305" fill="none" stroke="#16776d" stroke-width="2"/><path d="M271.79642318117857 301.5202757271102L279 305" fill="none" stroke="#16776d" stroke-width="2"/><text x="327" y="313" font-size="26" font-weight="normal" text-anchor="middle" fill="#173f39">7/10</text><text x="195" y="361" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">Merge histories only when predictions agree</text></svg><path d="M25 545L875 545" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="25" y="575" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Choose Θ=1/4 or 3/4 with equal probability, then sample conditionally iid</text><text x="25" y="599" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Bernoulli(Θ). For histories 00,10,01,11, q=P(Θ=3/4|history) equals</text><text x="25" y="623" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">1/10,1/2,1/2,9/10; w(q)=1/4+q/2 gives predictions 3/10,1/2,1/2,7/10. Arrows are</text><text x="25" y="647" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">information maps, not equiprobable histories. The last bit cannot recover the</text><text x="25" y="671" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">original forecast; the posterior updates via the text’s T0,T1 and Markov kernel.</text><text x="25" y="695" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">No universal one-dimensional or unique minimal state is claimed, nor is future</text><text x="25" y="719" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">independence inferred from the picture.</text></svg>