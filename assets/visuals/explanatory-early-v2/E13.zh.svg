 font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">局部近似 0.399；精确 0.375</text></svg><path d="M25 710L875 710" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="25" y="740" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Xⱼ独立公平取±1，均值0、方差1、最大跨度h=2，a=−1。Sₙ支撑在−n+2ℤ；圆的面积按精确二项概率缩放</text><text x="25" y="764" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">，圆中为分子，分母2ⁿ。下排相邻允许格子的宽度为2。右图在k=n mod 2处，展示φ(k/√n)乘h/√n的矩形</text><text x="25" y="788" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">，坐标已标准化；有限n时只是局部近似，并非精确等式。h=1会少一半，奇偶不允许位置的概率严格为0。切</text><text x="25" y="812" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">换n展示格子的平移，不宣称只用三帧证明局部CLT；一般有限方差一致误差见正文。</text></svg>