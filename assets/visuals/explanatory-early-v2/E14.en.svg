<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" role="img" aria-label="Dispersed variance can still leave jumps"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="770" fill="white"/><text x="30" y="45" font-size="26" font-weight="bold" text-anchor="start" fill="#173f39">Dispersed variance can still leave jumps</text><text x="25" y="94" font-size="19" font-weight="bold" text-anchor="start" fill="#173f39">Fixed-size rare jumps</text><svg x="25" y="110" width="420" height="290" viewBox="0 0 360 290"><rect x="125" y="45" width="110" height="100" fill="#eff3ee"/><path d="M30 95L330 95" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M70 95L70 95" fill="none" stroke="#65756e" stroke-width="1"/><circle cx="70" cy="95" r="5.12652416360247" fill="#f1e6db" stroke="#a45b30" stroke-width="2"/><path d="M180 95L180 95" fill="none" stroke="#65756e" stroke-width="1"/><circle cx="180" cy="95" r="28.079129260003775" fill="#e9eeea" stroke="#16776d" stroke-width="2"/><path d="M290 95L290 95" fill="none" stroke="#65756e" stroke-width="1"/><circle cx="290" cy="95" r="5.12652416360247" fill="#f1e6db" stroke="#a45b30" stroke-width="2"/><text x="70" y="173" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">−1</text><text x="125" y="173" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">−1/2</text><text x="180" y="173" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">0</text><text x="235" y="173" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">1/2</text><text x="290" y="173" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><text x="180" y="25" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">Probability atoms of one increment</text><text x="180" y="207" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Each nonzero atom: 1/32</text><rect x="28" y="228" width="60" height="38" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="58" y="254" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">Xₙ₁</text><rect x="110" y="228" width="60" height="38" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="140" y="254" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">Xₙ₂</text><rect x="272" y="228" width="60" height="38" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="302" y="254" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">Xₙₙ</text><text x="230" y="254" font-size="24" font-weight="normal" text-anchor="middle" fill="#65756e">…</text><text x="180" y="291" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">Exactly n=16 terms; middle terms omitted</text></svg><text x="475" y="94" font-size="19" font-weight="bold" text-anchor="start" fill="#173f39">Small increments</text><svg x="475" y="110" width="420" height="290" viewBox="0 0 360 290"><rect x="125" y="45" width="110" height="100" fill="#eff3ee"/><path d="M30 95L330 95" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M152.5 65L152.5 95" fill="none" stroke="#65756e" stroke-width="1"/><circle cx="152.5" cy="65" r="20.50609665440988" fill="#f1e6db" stroke="#a45b30" stroke-width="2"/><path d="M207.5 125L207.5 95" fill="none" stroke="#65756e" stroke-width="1"/><circle cx="207.5" cy="125" r="20.50609665440988" fill="#f1e6db" stroke="#a45b30" stroke-width="2"/><text x="70" y="173" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">−1</text><text x="125" y="173" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">−1/2</text><text x="180" y="173" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">0</text><text x="235" y="173" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">1/2</text><text x="290" y="173" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><text x="180" y="25" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">Probability atoms of one increment</text><text x="180" y="207" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Two atoms, probability 1/2 each</text><rect x="28" y="228" width="60" height="38" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="58" y="254" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">Yₙ₁</text><rect x="110" y="228" width="60" height="38" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="140" y="254" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">Yₙ₂</text><rect x="272" y="228" width="60" height="38" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="302" y="254" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">Yₙₙ</text><text x="230" y="254" font-size="24" font-weight="normal" text-anchor="middle" fill="#65756e">…</text><text x="180" y="291" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">Exactly n=16 terms; middle terms omitted</text></svg><path d="M25 465L875 465" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="25" y="495" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Terms are independent within each row. Left: P(Xnk=±1)=1/(2n), P(0)=1−1/n.</text><text x="25" y="519" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Right: P(Ynk=±1/√n)=1/2. Both are centered with total variance 1 and maximal</text><text x="25" y="543" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">variance 1/n→0. At fixed ε=1/2, their Lindeberg quantities are 1 and 0 for all</text><text x="25" y="567" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">displayed n≥4 (strict &gt;). On the left, the probability of at least one nonzero</text><text x="25" y="591" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">term tends to 1−e⁻1; cancellation means this is not the probability of a nonzero</text><text x="25" y="615" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">sum. Its sum tends to compound Poisson with rate 1 and fair ±1 marks; the right</text><text x="25" y="639" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">sum tends to a standard Gaussian. Disk areas are probabilities and horizontal</text><text x="25" y="663" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">positions are values. Boxes label terms 1, 2 and n, with an ellipsis for the</text><text x="25" y="687" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">omitted middle terms; each row has exactly n terms. Shading marks a threshold,</text><text x="25" y="711" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">not density.</text></svg>