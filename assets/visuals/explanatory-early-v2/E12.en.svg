20" font-weight="bold" text-anchor="middle" fill="#16776d">−</text><text x="230" y="117" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">−</text><text x="247" y="117" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">+</text><rect x="270" y="94" width="78" height="34" fill="#eaf2ee" stroke="#ccd9d1" stroke-width="1.5"/><text x="282" y="117" font-size="20" font-weight="bold" text-anchor="middle" fill="#16776d">−</text><text x="299" y="117" font-size="20" font-weight="bold" text-anchor="middle" fill="#16776d">−</text><text x="316" y="117" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">−</text><text x="333" y="117" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">−</text><text x="12" y="175" font-size="19" font-weight="bold" text-anchor="start" fill="#173f39">First crossing: step 4</text><text x="344" y="175" font-size="20" font-weight="normal" text-anchor="end" fill="#16776d">4/16</text><rect x="12" y="190" width="78" height="34" fill="#eaf2ee" stroke="#ccd9d1" stroke-width="1.5"/><text x="24" y="213" font-size="20" font-weight="bold" text-anchor="middle" fill="#16776d">+</text><text x="41" y="213" font-size="20" font-weight="bold" text-anchor="middle" fill="#16776d">−</text><text x="58" y="213" font-size="20" font-weight="bold" text-anchor="middle" fill="#16776d">+</text><text x="75" y="213" font-size="20" font-weight="bold" text-anchor="middle" fill="#16776d">+</text><rect x="98" y="190" width="78" height="34" fill="#eaf2ee" stroke="#ccd9d1" stroke-width="1.5"/><text x="110" y="213" font-size="20" font-weight="bold" text-anchor="middle" fill="#16776d">+</text><text x="127" y="213" font-size="20" font-weight="bold" text-anchor="middle" fill="#16776d">−</text><text x="144" y="213" font-size="20" font-weight="bold" text-anchor="middle" fill="#16776d">−</text><text x="161" y="213" font-size="20" font-weight="bold" text-anchor="middle" fill="#16776d">−</text><rect x="184" y="190" width="78" height="34" fill="#eaf2ee" stroke="#ccd9d1" stroke-width="1.5"/><text x="196" y="213" font-size="20" font-weight="bold" text-anchor="middle" fill="#16776d">−</text><text x="213" y="213" font-size="20" font-weight="bold" text-anchor="middle" fill="#16776d">+</text><text x="230" y="213" font-size="20" font-weight="bold" text-anchor="middle" fill="#16776d">+</text><text x="247" y="213" font-size="20" font-weight="bold" text-anchor="middle" fill="#16776d">+</text><rect x="270" y="190" width="78" height="34" fill="#eaf2ee" stroke="#ccd9d1" stroke-width="1.5"/><text x="282" y="213" font-size="20" font-weight="bold" text-anchor="middle" fill="#16776d">−</text><text x="299" y="213" font-size="20" font-weight="bold" text-anchor="middle" fill="#16776d">+</text><text x="316" y="213" font-size="20" font-weight="bold" text-anchor="middle" fill="#16776d">−</text><text x="333" y="213" font-size="20" font-weight="bold" text-anchor="middle" fill="#16776d">−</text><text x="12" y="314" font-size="19" font-weight="bold" text-anchor="start" fill="#173f39">No crossing</text><text x="344" y="314" font-size="20" font-weight="normal" text-anchor="end" fill="#16776d">4/16</text><rect x="12" y="329" width="78" height="34" fill="#f5f4ed" stroke="#ccd9d1" stroke-width="1.5"/><text x="24" y="352" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">+</text><text x="41" y="352" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">−</text><text x="58" y="352" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">+</text><text x="75" y="352" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">−</text><rect x="98" y="329" width="78" height="34" fill="#f5f4ed" stroke="#ccd9d1" stroke-width="1.5"/><text x="110" y="352" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">+</text><text x="127" y="352" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">−</text><text x="144" y="352" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">−</text><text x="161" y="352" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">+</text><rect x="184" y="329" width="78" height="34" fill="#f5f4ed" stroke="#ccd9d1" stroke-width="1.5"/><text x="196" y="352" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">−</text><text x="213" y="352" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">+</text><text x="230" y="352" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">+</text><text x="247" y="352" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">−</text><rect x="270" y="329" width="78" height="34" fill="#f5f4ed" stroke="#ccd9d1" stroke-width="1.5"/><text x="282" y="352" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">−</text><text x="299" y="352" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">+</text><text x="316" y="352" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">−</text><text x="333" y="352" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">+</text><text x="180" y="442" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">Dark: through first crossing; pale: future</text></svg><text x="475" y="94" font-size="19" font-weight="bold" text-anchor="start" fill="#173f39">One prefix, four futures</text><svg x="475" y="110" width="420" height="300" viewBox="0 0 360 300"><text x="180" y="30" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">After ++, S₂=2</text><text x="180" y="53" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">Read terminal square S₄² below</text><text x="45" y="78" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">++</text><path d="M45 90L45 122" fill="none" stroke="#16776d" stroke-width="2"/><path d="M41.52027572711016 114.79642318117858L45 122" fill="none" stroke="#16776d" stroke-width="2"/><path d="M48.47972427288984 114.79642318117858L45 122" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="45" cy="153" r="25" fill="white" stroke="#16776d" stroke-width="2"/><text x="45" y="161" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">16</text><text x="45" y="207" font-size="18" font-weight="normal" text-anchor="middle" fill="#65756e">1/4</text><text x="133" y="78" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">+−</text><path d="M133 90L133 122" fill="none" stroke="#16776d" stroke-width="2"/><path d="M129.52027572711015 114.79642318117858L133 122" fill="none" stroke="#16776d" stroke-width="2"/><path d="M136.47972427288985 114.79642318117858L133 122" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="133" cy="153" r="25" fill="white" stroke="#16776d" stroke-width="2"/><text x="133" y="161" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">4</text><text x="133" y="207" font-size="18" font-weight="normal" text-anchor="middle" fill="#65756e">1/4</text><text x="221" y="78" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">−+</text><path d="M221 90L221 122" fill="none" stroke="#16776d" stroke-width="2"/><path d="M217.52027572711015 114.79642318117858L221 122" fill="none" stroke="#16776d" stroke-width="2"/><path d="M224.47972427288985 114.79642318117858L221 122" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="221" cy="153" r="25" fill="white" stroke="#16776d" stroke-width="2"/><text x="221" y="161" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">4</text><text x="221" y="207" font-size="18" font-weight="normal" text-anchor="middle" fill="#65756e">1/4</text><text x="309" y="78" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">−−</text><path d="M309 90L309 122" fill="none" stroke="#16776d" stroke-width="2"/><path d="M305.5202757271102 114.79642318117858L309 122" fill="none" stroke="#16776d" stroke-width="2"/><path d="M312.4797242728898 114.79642318117858L309 122" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="309" cy="153" r="25" fill="white" stroke="#16776d" stroke-width="2"/><text x="309" y="161" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><text x="309" y="207" font-size="18" font-weight="normal" text-anchor="middle" fill="#65756e">1/4</text><text x="180" y="251" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">(16 + 4 + 4 + 0) / 4 = 6</text><text x="180" y="284" font-size="16" font-weight="normal" text-anchor="middle" fill="#a45b30">An endpoint may be 0; mean square is ≥4</text></svg><path d="M25 625L875 625" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="25" y="655" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Exact finite model: four independent fair ±1 increments, S0=0, threshold u=2.</text><text x="25" y="679" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">The 16 equiprobable records split into 8 first crossing at step 2, 4 at step 4,</text><text x="25" y="703" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">and 4 never crossing. Dark signs mark information through the first crossing.</text><text x="25" y="727" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Given ++, the four equiprobable futures give S4²=16,4,4,0, with mean 6≥S2²=4.</text><text x="25" y="751" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">This is not a pathwise inequality. The general proof cancels the cross term</text><text x="25" y="775" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">using an independent centered future and sums disjoint events; no optional</text><text x="25" y="799" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">stopping is used.</text></svg>