 y="352" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">+</text><rect x="184" y="329" width="78" height="34" fill="#f5f4ed" stroke="#ccd9d1" stroke-width="1.5"/><text x="196" y="352" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">−</text><text x="213" y="352" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">+</text><text x="230" y="352" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">+</text><text x="247" y="352" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">−</text><rect x="270" y="329" width="78" height="34" fill="#f5f4ed" stroke="#ccd9d1" stroke-width="1.5"/><text x="282" y="352" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">−</text><text x="299" y="352" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">+</text><text x="316" y="352" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">−</text><text x="333" y="352" font-size="20" font-weight="normal" text-anchor="middle" fill="#65756e">+</text><text x="180" y="442" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">深色到首次越界为止；浅色是未来</text></svg><text x="475" y="94" font-size="19" font-weight="bold" text-anchor="start" fill="#173f39">一个前缀，四种未来</text><svg x="475" y="110" width="420" height="300" viewBox="0 0 360 300"><text x="180" y="30" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">已经看到 ++，S₂=2</text><text x="180" y="53" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">下读终点平方 S₄²</text><text x="45" y="78" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">++</text><path d="M45 90L45 122" fill="none" stroke="#16776d" stroke-width="2"/><path d="M41.52027572711016 114.79642318117858L45 122" fill="none" stroke="#16776d" stroke-width="2"/><path d="M48.47972427288984 114.79642318117858L45 122" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="45" cy="153" r="25" fill="white" stroke="#16776d" stroke-width="2"/><text x="45" y="161" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">16</text><text x="45" y="207" font-size="18" font-weight="normal" text-anchor="middle" fill="#65756e">1/4</text><text x="133" y="78" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">+−</text><path d="M133 90L133 122" fill="none" stroke="#16776d" stroke-width="2"/><path d="M129.52027572711015 114.79642318117858L133 122" fill="none" stroke="#16776d" stroke-width="2"/><path d="M136.47972427288985 114.79642318117858L133 122" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="133" cy="153" r="25" fill="white" stroke="#16776d" stroke-width="2"/><text x="133" y="161" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">4</text><text x="133" y="207" font-size="18" font-weight="normal" text-anchor="middle" fill="#65756e">1/4</text><text x="221" y="78" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">−+</text><path d="M221 90L221 122" fill="none" stroke="#16776d" stroke-width="2"/><path d="M217.52027572711015 114.79642318117858L221 122" fill="none" stroke="#16776d" stroke-width="2"/><path d="M224.47972427288985 114.79642318117858L221 122" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="221" cy="153" r="25" fill="white" stroke="#16776d" stroke-width="2"/><text x="221" y="161" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">4</text><text x="221" y="207" font-size="18" font-weight="normal" text-anchor="middle" fill="#65756e">1/4</text><text x="309" y="78" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">−−</text><path d="M309 90L309 122" fill="none" stroke="#16776d" stroke-width="2"/><path d="M305.5202757271102 114.79642318117858L309 122" fill="none" stroke="#16776d" stroke-width="2"/><path d="M312.4797242728898 114.79642318117858L309 122" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="309" cy="153" r="25" fill="white" stroke="#16776d" stroke-width="2"/><text x="309" y="161" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><text x="309" y="207" font-size="18" font-weight="normal" text-anchor="middle" fill="#65756e">1/4</text><text x="180" y="251" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">(16 + 4 + 4 + 0) / 4 = 6</text><text x="180" y="284" font-size="16" font-weight="normal" text-anchor="middle" fill="#a45b30">终点可回0，条件平方均值仍≥4</text></svg><path d="M25 625L875 625" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="25" y="655" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">有限精确模型：4次独立公平±1增量，S₀=0，阈值u=2。16条记录等概率；首次越界第2步、第4步及不越界分</text><text x="25" y="679" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">别8、4、4条。每条记录归属唯一一格，深色标出截至首次越界的信息。给定前缀++，四种未来各1/4，S₄²</text><text x="25" y="703" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">依次16、4、4、0，均值6≥S₂²=4；不是每条路径上S₄²≥S₂²。一般证明用Aₖ与未来独立、未来均值0消</text><text x="25" y="727" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">去交叉项，再把互斥事件求和；图不借用可选停止。</text></svg>