<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" role="img" aria-label="方差分散了，大跳仍可能留下"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="650" fill="white"/><text x="30" y="45" font-size="26" font-weight="bold" text-anchor="start" fill="#173f39">方差分散了，大跳仍可能留下</text><text x="25" y="94" font-size="19" font-weight="bold" text-anchor="start" fill="#173f39">大小不缩的稀有跳跃</text><svg x="25" y="110" width="420" height="290" viewBox="0 0 360 290"><rect x="125" y="45" width="110" height="100" fill="#eff3ee"/><path d="M30 95L330 95" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M70 95L70 95" fill="none" stroke="#65756e" stroke-width="1"/><circle cx="70" cy="95" r="5.12652416360247" fill="#f1e6db" stroke="#a45b30" stroke-width="2"/><path d="M180 95L180 95" fill="none" stroke="#65756e" stroke-width="1"/><circle cx="180" cy="95" r="28.079129260003775" fill="#e9eeea" stroke="#16776d" stroke-width="2"/><path d="M290 95L290 95" fill="none" stroke="#65756e" stroke-width="1"/><circle cx="290" cy="95" r="5.12652416360247" fill="#f1e6db" stroke="#a45b30" stroke-width="2"/><text x="70" y="173" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">−1</text><text x="125" y="173" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">−1/2</text><text x="180" y="173" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">0</text><text x="235" y="173" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">1/2</text><text x="290" y="173" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><text x="180" y="25" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">一份增量的概率原子</text><text x="180" y="207" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">每个非零原子：1/32</text><rect x="28" y="228" width="60" height="38" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="58" y="254" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">Xₙ₁</text><rect x="110" y="228" width="60" height="38" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="140" y="254" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">Xₙ₂</text><rect x="272" y="228" width="60" height="38" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="302" y="254" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">Xₙₙ</text><text x="230" y="254" font-size="24" font-weight="normal" text-anchor="middle" fill="#65756e">…</text><text x="180" y="291" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">一行恰有 n=16 项；省略中间项</text></svg><text x="475" y="94" font-size="19" font-weight="bold" text-anchor="start" fill="#173f39">真正变小的增量</text><svg x="475" y="110" width="420" height="290" viewBox="0 0 360 290"><rect x="125" y="45" width="110" height="100" fill="#eff3ee"/><path d="M30 95L330 95" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M152.5 65L152.5 95" fill="none" stroke="#65756e" stroke-width="1"/><circle cx="152.5" cy="65" r="20.50609665440988" fill="#f1e6db" stroke="#a45b30" stroke-width="2"/><path d="M207.5 125L207.5 95" fill="none" stroke="#65756e" stroke-width="1"/><circle cx="207.5" cy="125" r="20.50609665440988" fill="#f1e6db" stroke="#a45b30" stroke-width="2"/><text x="70" y="173" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">−1</text><text x="125" y="173" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">−1/2</text><text x="180" y="173" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">0</text><text x="235" y="173" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">1/2</text><text x="290" y="173" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><text x="180" y="25" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">一份增量的概率原子</text><text x="180" y="207" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">两个原子：各1/2</text><rect x="28" y="228" width="60" height="38" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="58" y="254" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">Yₙ₁</text><rect x="110" y="228" width="60" height="38" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="140" y="254" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">Yₙ₂</text><rect x="272" y="228" width="60" height="38" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="302" y="254" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">Yₙₙ</text><text x="230" y="254" font-size="24" font-weight="normal" text-anchor="middle" fill="#65756e">…</text><text x="180" y="291" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">一行恰有 n=16 项；省略中间项</text></svg><path d="M25 465L875 465" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="25" y="495" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">每行内部独立。左：P(Xₙₖ=±1)=1/(2n)，P(0)=1−1/n。右：P(Yₙₖ=±1/√n)=1/2。两者均中心化、总方</text><text x="25" y="519" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">差1，Feller最大方差1/n→0；固定ε=1/2，所有所示n≥4时Lindeberg量分别1与0（使用严格&gt;）。左整行</text><text x="25" y="543" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">有至少一笔非零的概率1−(1−1/n)ⁿ→1−e⁻¹，但非零项可能互相抵消；不把这个概率等同于总和非零。</text><text x="25" y="567" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">左总和趋于带±1标记、强度1的复合Poisson，右趋于标准Gaussian。圆面积表示概率，横位置表示取值；方</text><text x="25" y="591" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">框只列第1、第2与第n项，中间项由省略号表示；一行恰有n项。阴影只标阈值，不是概率密度。</text></svg>