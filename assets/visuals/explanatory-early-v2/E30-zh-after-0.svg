<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 275" width="370" height="275" role="img" aria-label="The same arrival weights but different Lebesgue-time costs"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><text x="185" y="26" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">同一份到达记录，K=3、λ=1</text><path d="M38 76L332 76" fill="none" stroke="#65756e" stroke-width="1"/><text x="12" y="81" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">N</text><text x="38" y="106" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">0</text><text x="136" y="106" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><text x="234" y="106" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">2</text><text x="332" y="106" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">3</text><text x="12" y="154" font-size="18" font-weight="normal" text-anchor="start" fill="#173f39">H</text><path d="M38 148L332 148" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="185" y="201" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">只在刚发生的跳点为1</text><text x="185" y="238" font-size="25" font-weight="normal" text-anchor="middle" fill="#173f39">dN: 0     dt: 0</text><text x="185" y="269" font-size="16" font-weight="normal" text-anchor="middle" fill="#65756e">点表示精确时刻，没有正长度</text></svg>