<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 840" width="900" height="840" role="img" aria-label="一段运动，两份累计"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="840" fill="white"/><text x="30" y="43" font-size="27" font-weight="bold" text-anchor="start" fill="#173f39">一段运动，两份累计</text><path d="M30 64L870 64" fill="none" stroke="#ccd9d1" stroke-width="1"/><svg x="135" y="100" width="630" height="457" viewBox="0 0 400 290"><path d="M40 58L360 58" fill="none" stroke="#65756e" stroke-width="1"/><circle cx="200.0" cy="58" r="20" fill="white" stroke="#16776d" stroke-width="2"/><path d="M200.0 58L200.0 45" fill="none" stroke="#16776d" stroke-width="1.5"/><path d="M200.0 58L211.0 64" fill="none" stroke="#16776d" stroke-width="1.5"/><text x="200.0" y="26" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">x=1/2</text><text x="245.0" y="35" font-size="22" font-weight="normal" text-anchor="start" fill="#173f39">τ</text><text x="200" y="285" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">同一段路径：沿途累计，退出时结算</text><path d="M200.0 81 Q70 112 70 174" fill="none" stroke="#16776d" stroke-width="2"/><path d="M70 153L70 176" fill="none" stroke="#16776d" stroke-width="2"/><path d="M66.52027572711016 168.7964231811786L70 176" fill="none" stroke="#16776d" stroke-width="2"/><path d="M73.47972427288984 168.7964231811786L70 176" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="70" cy="205" r="26" fill="white" stroke="#16776d" stroke-width="2"/><text x="70" y="214" font-size="28" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><text x="70" y="252" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">g(0)=0</text><text x="120" y="144" font-size="21" font-weight="normal" text-anchor="middle" fill="#a45b30">1/2</text><path d="M200.0 81 Q330 112 330 174" fill="none" stroke="#16776d" stroke-width="2"/><path d="M330 153L330 176" fill="none" stroke="#16776d" stroke-width="2"/><path d="M326.5202757271102 168.7964231811786L330 176" fill="none" stroke="#16776d" stroke-width="2"/><path d="M333.4797242728898 168.7964231811786L330 176" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="330" cy="205" r="26" fill="white" stroke="#16776d" stroke-width="2"/><text x="330" y="214" font-size="28" font-weight="normal" text-anchor="middle" fill="#173f39">1</text><text x="330" y="252" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">g(1)=1</text><text x="280" y="144" font-size="21" font-weight="normal" text-anchor="middle" fill="#a45b30">1/2</text><text x="200" y="211" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">退出时刻 τ</text></svg><text x="450" y="600" font-size="27" font-weight="normal" text-anchor="middle" fill="#173f39">1/2 + 1/4 = 3/4</text><text x="450" y="642" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">−½u″=1; u(0)=0, u(1)=1</text><path d="M30 680L870 680" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="711" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">这是无折扣q=0的明确区间模型，不是一般Feynman–Kac定理的替代。令τ为标准Brownian首次退出(0,1)，</text><text x="30" y="735" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">g(0)=0、g(1)=1，f≡c。Pₓ(Bτ=1)=x，Eₓτ=x(1−x)，故u(x)=Eₓ[g(Bτ)+cτ]=x+cx(1−x)，满足−u</text><text x="30" y="759" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">″/2=c及上述非零边界数据。两项来自同一段路径，通常相关；相加取期望不需独立性。图中钟面表示累计</text><text x="30" y="783" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">到τ，不是第三种退出结果。箭头概率不由模拟估计；一般正则性、存在与边界实现仍依正文。</text></svg>