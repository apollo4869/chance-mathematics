<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 726" width="900" height="726" role="img" aria-label="A shared law, not shared outcomes"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="726" fill="white"/><text x="30" y="43" font-size="28" font-weight="bold" text-anchor="start" fill="#173f39">A shared law, not shared outcomes</text><path d="M30 62L870 62" fill="none" stroke="#ccd9d1" stroke-width="1"/><svg x="20" y="90" width="390" height="330" viewBox="0 0 360 305"><rect x="123" y="6" width="114" height="48" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="180" y="37" font-size="23" font-weight="normal" text-anchor="middle" fill="#16776d">ν ?</text><path d="M180 54L180 74" fill="none" stroke="#16776d" stroke-width="2"/><path d="M53 74L307 74" fill="none" stroke="#16776d" stroke-width="2"/><path d="M53 74L53 107" fill="none" stroke="#16776d" stroke-width="2"/><path d="M49.52027572711016 99.79642318117858L53 107" fill="none" stroke="#16776d" stroke-width="2"/><path d="M56.47972427288984 99.79642318117858L53 107" fill="none" stroke="#16776d" stroke-width="2"/><text x="53" y="130" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">X₁</text><path d="M8 148 L13 228 Q53 253 93 228 L98 148" fill="none" stroke="#16776d" stroke-width="1.5"/><circle cx="33" cy="170" r="16" fill="white" stroke="#16776d" stroke-width="2"/><text x="33" y="176" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">−1</text><circle cx="73" cy="170" r="16" fill="white" stroke="#16776d" stroke-width="2"/><text x="73" y="176" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">+1</text><circle cx="33" cy="211" r="16" fill="white" stroke="#a45b30" stroke-width="2"/><text x="33" y="217" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">−2</text><circle cx="73" cy="211" r="16" fill="white" stroke="#a45b30" stroke-width="2"/><text x="73" y="217" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">+2</text><text x="53" y="280" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">¼ each</text><path d="M180 74L180 107" fill="none" stroke="#16776d" stroke-width="2"/><path d="M176.52027572711015 99.79642318117858L180 107" fill="none" stroke="#16776d" stroke-width="2"/><path d="M183.47972427288985 99.79642318117858L180 107" fill="none" stroke="#16776d" stroke-width="2"/><text x="180" y="130" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">X₂</text><path d="M135 148 L140 228 Q180 253 220 228 L225 148" fill="none" stroke="#16776d" stroke-width="1.5"/><circle cx="160" cy="170" r="16" fill="white" stroke="#16776d" stroke-width="2"/><text x="160" y="176" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">−1</text><circle cx="200" cy="170" r="16" fill="white" stroke="#16776d" stroke-width="2"/><text x="200" y="176" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">+1</text><circle cx="160" cy="211" r="16" fill="white" stroke="#a45b30" stroke-width="2"/><text x="160" y="217" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">−2</text><circle cx="200" cy="211" r="16" fill="white" stroke="#a45b30" stroke-width="2"/><text x="200" y="217" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">+2</text><text x="180" y="280" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">¼ each</text><path d="M307 74L307 107" fill="none" stroke="#16776d" stroke-width="2"/><path d="M303.5202757271102 99.79642318117858L307 107" fill="none" stroke="#16776d" stroke-width="2"/><path d="M310.4797242728898 99.79642318117858L307 107" fill="none" stroke="#16776d" stroke-width="2"/><text x="307" y="130" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">X₃</text><path d="M262 148 L267 228 Q307 253 347 228 L352 148" fill="none" stroke="#16776d" stroke-width="1.5"/><circle cx="287" cy="170" r="16" fill="white" stroke="#16776d" stroke-width="2"/><text x="287" y="176" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">−1</text><circle cx="327" cy="170" r="16" fill="white" stroke="#16776d" stroke-width="2"/><text x="327" y="176" font-size="17" font-weight="normal" text-anchor="middle" fill="#16776d">+1</text><circle cx="287" cy="211" r="16" fill="white" stroke="#a45b30" stroke-width="2"/><text x="287" y="217" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">−2</text><circle cx="327" cy="211" r="16" fill="white" stroke="#a45b30" stroke-width="2"/><text x="327" y="217" font-size="17" font-weight="normal" text-anchor="middle" fill="#a45b30">+2</text><text x="307" y="280" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">¼ each</text></svg><text x="460" y="135" font-size="22" font-weight="bold" text-anchor="start" fill="#173f39">ν hidden</text><text x="460" y="168" font-size="22" font-weight="normal" text-anchor="start" fill="#173f39">±1, ±2   ¼ each</text><text x="460" y="239" font-size="22" font-weight="bold" text-anchor="start" fill="#173f39">Given ν₁</text><text x="460" y="272" font-size="22" font-weight="normal" text-anchor="start" fill="#173f39">−1, +1   ½ each</text><text x="460" y="343" font-size="22" font-weight="bold" text-anchor="start" fill="#173f39">Given ν₂</text><text x="460" y="376" font-size="22" font-weight="normal" text-anchor="start" fill="#173f39">−2, +2   ½ each</text><text x="35" y="467" font-size="22" font-weight="normal" text-anchor="start" fill="#173f39">ν hidden: P(|X₂|=1)=½; after seeing |X₁|=1 it becomes 1.</text><path d="M30 505L870 505" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="536" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">P(R=1)=P(R=2)=½ and ν=(δ₋R+δR)/2. Draws are iid given ν: fresh independent</text><text x="30" y="559" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">draws, not sampling without replacement. Four values of probability ¼ in the</text><text x="30" y="582" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">hidden state describe marginals, not unconditional independence; here</text><text x="30" y="605" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Cov(X₁,X₂)=0 despite dependence. Given ν₂, |X₁|=1 is impossible: “—” is not a</text><text x="30" y="628" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">conditional probability of zero. The general de Finetti theorem needs infinite</text><text x="30" y="651" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">exchangeability and standard Borel assumptions, not finite exchangeability</text><text x="30" y="674" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">alone.</text></svg>