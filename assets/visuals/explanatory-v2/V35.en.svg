<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 702" width="900" height="702" role="img" aria-label="A rule, uniqueness and lifetime are different claims"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="702" fill="white"/><text x="30" y="43" font-size="27" font-weight="bold" text-anchor="start" fill="#173f39">A rule, uniqueness and lifetime are different claims</text><path d="M30 64L870 64" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="225" y="110" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">x′=2√|x|</text><svg x="30" y="130" width="390" height="293" viewBox="0 0 360 270"><text x="180" y="27" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">x(0)=0</text><text x="180" y="64" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">One rule, three valid answers</text><path d="M180 77L180 91" fill="none" stroke="#16776d" stroke-width="2"/><path d="M55 91L305 91" fill="none" stroke="#16776d" stroke-width="2"/><path d="M55 91L55 111" fill="none" stroke="#16776d" stroke-width="2"/><path d="M51.52027572711016 103.79642318117858L55 111" fill="none" stroke="#16776d" stroke-width="2"/><path d="M58.47972427288984 103.79642318117858L55 111" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="55" cy="153" r="31" fill="white" stroke="#16776d" stroke-width="2"/><text x="55" y="164" font-size="32" font-weight="normal" text-anchor="middle" fill="#173f39">4</text><text x="55" y="211" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">a = 0</text><path d="M180 91L180 111" fill="none" stroke="#16776d" stroke-width="2"/><path d="M176.52027572711015 103.79642318117858L180 111" fill="none" stroke="#16776d" stroke-width="2"/><path d="M183.47972427288985 103.79642318117858L180 111" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="180" cy="153" r="31" fill="white" stroke="#16776d" stroke-width="2"/><text x="180" y="164" font-size="32" font-weight="normal" text-anchor="middle" fill="#173f39">1</text><text x="180" y="211" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">a = 1</text><path d="M305 91L305 111" fill="none" stroke="#16776d" stroke-width="2"/><path d="M301.5202757271102 103.79642318117858L305 111" fill="none" stroke="#16776d" stroke-width="2"/><path d="M308.4797242728898 103.79642318117858L305 111" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="305" cy="153" r="31" fill="white" stroke="#16776d" stroke-width="2"/><text x="305" y="164" font-size="32" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><text x="305" y="211" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">a = ∞</text><text x="180" y="256" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Read all three at the same time t=2</text></svg><text x="665" y="110" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">x′=x²</text><svg x="470" y="130" width="390" height="293" viewBox="0 0 360 270"><text x="180" y="27" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">x(0)=1</text><text x="180" y="64" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">One solution, four observation times</text><circle cx="43" cy="139" r="25" fill="white" stroke="#16776d" stroke-width="2"/><text x="43" y="148" font-size="27" font-weight="normal" text-anchor="middle" fill="#173f39">1</text><text x="43" y="190" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">t=0</text><path d="M72 139L104 139" fill="none" stroke="#16776d" stroke-width="2"/><path d="M96.79642318117858 142.47972427288985L104 139" fill="none" stroke="#16776d" stroke-width="2"/><path d="M96.79642318117858 135.52027572711015L104 139" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="133" cy="139" r="25" fill="white" stroke="#16776d" stroke-width="2"/><text x="133" y="148" font-size="27" font-weight="normal" text-anchor="middle" fill="#173f39">2</text><text x="133" y="190" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">t=1/2</text><path d="M162 139L194 139" fill="none" stroke="#16776d" stroke-width="2"/><path d="M186.7964231811786 142.47972427288985L194 139" fill="none" stroke="#16776d" stroke-width="2"/><path d="M186.7964231811786 135.52027572711015L194 139" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="223" cy="139" r="25" fill="white" stroke="#16776d" stroke-width="2"/><text x="223" y="148" font-size="27" font-weight="normal" text-anchor="middle" fill="#173f39">4</text><text x="223" y="190" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">t=3/4</text><path d="M252 139L284 139" fill="none" stroke="#16776d" stroke-width="2"/><path d="M276.79642318117857 142.47972427288985L284 139" fill="none" stroke="#16776d" stroke-width="2"/><path d="M276.79642318117857 135.52027572711015L284 139" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="313" cy="139" r="25" fill="white" stroke="#16776d" stroke-width="2"/><text x="313" y="148" font-size="27" font-weight="normal" text-anchor="middle" fill="#173f39">8</text><text x="313" y="190" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">t=7/8</text><path d="M350 103L350 209" fill="none" stroke="#a45b30" stroke-width="2" stroke-dasharray="5 4"/><text x="180" y="239" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">Halving gaps; lifetime ζ=1</text></svg><path d="M30 470L870 470" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="501" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Both examples have σ=0, not simulated noise. In the first, xᵃ(t)=(t−a)₊²,</text><text x="30" y="525" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">a∈[0,∞], has derivative 0 on both sides of departure and satisfies the same</text><text x="30" y="549" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">integral equation; at t=2 the displayed values are 4,1,0. In the second, x′=x²</text><text x="30" y="573" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">with x(0)=1 has the locally unique solution 1/(1−t) only for t&lt;1. A finite value</text><text x="30" y="597" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">cannot extend it past explosion as a solution of that equation. The four nodes</text><text x="30" y="621" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">are observations, not an equally spaced time axis. General strong/weak and</text><text x="30" y="645" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">uniqueness notions remain the text’s responsibility.</text></svg>