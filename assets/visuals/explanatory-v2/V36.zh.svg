<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 974" width="900" height="974" role="img" aria-label="边界有两个方向的问题"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="974" fill="white"/><text x="30" y="43" font-size="27" font-weight="bold" text-anchor="start" fill="#173f39">边界有两个方向的问题</text><path d="M30 64L870 64" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="225" y="100" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">正则</text><svg x="50" y="112" width="350" height="263" viewBox="0 0 360 270"><rect x="22" y="51" width="33" height="185" fill="#f0f1eb"/><path d="M55 51L55 236" fill="none" stroke="#65756e" stroke-width="1.4"/><path d="M55 140L333 140" fill="none" stroke="#65756e" stroke-width="1"/><circle cx="55" cy="140" r="6" fill="#173f39" stroke="#173f39" stroke-width="2"/><text x="55" y="166" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><circle cx="255" cy="140" r="6" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="255" y="166" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">x</text><text x="163" y="31" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">内部 → 端点</text><text x="163" y="262" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">端点 → 内部</text><path d="M255 140 Q155 0 55 140" fill="none" stroke="#16776d" stroke-width="2"/><path d="M88 103L72 121" fill="none" stroke="#16776d" stroke-width="2"/><path d="M74.18501760065082 113.30417658175253L72 121" fill="none" stroke="#16776d" stroke-width="2"/><path d="M79.38657429666601 117.92778253376602L72 121" fill="none" stroke="#16776d" stroke-width="2"/><path d="M55 140 Q155 280 255 140" fill="none" stroke="#16776d" stroke-width="2"/><path d="M222 176L238 160" fill="none" stroke="#16776d" stroke-width="2"/><path d="M235.366838612633 167.55423464740667L238 160" fill="none" stroke="#16776d" stroke-width="2"/><path d="M230.44576535259333 162.633161387367L238 160" fill="none" stroke="#16776d" stroke-width="2"/></svg><text x="225" y="407" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">Σ &lt; ∞; N &lt; ∞</text><text x="665" y="100" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">出口</text><svg x="490" y="112" width="350" height="263" viewBox="0 0 360 270"><rect x="22" y="51" width="33" height="185" fill="#f0f1eb"/><path d="M55 51L55 236" fill="none" stroke="#65756e" stroke-width="1.4"/><path d="M55 140L333 140" fill="none" stroke="#65756e" stroke-width="1"/><circle cx="55" cy="140" r="6" fill="#173f39" stroke="#173f39" stroke-width="2"/><text x="55" y="166" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><circle cx="255" cy="140" r="6" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="255" y="166" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">x</text><text x="163" y="31" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">内部 → 端点</text><text x="163" y="262" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">端点 → 内部</text><path d="M255 140 Q155 0 55 140" fill="none" stroke="#16776d" stroke-width="2"/><path d="M88 103L72 121" fill="none" stroke="#16776d" stroke-width="2"/><path d="M74.18501760065082 113.30417658175253L72 121" fill="none" stroke="#16776d" stroke-width="2"/><path d="M79.38657429666601 117.92778253376602L72 121" fill="none" stroke="#16776d" stroke-width="2"/><path d="M55 140 Q155 280 255 140" fill="none" stroke="#65756e" stroke-width="2" stroke-dasharray="5 4"/><path d="M147 202L163 218" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M147 218L163 202" fill="none" stroke="#a45b30" stroke-width="2"/></svg><text x="665" y="407" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">Σ &lt; ∞; N = ∞</text><text x="225" y="450" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">入口</text><svg x="50" y="462" width="350" height="263" viewBox="0 0 360 270"><rect x="22" y="51" width="33" height="185" fill="#f0f1eb"/><path d="M55 51L55 236" fill="none" stroke="#65756e" stroke-width="1.4"/><path d="M55 140L333 140" fill="none" stroke="#65756e" stroke-width="1"/><circle cx="55" cy="140" r="6" fill="#173f39" stroke="#173f39" stroke-width="2"/><text x="55" y="166" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><circle cx="255" cy="140" r="6" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="255" y="166" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">x</text><text x="163" y="31" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">内部 → 端点</text><text x="163" y="262" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">端点 → 内部</text><path d="M255 140 Q155 0 55 140" fill="none" stroke="#65756e" stroke-width="2" stroke-dasharray="5 4"/><path d="M147 62L163 78" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M147 78L163 62" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M55 140 Q155 280 255 140" fill="none" stroke="#16776d" stroke-width="2"/><path d="M222 176L238 160" fill="none" stroke="#16776d" stroke-width="2"/><path d="M235.366838612633 167.55423464740667L238 160" fill="none" stroke="#16776d" stroke-width="2"/><path d="M230.44576535259333 162.633161387367L238 160" fill="none" stroke="#16776d" stroke-width="2"/></svg><text x="225" y="757" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">Σ = ∞; N &lt; ∞</text><text x="665" y="450" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">自然</text><svg x="490" y="462" width="350" height="263" viewBox="0 0 360 270"><rect x="22" y="51" width="33" height="185" fill="#f0f1eb"/><path d="M55 51L55 236" fill="none" stroke="#65756e" stroke-width="1.4"/><path d="M55 140L333 140" fill="none" stroke="#65756e" stroke-width="1"/><circle cx="55" cy="140" r="6" fill="#173f39" stroke="#173f39" stroke-width="2"/><text x="55" y="166" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><circle cx="255" cy="140" r="6" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="255" y="166" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">x</text><text x="163" y="31" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">内部 → 端点</text><text x="163" y="262" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">端点 → 内部</text><path d="M255 140 Q155 0 55 140" fill="none" stroke="#65756e" stroke-width="2" stroke-dasharray="5 4"/><path d="M147 62L163 78" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M147 78L163 62" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M55 140 Q155 280 255 140" fill="none" stroke="#65756e" stroke-width="2" stroke-dasharray="5 4"/><path d="M147 202L163 218" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M147 218L163 202" fill="none" stroke="#a45b30" stroke-width="2"/></svg><text x="665" y="757" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">Σ = ∞; N = ∞</text><path d="M30 790L870 790" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="821" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">端点0在状态区间闭包中；入口指扩展状态空间后连续即时进入内部，不是仅在0定义一个常值过程。Σ有限</text><text x="30" y="845" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">表示内部可达；对不可达端点，N有限给出本章已证的即时入口。四型为(Σ,N)：有限/有限、有限/无穷、无</text><text x="30" y="869" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">穷/有限、无穷/无穷。正则型表示允许选择相应边界规则，不保证任意既定延拓都会反射返回。出口或自然</text><text x="30" y="893" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">端也可能定义吸收零过程，这不等于进入内部。使用本章非退化一维扩散的尺度与速度条件，不据此宣称所有</text><text x="30" y="917" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">奇异边界延拓已构造。</text></svg>