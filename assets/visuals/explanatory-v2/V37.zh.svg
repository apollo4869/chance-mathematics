<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-label="一点没有时间，密度却可以非零"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="640" fill="white"/><text x="30" y="43" font-size="27" font-weight="bold" text-anchor="start" fill="#173f39">一点没有时间，密度却可以非零</text><path d="M30 64L870 64" fill="none" stroke="#ccd9d1" stroke-width="1"/><svg x="25" y="130" width="360" height="248" viewBox="0 0 320 220"><path d="M18 170L302 170" fill="none" stroke="#65756e" stroke-width="1"/><path d="M20 170 L160 50 L300 170" fill="none" stroke="#16776d" stroke-width="2"/><path d="M125.0 170 L125.0 80.0 L160 50 L195.0 80.0 L195.0 170 Z" fill="#eaf2ee" stroke="#16776d" stroke-width="1"/><path d="M125.0 170L125.0 193" fill="none" stroke="#16776d" stroke-width="1"/><path d="M195.0 170L195.0 193" fill="none" stroke="#16776d" stroke-width="1"/><path d="M125.0 187L195.0 187" fill="none" stroke="#16776d" stroke-width="1.4"/><text x="160" y="216" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">2ε</text><circle cx="160" cy="50" r="4" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="160" y="29" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">ℓ(0)=1</text></svg><svg x="515" y="130" width="360" height="248" viewBox="0 0 320 220"><path d="M64 170L256 170" fill="none" stroke="#65756e" stroke-width="1"/><path d="M70 50L250 50" fill="none" stroke="#65756e" stroke-width="1.2" stroke-dasharray="4 4"/><text x="268" y="56" font-size="18" font-weight="normal" text-anchor="start" fill="#65756e">1</text><rect x="70" y="65.0" width="180" height="105.0" fill="#eaf2ee" stroke="#16776d" stroke-width="1.5"/><text x="160" y="123.5" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">平均高度</text></svg><text x="450" y="251" font-size="25" font-weight="normal" text-anchor="middle" fill="#173f39">÷2ε →</text><text x="450" y="105" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">窄带总量，换算为每单位位置的密度</text><text x="450" y="442" font-size="26" font-weight="normal" text-anchor="middle" fill="#173f39">(7/16) ÷ (1/2) = 7/8</text><path d="M30 480L870 480" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="512" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">示意剖面ℓ(a)=(1−|a|)₊，不是声称Brownian局部时具有这条确定形状。其带内面积2ε−ε²除以2ε为1</text><text x="30" y="536" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">−ε/2，趋于ℓ(0)=1；单点面积为0，不能用0/0定义密度。正文实际证明Brownian占用公式∫₀ᵗ1{|Bₛ−</text><text x="30" y="560" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">a|&lt;ε}ds=∫ₐ₋εᵃ₊εLₜʸdy及联合连续性，故窄带平均趋Lₜᵃ。一般连续半鞅须以d[M]而非一概用dt</text><text x="30" y="584" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">计量。图不代替局部时存在、版本与收敛证明。</text></svg>