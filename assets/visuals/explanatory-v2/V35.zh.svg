<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" role="img" aria-label="规则、唯一性、寿命不是一回事"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="630" fill="white"/><text x="30" y="43" font-size="27" font-weight="bold" text-anchor="start" fill="#173f39">规则、唯一性、寿命不是一回事</text><path d="M30 64L870 64" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="225" y="110" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">x′=2√|x|</text><svg x="30" y="130" width="390" height="293" viewBox="0 0 360 270"><text x="180" y="27" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">x(0)=0</text><text x="180" y="64" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">同一规则，三个合法答案</text><path d="M180 77L180 91" fill="none" stroke="#16776d" stroke-width="2"/><path d="M55 91L305 91" fill="none" stroke="#16776d" stroke-width="2"/><path d="M55 91L55 111" fill="none" stroke="#16776d" stroke-width="2"/><path d="M51.52027572711016 103.79642318117858L55 111" fill="none" stroke="#16776d" stroke-width="2"/><path d="M58.47972427288984 103.79642318117858L55 111" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="55" cy="153" r="31" fill="white" stroke="#16776d" stroke-width="2"/><text x="55" y="164" font-size="32" font-weight="normal" text-anchor="middle" fill="#173f39">4</text><text x="55" y="211" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">a = 0</text><path d="M180 91L180 111" fill="none" stroke="#16776d" stroke-width="2"/><path d="M176.52027572711015 103.79642318117858L180 111" fill="none" stroke="#16776d" stroke-width="2"/><path d="M183.47972427288985 103.79642318117858L180 111" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="180" cy="153" r="31" fill="white" stroke="#16776d" stroke-width="2"/><text x="180" y="164" font-size="32" font-weight="normal" text-anchor="middle" fill="#173f39">1</text><text x="180" y="211" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">a = 1</text><path d="M305 91L305 111" fill="none" stroke="#16776d" stroke-width="2"/><path d="M301.5202757271102 103.79642318117858L305 111" fill="none" stroke="#16776d" stroke-width="2"/><path d="M308.4797242728898 103.79642318117858L305 111" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="305" cy="153" r="31" fill="white" stroke="#16776d" stroke-width="2"/><text x="305" y="164" font-size="32" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><text x="305" y="211" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">a = ∞</text><text x="180" y="256" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">在同一时刻 t=2 读取</text></svg><text x="665" y="110" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">x′=x²</text><svg x="470" y="130" width="390" height="293" viewBox="0 0 360 270"><text x="180" y="27" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">x(0)=1</text><text x="180" y="64" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">同一条解，四个时刻</text><circle cx="43" cy="139" r="25" fill="white" stroke="#16776d" stroke-width="2"/><text x="43" y="148" font-size="27" font-weight="normal" text-anchor="middle" fill="#173f39">1</text><text x="43" y="190" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">t=0</text><path d="M72 139L104 139" fill="none" stroke="#16776d" stroke-width="2"/><path d="M96.79642318117858 142.47972427288985L104 139" fill="none" stroke="#16776d" stroke-width="2"/><path d="M96.79642318117858 135.52027572711015L104 139" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="133" cy="139" r="25" fill="white" stroke="#16776d" stroke-width="2"/><text x="133" y="148" font-size="27" font-weight="normal" text-anchor="middle" fill="#173f39">2</text><text x="133" y="190" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">t=1/2</text><path d="M162 139L194 139" fill="none" stroke="#16776d" stroke-width="2"/><path d="M186.7964231811786 142.47972427288985L194 139" fill="none" stroke="#16776d" stroke-width="2"/><path d="M186.7964231811786 135.52027572711015L194 139" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="223" cy="139" r="25" fill="white" stroke="#16776d" stroke-width="2"/><text x="223" y="148" font-size="27" font-weight="normal" text-anchor="middle" fill="#173f39">4</text><text x="223" y="190" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">t=3/4</text><path d="M252 139L284 139" fill="none" stroke="#16776d" stroke-width="2"/><path d="M276.79642318117857 142.47972427288985L284 139" fill="none" stroke="#16776d" stroke-width="2"/><path d="M276.79642318117857 135.52027572711015L284 139" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="313" cy="139" r="25" fill="white" stroke="#16776d" stroke-width="2"/><text x="313" y="148" font-size="27" font-weight="normal" text-anchor="middle" fill="#173f39">8</text><text x="313" y="190" font-size="16" font-weight="normal" text-anchor="middle" fill="#173f39">t=7/8</text><path d="M350 103L350 209" fill="none" stroke="#a45b30" stroke-width="2" stroke-dasharray="5 4"/><text x="180" y="239" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">时间间隔减半，寿命止于 ζ=1</text></svg><path d="M30 470L870 470" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="501" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">两例都取σ=0，不是假造随机样本。第一例xᵃ(t)=(t−a)₊²，a∈[0,∞]，在出发处导数两侧均为0，确实</text><text x="30" y="525" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">满足同一积分方程；在t=2分别读到4、1、0。第二例x′=x²、x(0)=1，局部唯一解1/(1−t)仅在t&lt;1成立；不</text><text x="30" y="549" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">能在爆炸后填一个有限值续成原方程的解。四个节点只是读数序列，横距不表示相等时长。图不承担一般强弱</text><text x="30" y="573" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">解、路径唯一性与分布唯一性的分类证明。</text></svg>