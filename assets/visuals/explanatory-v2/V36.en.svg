<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1070" width="900" height="1070" role="img" aria-label="A boundary poses two directional questions"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="1070" fill="white"/><text x="30" y="43" font-size="27" font-weight="bold" text-anchor="start" fill="#173f39">A boundary poses two directional questions</text><path d="M30 64L870 64" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="225" y="100" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">Regular</text><svg x="50" y="112" width="350" height="263" viewBox="0 0 360 270"><rect x="22" y="51" width="33" height="185" fill="#f0f1eb"/><path d="M55 51L55 236" fill="none" stroke="#65756e" stroke-width="1.4"/><path d="M55 140L333 140" fill="none" stroke="#65756e" stroke-width="1"/><circle cx="55" cy="140" r="6" fill="#173f39" stroke="#173f39" stroke-width="2"/><text x="55" y="166" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><circle cx="255" cy="140" r="6" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="255" y="166" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">x</text><text x="163" y="31" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">Interior → boundary</text><text x="163" y="262" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">Boundary → interior</text><path d="M255 140 Q155 0 55 140" fill="none" stroke="#16776d" stroke-width="2"/><path d="M88 103L72 121" fill="none" stroke="#16776d" stroke-width="2"/><path d="M74.18501760065082 113.30417658175253L72 121" fill="none" stroke="#16776d" stroke-width="2"/><path d="M79.38657429666601 117.92778253376602L72 121" fill="none" stroke="#16776d" stroke-width="2"/><path d="M55 140 Q155 280 255 140" fill="none" stroke="#16776d" stroke-width="2"/><path d="M222 176L238 160" fill="none" stroke="#16776d" stroke-width="2"/><path d="M235.3