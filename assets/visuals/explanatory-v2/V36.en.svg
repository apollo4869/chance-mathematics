73f39">Σ &lt; ∞; N = ∞</text><text x="225" y="450" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">Entrance</text><svg x="50" y="462" width="350" height="263" viewBox="0 0 360 270"><rect x="22" y="51" width="33" height="185" fill="#f0f1eb"/><path d="M55 51L55 236" fill="none" stroke="#65756e" stroke-width="1.4"/><path d="M55 140L333 140" fill="none" stroke="#65756e" stroke-width="1"/><circle cx="55" cy="140" r="6" fill="#173f39" stroke="#173f39" stroke-width="2"/><text x="55" y="166" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><circle cx="255" cy="140" r="6" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="255" y="166" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">x</text><text x="163" y="31" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">Interior → boundary</text><text x="163" y="262" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">Boundary → interior</text><path d="M255 140 Q155 0 55 140" fill="none" stroke="#65756e" stroke-width="2" stroke-dasharray="5 4"/><path d="M147 62L163 78" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M147 78L163 62" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M55 140 Q155 280 255 140" fill="none" stroke="#16776d" stroke-width="2"/><path d="M222 176L238 160" fill="none" stroke="#16776d" stroke-width="2"/><path d="M235.366838612633 167.55423464740667L238 160" fill="none" stroke="#16776d" stroke-width="2"/><path d="M230.44576535259333 162.633161387367L238 160" fill="none" stroke="#16776d" stroke-width="2"/></svg><text x="225" y="757" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">Σ = ∞; N &lt; ∞</text><text x="665" y="450" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">Natural</text><svg x="490" y="462" width="350" height="263" viewBox="0 0 360 270"><rect x="22" y="51" width="33" height="185" fill="#f0f1eb"/><path d="M55 51L55 236" fill="none" stroke="#65756e" stroke-width="1.4"/><path d="M55 140L333 140" fill="none" stroke="#65756e" stroke-width="1"/><circle cx="55" cy="140" r="6" fill="#173f39" stroke="#173f39" stroke-width="2"/><text x="55" y="166" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">0</text><circle cx="255" cy="140" r="6" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="255" y="166" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">x</text><text x="163" y="31" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">Interior → boundary</text><text x="163" y="262" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">Boundary → interior</text><path d="M255 140 Q155 0 55 140" fill="none" stroke="#65756e" stroke-width="2" stroke-dasharray="5 4"/><path d="M147 62L163 78" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M147 78L163 62" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M55 140 Q155 280 255 140" fill="none" stroke="#65756e" stroke-width="2" stroke-dasharray="5 4"/><path d="M147 202L163 218" fill="none" stroke="#a45b30" stroke-width="2"/><path d="M147 218L163 202" fill="none" stroke="#a45b30" stroke-width="2"/></svg><text x="665" y="757" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">Σ = ∞; N = ∞</text><path d="M30 790L870 790" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="821" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Endpoint 0 lies in the closure of the state interval. Entrance means a</text><text x="30" y="845" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">continuous immediate entry into its interior after extension of the state space,</text><text x="30" y="869" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">not merely a constant process at 0. Finite Σ means accessibility; for</text><text x="30" y="893" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">inaccessible endpoints finite N gives the chapter’s proved entrance. The four</text><text x="30" y="917" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">(Σ,N) types are finite/finite, finite/infinite, infinite/finite and</text><text x="30" y="941" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">infinite/infinite. Regularity allows boundary choices; it does not force every</text><text x="30" y="965" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">extension to reflect. An absorbing zero process at an exit or natural endpoint</text><text x="30" y="989" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">is not an entrance. The chapter’s nondegenerate one-dimensional scale/speed</text><text x="30" y="1013" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">assumptions apply; no general singular-boundary construction is claimed.</text></svg>