<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 835" width="900" height="835" role="img" aria-label="同样的角度，半径却不同"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="835" fill="white"/><text x="30" y="43" font-size="27" font-weight="bold" text-anchor="start" fill="#173f39">同样的角度，半径却不同</text><path d="M30 64L870 64" fill="none" stroke="#ccd9d1" stroke-width="1"/><svg x="165" y="85" width="570" height="475" viewBox="0 0 360 300"><circle cx="180" cy="149" r="126.95153784390988" fill="none" stroke="#a45b30" stroke-width="1.8" stroke-dasharray="6 4"/><circle cx="180" cy="149" r="77" fill="white" stroke="#16776d" stroke-width="2"/><path d="M180 149L269.7682932914893 59.2317067085107" fill="none" stroke="#65756e" stroke-width="1"/><circle cx="180" cy="149" r="3" fill="#65756e" stroke="#65756e" stroke-width="2"/><circle cx="269.7682932914893" cy="59.2317067085107" r="6" fill="white" stroke="#a45b30" stroke-width="2"/><circle cx="234.44722215136417" cy="94.55277784863583" r="5" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="180" y="296" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">t=1</text></svg><circle cx="120" cy="580" r="5" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="135" y="587" font-size="20" font-weight="normal" text-anchor="start" fill="#173f39">保留向心项</text><circle cx="490" cy="580" r="5" fill="white" stroke="#a45b30" stroke-width="2"/><text x="505" y="587" font-size="20" font-weight="normal" text-anchor="start" fill="#173f39">删去向心项</text><text x="450" y="632" font-size="25" font-weight="normal" text-anchor="middle" fill="#173f39">正确半径1；删项后 exp(1/2)≈1.649</text><path d="M30 675L870 675" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="706" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">正确模型(X,Y)=(cosB,sinB)，dX=−YdB−Xdt/2，dY=XdB−Ydt/2，故X²+Y²=1。删掉两个dt项后，</text><text x="30" y="730" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">d(X²+Y²)=(X²+Y²)dt，从(1,0)出发半径为exp(t/2)；它与正确模型有相同角度B，但不是同一过程的另一种</text><text x="30" y="754" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">坐标写法。θ按钮是同一角度读数的示意，不是模拟轨迹，也不把Bₜ的分布离散化。向心漂移不表示真实路</text><text x="30" y="778" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">径沿半径内缩。Itô公式本身正确处理坐标变换，错误是遗漏二阶修正；圆周轮廓不表示各角度等概率。</text></svg>