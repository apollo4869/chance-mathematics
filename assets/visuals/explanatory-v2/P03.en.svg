3/4</text><path d="M30 492L870 492" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="525" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">The finite record illustrates weights: choose a start uniformly from</text><text x="30" y="549" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">{0,1,4,5}, or time uniformly from [0,8). Each square stands for a unit of</text><text x="30" y="573" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">time, not one of only eight possible times. For stationary renewal, the event</text><text x="30" y="597" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">(Palm) gaps must be positive and iid with 0&lt;E L&lt;∞: P_time(L∈dℓ)=ℓ</text><text x="30" y="621" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">P_event(L∈dℓ)/E_event L. Time sampling reads the full containing gap, not</text><text x="30" y="645" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">residual life; event sampling reads the next full gap.</text></svg>