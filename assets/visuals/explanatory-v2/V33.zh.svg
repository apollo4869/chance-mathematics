<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" role="img" aria-label="记录没动，概率重新分配"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="800" fill="white"/><text x="30" y="43" font-size="27" font-weight="bold" text-anchor="start" fill="#173f39">记录没动，概率重新分配</text><path d="M30 64L870 64" fill="none" stroke="#ccd9d1" stroke-width="1"/><svg x="125" y="90" width="650" height="471" viewBox="0 0 400 290"><text x="10" y="103" font-size="22" font-weight="normal" text-anchor="start" fill="#173f39">P</text><text x="10" y="222" font-size="22" font-weight="normal" text-anchor="start" fill="#173f39">Q</text><text x="67" y="29" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">++</text><path d="M67 43L67 78" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M67 130L67 183" fill="none" stroke="#ccd9d1" stroke-width="1"/><circle cx="67" cy="104" r="18" fill="#eaf2ee" stroke="#16776d" stroke-width="2"/><text x="67" y="153" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">1/4</text><circle cx="67" cy="220" r="27.0" fill="#f1e7df" stroke="#a45b30" stroke-width="2"/><text x="67" y="278" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">9/16</text><text x="158" y="29" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">+−</text><path d="M158 43L158 78" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M158 130L158 183" fill="none" stroke="#ccd9d1" stroke-width="1"/><circle cx="158" cy="104" r="18" fill="#eaf2ee" stroke="#16776d" stroke-width="2"/><text x="158" y="153" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">1/4</text><circle cx="158" cy="220" r="15.588457268119894" fill="#f1e7df" stroke="#a45b30" stroke-width="2"/><text x="158" y="278" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">3/16</text><text x="249" y="29" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">−+</text><path d="M249 43L249 78" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M249 130L249 183" fill="none" stroke="#ccd9d1" stroke-width="1"/><circle cx="249" cy="104" r="18" fill="#eaf2ee" stroke="#16776d" stroke-width="2"/><text x="249" y="153" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">1/4</text><circle cx="249" cy="220" r="15.588457268119894" fill="#f1e7df" stroke="#a45b30" stroke-width="2"/><text x="249" y="278" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">3/16</text><text x="340" y="29" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">−−</text><path d="M340 43L340 78" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M340 130L340 183" fill="none" stroke="#ccd9d1" stroke-width="1"/><circle cx="340" cy="104" r="18" fill="#eaf2ee" stroke="#16776d" stroke-width="2"/><text x="340" y="153" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">1/4</text><circle cx="340" cy="220" r="9.0" fill="#f1e7df" stroke="#a45b30" stroke-width="2"/><text x="340" y="278" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">1/16</text></svg><text x="450" y="604" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">θ=3/4：同样的记录，归一化后的不同权重。</text><path d="M30 640L870 640" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="672" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">图是有限类比，不是Brownian路径模拟。P给四条两步记录各1/4；Qθ给单步向上概率θ，两步独立。</text><text x="30" y="696" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Zθ=Qθ/P，所以E_P Zθ=1；圆面积按概率、半径按概率平方根缩放。改变的是权重，不是已有记录。</text><text x="30" y="720" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Brownian的有限时间换测度须另证随机指数为均值1真鞅；正局部鞅不自动是密度。此图不替代Girsanov证明</text><text x="30" y="744" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">，也不主张无限时间等价。</text></svg>