<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 931" width="900" height="931" role="img" aria-label="Same angle, different radius"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="931" fill="white"/><text x="30" y="43" font-size="27" font-weight="bold" text-anchor="start" fill="#173f39">Same angle, different radius</text><path d="M30 64L870 64" fill="none" stroke="#ccd9d1" stroke-width="1"/><svg x="165" y="85" width="570" height="475" viewBox="0 0 360 300"><circle cx="180" cy="149" r="126.95153784390988" fill="none" stroke="#a45b30" stroke-width="1.8" stroke-dasharray="6 4"/><circle cx="180" cy="149" r="77" fill="white" stroke="#16776d" stroke-width="2"/><path d="M180 149L269.7682932914893 59.2317067085107" fill="none" stroke="#65756e" stroke-width="1"/><circle cx="180" cy="149" r="3" fill="#65756e" stroke="#65756e" stroke-width="2"/><circle cx="269.7682932914893" cy="59.2317067085107" r="6" fill="white" stroke="#a45b30" stroke-width="2"/><circle cx="234.44722215136417" cy="94.55277784863583" r="5" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="180" y="296" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">t=1</text></svg><circle cx="120" cy="580" r="5" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="135" y="587" font-size="20" font-weight="normal" text-anchor="start" fill="#173f39">With the inward term</text><circle cx="490" cy="580" r="5" fill="white" stroke="#a45b30" stroke-width="2"/><text x="505" y="587" font-size="20" font-weight="normal" text-anchor="start" fill="#173f39">Without the inward term</text><text x="450" y="632" font-size="25" font-weight="normal" text-anchor="middle" fill="#173f39">Correct radius 1; without the term exp(1/2)≈1.649</text><path d="M30 675L870 675" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="706" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">The correct model is (cosB,sinB): dX=−YdB−Xdt/2 and dY=XdB−Ydt/2, so X²+Y²=1.</text><text x="30" y="730" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Omitting both dt terms gives d(X²+Y²)=(X²+Y²)dt and radius exp(t/2) from (1,0).</text><text x="30" y="754" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Its angle is still B, but it is a different process, not a new coordinate</text><text x="30" y="778" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">description of the same one. θ buttons illustrate one angular reading, not</text><text x="30" y="802" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">simulated trajectories or a discrete distribution for Bₜ. Inward Itô drift does</text><text x="30" y="826" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">not mean the actual path moves radially inward. Itô’s formula handles coordinate</text><text x="30" y="850" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">changes correctly; omitting the second-order correction is the error. Circle</text><text x="30" y="874" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">outlines do not assert a uniform angular law.</text></svg>