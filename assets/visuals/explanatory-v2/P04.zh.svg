<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 597" width="900" height="597" role="img" aria-label="不同时间，同一个祖先"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect x="0" y="0" width="900" height="597" fill="white"/><text x="30" y="42" font-size="27" font-weight="bold" text-anchor="start" fill="#173f39">不同时间，同一个祖先</text><path d="M30 61L870 61" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="200" y="108" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">时间记录</text><svg x="20" y="125" width="365" height="257" viewBox="0 0 320 225"><path d="M18 180L74 44" fill="none" stroke="#173f39" stroke-width="2.5"/><path d="M74 44L130 112" fill="none" stroke="#173f39" stroke-width="2.5"/><path d="M130 112L186 44" fill="none" stroke="#173f39" stroke-width="2.5"/><path d="M186 44L298 180" fill="none" stroke="#173f39" stroke-width="2.5"/><path d="M18 180L307 180" fill="none" stroke="#65756e" stroke-width="1"/><path d="M74 112L186 112" fill="none" stroke="#a45b30" stroke-width="1.5" stroke-dasharray="5 4"/><text x="160" y="163" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">mₕ(s,t)=1</text><circle cx="46" cy="112" r="5" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="46" y="138" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">a</text><circle cx="130" cy="112" r="5" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="130" y="138" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">b</text><circle cx="242" cy="112" r="5" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="242" y="138" font-size="20" font-weight="normal" text-anchor="middle" fill="#173f39">c</text><circle cx="74" cy="44" r="5" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><text x="74" y="26" font-size="20" font-weight="normal" text-anchor="middle" fill="#a45b30">s</text><circle cx="186" cy="44" r="5" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><text x="186" y="26" font-size="20" font-weight="normal" text-anchor="middle" fill="#a45b30">t</text><text x="18" y="209" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">0</text><text x="294" y="209" font-size="17" font-weight="normal" text-anchor="start" fill="#173f39">1</text></svg><text x="680" y="108" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">商树</text><svg x="500" y="125" width="365" height="257" viewBox="0 0 320 225"><path d="M160 190L160 112" fill="none" stroke="#16776d" stroke-width="2.5"/><path d="M160 112L80 32" fill="none" stroke="#16776d" stroke-width="2.5"/><path d="M160 112L240 32" fill="none" stroke="#16776d" stroke-width="2.5"/><circle cx="160" cy="190" r="6" fill="#173f39" stroke="#173f39" stroke-width="2"/><text x="178" y="197" font-size="19" font-weight="normal" text-anchor="start" fill="#173f39">ρ</text><circle cx="160" cy="112" r="6" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="178" y="119" font-size="19" font-weight="normal" text-anchor="start" fill="#173f39">v</text><circle cx="80" cy="32" r="6" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><text x="80" y="17" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">pₕ(s)</text><circle cx="240" cy="32" r="6" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><text x="240" y="17" font-size="19" font-weight="normal" text-anchor="middle" fill="#173f39">pₕ(t)</text><text x="102" y="84" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">1</text><text x="224" y="84" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">1</text><text x="183" y="160" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">1</text></svg><path d="M416 240L480 240" fill="none" stroke="#16776d" stroke-width="2"/><path d="M472.79642318117857 243.47972427288985L480 240" fill="none" stroke="#16776d" stroke-width="2"/><path d="M472.79642318117857 236.52027572711015L480 240" fill="none" stroke="#16776d" stroke-width="2"/><text x="448" y="221" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">pₕ</text><text x="450" y="429" font-size="24" font-weight="normal" text-anchor="middle" fill="#173f39">pₕ(a)=pₕ(b)=pₕ(c)=v;  dₕ(s,t)=2</text><path d="M30 492L870 492" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="525" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">确定性连续折线示例：从0升到2、降到1、再升到2、回到0；不是Brownian样本。零距离需两端等高且中间不</text><text x="30" y="549" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">更低，不是只比较端点高度。实树、唯一弧与紧性仍由正文证明；时间质量不等于枝长。</text></svg>