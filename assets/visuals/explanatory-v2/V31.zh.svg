41L333.5 267" fill="none" stroke="#16776d" stroke-width="2"/></svg><path d="M30 470L870 470" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="502" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">连续模型M=B，严格有[B]ₜ=⟨B⟩ₜ=t；一般[M]=⟨M⟩限于本章已证的连续局部鞅。跳跃模型M=N−t，N为</text><text x="30" y="526" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">率1的Poisson过程：[M]=N，⟨M⟩=t。图中到达记录只是确定性示意，不证明这些定理；“可预测”不是预</text><text x="30" y="550" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">言实际跳数。一般分割的收敛模式及局部化条件以正文为准。</text></svg>