<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 654" width="900" height="654" role="img" aria-label="Two brackets, two ways to read"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="654" fill="white"/><text x="30" y="43" font-size="27" font-weight="bold" text-anchor="start" fill="#173f39">Two brackets, two ways to read</text><path d="M30 64L870 64" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="225" y="109" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">Continuous: both read t</text><svg x="30" y="132" width="390" height="303" viewBox="0 0 360 280"><text x="180" y="26" font-size="25" font-weight="normal" text-anchor="middle" fill="#173f39">M</text><path d="M180 36L180 51" fill="none" stroke="#16776d" stroke-width="2"/><path d="M90 51L270 51" fill="none" stroke="#16776d" stroke-width="2"/><path d="M90 51L90 78" fill="none" stroke="#16776d" stroke-width="2"/><path d="M86.52027572711016 70.79642318117858L90 78" fill="none" stroke="#16776d" stroke-width="2"/><path d="M93.47972427288984 70.79642318117858L90 78" fill="none" stroke="#16776d" stroke-width="2"/><path d="M270 51L270 78" fill="none" stroke="#16776d" stroke-width="2"/><path d="M266.5202757271102 70.79642318117858L270 78" fill="none" stroke="#16776d" stroke-width="2"/><path d="M273.4797242728898 70.79642318117858L270 78" fill="none" stroke="#16776d" stroke-width="2"/><text x="90" y="100" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Square increments</text><text x="270" y="100" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Predictable clock</text><circle cx="90" cy="153" r="40" fill="white" stroke="#16776d" stroke-width="2"/><text x="90" y="165" font-size="40" font-weight="normal" text-anchor="middle" fill="#173f39">3</text><text x="90" y="218" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">[M]</text><circle cx="270" cy="153" r="40" fill="white" stroke="#16776d" stroke-width="2"/><text x="270" y="165" font-size="40" font-weight="normal" text-anchor="middle" fill="#173f39">3</text><text x="270" y="218" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">⟨M⟩</text><text x="180" y="165" font-size="25" font-weight="normal" text-anchor="middle" fill="#a45b30">=</text><path d="M26 257L334 257" fill="none" stroke="#65756e" stroke-width="1.2"/><path d="M26.0 251L26.0 262" fill="none" stroke="#65756e" stroke-width="1"/><text x="26.0" y="279" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">0</text><path d="M128.5 251L128.5 262" fill="none" stroke="#65756e" stroke-width="1"/><text x="128.5" y="279" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><path d="M231.0 251L231.0 262" fill="none" stroke="#65756e" stroke-width="1"/><text x="231.0" y="279" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">2</text><path d="M333.5 251L333.5 262" fill="none" stroke="#65756e" stroke-width="1"/><text x="333.5" y="279" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">3</text><path d="M333.5 241L333.5 267" fill="none" stroke="#16776d" stroke-width="2"/></svg><text x="665" y="109" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">Jumps: 2 is not 3</text><svg x="470" y="132" width="390" height="303" viewBox="0 0 360 280"><text x="180" y="26" font-size="25" font-weight="normal" text-anchor="middle" fill="#173f39">M</text><path d="M180 36L180 51" fill="none" stroke="#16776d" stroke-width="2"/><path d="M90 51L270 51" fill="none" stroke="#16776d" stroke-width="2"/><path d="M90 51L90 78" fill="none" stroke="#16776d" stroke-width="2"/><path d="M86.52027572711016 70.79642318117858L90 78" fill="none" stroke="#16776d" stroke-width="2"/><path d="M93.47972427288984 70.79642318117858L90 78" fill="none" stroke="#16776d" stroke-width="2"/><path d="M270 51L270 78" fill="none" stroke="#16776d" stroke-width="2"/><path d="M266.5202757271102 70.79642318117858L270 78" fill="none" stroke="#16776d" stroke-width="2"/><path d="M273.4797242728898 70.79642318117858L270 78" fill="none" stroke="#16776d" stroke-width="2"/><text x="90" y="100" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Square increments</text><text x="270" y="100" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Predictable clock</text><circle cx="90" cy="153" r="40" fill="white" stroke="#16776d" stroke-width="2"/><text x="90" y="165" font-size="40" font-weight="normal" text-anchor="middle" fill="#173f39">2</text><text x="90" y="218" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">[M]</text><circle cx="270" cy="153" r="40" fill="white" stroke="#16776d" stroke-width="2"/><text x="270" y="165" font-size="40" font-weight="normal" text-anchor="middle" fill="#173f39">3</text><text x="270" y="218" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">⟨M⟩</text><text x="180" y="165" font-size="25" font-weight="normal" text-anchor="middle" fill="#a45b30">≠</text><path d="M26 257L334 257" fill="none" stroke="#65756e" stroke-width="1.2"/><path d="M26.0 251L26.0 262" fill="none" stroke="#65756e" stroke-width="1"/><text x="26.0" y="279" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">0</text><path d="M128.5 251L128.5 262" fill="none" stroke="#65756e" stroke-width="1"/><text x="128.5" y="279" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">1</text><path d="M231.0 251L231.0 262" fill="none" stroke="#65756e" stroke-width="1"/><text x="231.0" y="279" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">2</text><path d="M333.5 251L333.5 262" fill="none" stroke="#65756e" stroke-width="1"/><text x="333.5" y="279" font-size="15" font-weight="normal" text-anchor="middle" fill="#65756e">3</text><circle cx="87.5" cy="257" r="5" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><circle cx="251.50000000000003" cy="257" r="5" fill="#a45b30" stroke="#a45b30" stroke-width="2"/><path d="M333.5 241L333.5 267" fill="none" stroke="#16776d" stroke-width="2"/></svg><path d="M30 470L870 470" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="502" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">For M=B, [B]ₜ=⟨B⟩ₜ=t. The general equality in this chapter applies to continuous</text><text x="30" y="526" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">local martingales. For M=N−t with a rate-one Poisson N, [M]=N and ⟨M⟩=t. The</text><text x="30" y="550" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">arrival record is illustrative, not a proof; predictable does not mean</text><text x="30" y="574" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">foretelling the realized count. Partition convergence and localization retain</text><text x="30" y="598" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">the text’s hypotheses.</text></svg>