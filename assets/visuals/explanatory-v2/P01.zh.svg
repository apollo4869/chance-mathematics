<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 604" width="900" height="604" role="img" aria-label="同一格，三种结果"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="604" fill="white"/><text x="30" y="43" font-size="28" font-weight="bold" text-anchor="start" fill="#173f39">同一格，三种结果</text><path d="M30 62L870 62" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="160" y="144" font-size="70" font-weight="normal" text-anchor="middle" fill="#16776d">2</text><text x="160" y="185" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">左端取值</text><svg x="30" y="215" width="260" height="159" viewBox="0 0 360 220"><path d="M50 45L310 45" fill="none" stroke="#65756e" stroke-width="1.3"/><circle cx="50" cy="45" r="8" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="50" y="24" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">1</text><circle cx="310" cy="45" r="8" fill="white" stroke="#65756e" stroke-width="2"/><text x="310" y="24" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">3</text><path d="M50 60 Q50 108 163 121" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="180" cy="147" r="30" fill="white" stroke="#16776d" stroke-width="2"/><text x="180" y="157" font-size="30" font-weight="normal" text-anchor="middle" fill="#173f39">1</text></svg><text x="450" y="144" font-size="70" font-weight="normal" text-anchor="middle" fill="#16776d">6</text><text x="450" y="185" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">右端取值</text><svg x="320" y="215" width="260" height="159" viewBox="0 0 360 220"><path d="M50 45L310 45" fill="none" stroke="#65756e" stroke-width="1.3"/><circle cx="50" cy="45" r="8" fill="white" stroke="#65756e" stroke-width="2"/><text x="50" y="24" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">1</text><circle cx="310" cy="45" r="8" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="310" y="24" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">3</text><path d="M310 60 Q310 108 197 121" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="180" cy="147" r="30" fill="white" stroke="#16776d" stroke-width="2"/><text x="180" y="157" font-size="30" font-weight="normal" text-anchor="middle" fill="#173f39">3</text></svg><text x="740" y="144" font-size="70" font-weight="normal" text-anchor="middle" fill="#16776d">4</text><text x="740" y="185" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">对称端点</text><svg x="610" y="215" width="260" height="159" viewBox="0 0 360 220"><path d="M50 45L310 45" fill="none" stroke="#65756e" stroke-width="1.3"/><circle cx="50" cy="45" r="8" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="50" y="24" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">1</text><circle cx="310" cy="45" r="8" fill="#16776d" stroke="#16776d" stroke-width="2"/><text x="310" y="24" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">3</text><path d="M50 60L50 75" fill="none" stroke="#16776d" stroke-width="2"/><path d="M50 75L310 75" fill="none" stroke="#16776d" stroke-width="2"/><path d="M310 75L310 60" fill="none" stroke="#16776d" stroke-width="2"/><path d="M180 75L180 113" fill="none" stroke="#16776d" stroke-width="2"/><path d="M176.52027572711015 105.79642318117858L180 113" fill="none" stroke="#16776d" stroke-width="2"/><path d="M183.47972427288985 105.79642318117858L180 113" fill="none" stroke="#16776d" stroke-width="2"/><circle cx="180" cy="147" r="30" fill="white" stroke="#16776d" stroke-width="2"/><text x="180" y="157" font-size="30" font-weight="normal" text-anchor="middle" fill="#173f39">2</text></svg><text x="450" y="429" font-size="22" font-weight="normal" text-anchor="middle" fill="#173f39">增量同为2，所取的值分别为1、3、2。</text><path d="M30 475L870 475" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="506" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">图为确定性单格代数，不是Brownian路径面积。逐格右端−左端=(ΔX)²，对称−左端=(ΔX)²/2。连续半鞅</text><text x="30" y="529" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">在确定分割网格趋零时，对称端点和以ucp收敛：∫X∘dX=∫X dX+[X]/2；Brownian情形[B]ₜ=t。一般H、X</text><text x="30" y="552" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">用[H,X]。右端取值一般用到了本格未来；时间中点值未必等于端点值平均。</text></svg>