<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 812" width="900" height="812" role="img" aria-label="The branch stays. Samples may miss it."><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="812" fill="white"/><text x="30" y="43" font-size="28" font-weight="bold" text-anchor="start" fill="#173f39">The branch stays. Samples may miss it.</text><path d="M30 62L870 62" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="450" y="87" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">The fine line stays; the ribbon is density, not spatial thickness.</text><text x="220" y="112" font-size="25" font-weight="normal" text-anchor="middle" fill="#173f39">ε = 5%</text><svg x="20" y="128" width="410" height="318" viewBox="0 0 400 310"><path d="M245 135 Q292 75 355 85" transform="translate(0,-11)" fill="none" stroke="#16776d" stroke-opacity=".30" stroke-width="22.799999999999997" stroke-linecap="round" data-density="old"/><path d="M245 135 C205 195 130 230 48 195" transform="translate(0,-11)" fill="none" stroke="#a45b30" stroke-opacity=".65" stroke-width="0.6000000000000001" stroke-linecap="round" data-density="new"/><path d="M245 135 Q292 75 355 85" fill="none" stroke="#173f39" stroke-width="2" data-geometry="old"/><path d="M245 135 C205 195 130 230 48 195" fill="none" stroke="#173f39" stroke-width="2" data-geometry="new"/><circle cx="245" cy="135" r="5" fill="#173f39" stroke="#173f39" stroke-width="2"/><text x="258" y="161" font-size="18" font-weight="normal" text-anchor="start" fill="#173f39">ρ = 0</text><text x="322" y="46" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Old · length 1</text><text x="105" y="146" font-size="19" font-weight="normal" text-anchor="middle" fill="#a45b30">Long · length 2</text><text x="105" y="265" font-size="21" text-anchor="middle" fill="#a45b30" data-mass-label="new">mass 5%</text><text x="323" y="116" font-size="19" text-anchor="middle" fill="#16776d" data-mass-label="old">95%</text><circle cx="355" cy="85" r="3" fill="#173f39" stroke="#173f39" stroke-width="2"/><circle cx="48" cy="195" r="3" fill="#173f39" stroke="#173f39" stroke-width="2"/><g data-samples=""/></svg><text x="225" y="467" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">All five miss: 77.4%</text><text x="660" y="112" font-size="25" font-weight="normal" text-anchor="middle" fill="#173f39">ε = 40%</text><svg x="460" y="128" width="410" height="318" viewBox="0 0 400 310"><path d="M245 135 Q292 75 355 85" transform="translate(0,-11)" fill="none" stroke="#16776d" stroke-opacity=".30" stroke-width="14.399999999999999" stroke-linecap="round" data-density="old"/><path d="M245 135 C205 195 130 230 48 195" transform="translate(0,-11)" fill="none" stroke="#a45b30" stroke-opacity=".65" stroke-width="4.800000000000001" stroke-linecap="round" data-density="new"/><path d="M245 135 Q292 75 355 85" fill="none" stroke="#173f39" stroke-width="2" data-geometry="old"/><path d="M245 135 C205 195 130 230 48 195" fill="none" stroke="#173f39" stroke-width="2" data-geometry="new"/><circle cx="245" cy="135" r="5" fill="#173f39" stroke="#173f39" stroke-width="2"/><text x="258" y="161" font-size="18" font-weight="normal" text-anchor="start" fill="#173f39">ρ = 0</text><text x="322" y="46" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">Old · length 1</text><text x="105" y="146" font-size="19" font-weight="normal" text-anchor="middle" fill="#a45b30">Long · length 2</text><text x="105" y="265" font-size="21" text-anchor="middle" fill="#a45b30" data-mass-label="new">mass 40%</text><text x="323" y="116" font-size="19" text-anchor="middle" fill="#16776d" data-mass-label="old">60%</text><circle cx="355" cy="85" r="3" fill="#173f39" stroke="#173f39" stroke-width="2"/><circle cx="48" cy="195" r="3" fill="#173f39" stroke="#173f39" stroke-width="2"/><g data-samples=""/></svg><text x="665" y="467" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">All five miss: 7.8%</text><text x="160" y="512" font-size="23" text-anchor="middle" fill="#173f39">d<tspan baseline-shift="sub" font-size="16">GH</tspan> ≥ 1</text><text x="450" y="512" font-size="23" text-anchor="middle" fill="#173f39">d<tspan baseline-shift="super" font-size="15">r</tspan><tspan baseline-shift="sub" font-size="16">GP</tspan> ≤ ε</text><text x="740" y="512" font-size="23" text-anchor="middle" fill="#173f39">d<tspan baseline-shift="super" font-size="15">r</tspan><tspan baseline-shift="sub" font-size="16">GHP</tspan> ≥ 1</text><path d="M30 545L870 545" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="576" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">X is the old branch [0,1]; Y has both branches and is intrinsically [−2,1], with</text><text x="30" y="599" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">root 0. μ_ε=(1−ε)Unif[0,1]+εUnif[−2,0], 0&lt;ε&lt;1. Distances along the fine line</text><text x="30" y="622" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">stay fixed. The ribbon is not part of the metric space; mass is continuous, not</text><text x="30" y="645" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">atomic. Their widths follow densities 1−ε and ε/2; curves illustrate intrinsic</text><text x="30" y="668" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">tree distances. All five iid samples miss with probability (1−ε)⁵; simulation</text><text x="30" y="691" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">does not prove it. Draw simulates with fresh finite-precision uniform variates.</text><text x="30" y="714" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Moving the slider then reuses those uniforms as a coupling, not a new</text><text x="30" y="737" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">independent sample. Superscript r denotes rooted distance; GP identifies support</text><text x="30" y="760" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">plus root, while GHP uses one common embedding and the max convention.</text></svg>