<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 872" width="900" height="872" role="img" aria-label="Same records, different weights"><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="900" height="872" fill="white"/><text x="30" y="43" font-size="27" font-weight="bold" text-anchor="start" fill="#173f39">Same records, different weights</text><path d="M30 64L870 64" fill="none" stroke="#ccd9d1" stroke-width="1"/><svg x="125" y="90" width="650" height="471" viewBox="0 0 400 290"><text x="10" y="103" font-size="22" font-weight="normal" text-anchor="start" fill="#173f39">P</text><text x="10" y="222" font-size="22" font-weight="normal" text-anchor="start" fill="#173f39">Q</text><text x="67" y="29" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">++</text><path d="M67 43L67 78" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M67 130L67 183" fill="none" stroke="#ccd9d1" stroke-width="1"/><circle cx="67" cy="104" r="18" fill="#eaf2ee" stroke="#16776d" stroke-width="2"/><text x="67" y="153" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">1/4</text><circle cx="67" cy="220" r="27.0" fill="#f1e7df" stroke="#a45b30" stroke-width="2"/><text x="67" y="278" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">9/16</text><text x="158" y="29" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">+−</text><path d="M158 43L158 78" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M158 130L158 183" fill="none" stroke="#ccd9d1" stroke-width="1"/><circle cx="158" cy="104" r="18" fill="#eaf2ee" stroke="#16776d" stroke-width="2"/><text x="158" y="153" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">1/4</text><circle cx="158" cy="220" r="15.588457268119894" fill="#f1e7df" stroke="#a45b30" stroke-width="2"/><text x="158" y="278" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">3/16</text><text x="249" y="29" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">−+</text><path d="M249 43L249 78" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M249 130L249 183" fill="none" stroke="#ccd9d1" stroke-width="1"/><circle cx="249" cy="104" r="18" fill="#eaf2ee" stroke="#16776d" stroke-width="2"/><text x="249" y="153" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">1/4</text><circle cx="249" cy="220" r="15.588457268119894" fill="#f1e7df" stroke="#a45b30" stroke-width="2"/><text x="249" y="278" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">3/16</text><text x="340" y="29" font-size="21" font-weight="normal" text-anchor="middle" fill="#173f39">−−</text><path d="M340 43L340 78" fill="none" stroke="#ccd9d1" stroke-width="1"/><path d="M340 130L340 183" fill="none" stroke="#ccd9d1" stroke-width="1"/><circle cx="340" cy="104" r="18" fill="#eaf2ee" stroke="#16776d" stroke-width="2"/><text x="340" y="153" font-size="18" font-weight="normal" text-anchor="middle" fill="#173f39">1/4</text><circle cx="340" cy="220" r="9.0" fill="#f1e7df" stroke="#a45b30" stroke-width="2"/><text x="340" y="278" font-size="18" font-weight="normal" text-anchor="middle" fill="#a45b30">1/16</text></svg><text x="450" y="604" font-size="23" font-weight="normal" text-anchor="middle" fill="#173f39">θ=3/4: identical records, different normalized weights.</text><path d="M30 640L870 640" fill="none" stroke="#ccd9d1" stroke-width="1"/><text x="30" y="672" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">This finite analogy is not a Brownian simulation. P gives each two-step record</text><text x="30" y="696" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">probability 1/4; under Qθ the steps are independent with up probability θ.</text><text x="30" y="720" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Zθ=Qθ/P and E_P Zθ=1. Circle area, not radius, is proportional to probability.</text><text x="30" y="744" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">Only weights change. Brownian change of measure on a finite horizon separately</text><text x="30" y="768" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">requires a true density martingale of mean 1; a positive local martingale is</text><text x="30" y="792" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">insufficient. This is neither a Girsanov proof nor a claim of infinite-horizon</text><text x="30" y="816" font-size="17" font-weight="normal" text-anchor="start" fill="#65756e">equivalence.</text></svg>